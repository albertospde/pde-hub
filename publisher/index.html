<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookUp Publisher Edition</title>
<link rel="icon" href="assets/bookup-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --card-2:#eef4fa; --cyan:#0090c8; --cyan-dim:#e3f3fb;
    --text:#132033; --text-dim:#5b6b7d; --border:#d7e0ea; --grid:#e8edf3;
    --ok:#15803d; --ok-bg:#e9f7ee; --ko:#b91c1c; --ko-bg:#fdeceb; --warn:#9a5b00; --warn-bg:#fff4e0; --info:#005f86; --info-bg:#e3f3fb;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
    --prev:#a3adba; --shadow:0 12px 26px -18px rgba(20,45,90,.45);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1334; --card:#161f47; --card-2:#1c2754; --cyan:#33c3f0; --cyan-dim:#1c2f5e;
      --text:#e8ecf8; --text-dim:#97a3c9; --border:#2a3666; --grid:#222d5c;
      --ok:#4fd18b; --ok-bg:#14382f; --ko:#ff7a7a; --ko-bg:#40202f; --warn:#f0b84c; --warn-bg:#3a3020; --info:#33c3f0; --info-bg:#1c2f5e;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
      --prev:#5d6a93; --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1334; --card:#161f47; --card-2:#1c2754; --cyan:#33c3f0; --cyan-dim:#1c2f5e;
    --text:#e8ecf8; --text-dim:#97a3c9; --border:#2a3666; --grid:#222d5c;
    --ok:#4fd18b; --ok-bg:#14382f; --ko:#ff7a7a; --ko-bg:#40202f; --warn:#f0b84c; --warn-bg:#3a3020; --info:#33c3f0; --info-bg:#1c2f5e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --prev:#5d6a93; --shadow:none; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{font-size:16px}
  body{margin:0;font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

  /* ---------- menu laterale (stile BookUp) ---------- */
  .side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--border);padding:18px 12px 24px}
  .brand{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:6px}
  /* Logo BookUp Publisher Edition: logo BookUp con la dicitura larga quanto tutto il logo (dall'ala alla "p"), lettere distribuite */
  .bu-logo{container-type:inline-size;width:100%;background:#fff;border-radius:12px}
  .bu-logo img{display:block;width:100%;height:auto}
  .bu-ed{display:flex;justify-content:space-between;margin:-.6cqw 1.6% 0 1.1%;padding-bottom:2.5cqw;font-family:Montserrat,'Segoe UI',sans-serif;font-size:5.6cqw;font-weight:700;line-height:1}
  .bu-ed b{font-weight:700;color:#13297a} .bu-ed i{font-style:normal;font-weight:700;color:#1a8ff0} .bu-ed s{width:3cqw;text-decoration:none}
  .brand .bu-logo{max-width:236px}
  .editore-box{margin:12px 6px 4px;padding:10px 12px;border-radius:14px;background:linear-gradient(140deg,#e3f3fb,#eef1ff);border:1px solid var(--border)}
  :root[data-theme="dark"] .editore-box{background:var(--card-2)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .editore-box{background:var(--card-2)}}
  .editore-box .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
  .editore-box .nome{font-family:'Bree Serif',serif;font-size:18px;margin-top:2px}
  .editore-box .marchi{font-size:12px;color:var(--text-dim);margin-top:2px}
  .nav-g{display:block;margin:16px 10px 6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
  .nav a{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;margin:1px 0;border-radius:12px;color:var(--text);text-decoration:none;font-size:14.5px;font-weight:600;line-height:1.2}
  .nav a .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,var(--a1),var(--a2));color:#fff}
  .nav a .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .nav a:hover{background:var(--card-2)}
  .nav a.active{background:linear-gradient(140deg,var(--a1),var(--a2));color:#fff}
  .nav a.active .ic{background:rgba(255,255,255,.22)}
  .nav a .cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--ko);color:#fff;font-size:11.5px;font-weight:800;text-align:center}
  .nav a.active .cnt{background:rgba(255,255,255,.3)}

  /* ---------- testata ---------- */
  .main{min-width:0}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .top h1{margin:0;font-family:'Bree Serif',serif;font-weight:400;font-size:26px;line-height:1.1}
  .top .sub{color:var(--text-dim);font-size:14px;margin-top:3px}
  .top .dx{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);font-weight:600}
  select,input[type=text],input[type=search],input[type=date],textarea{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0}
  .demo{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
  .btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--card-2)}
  .btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .btn.pri:hover{filter:brightness(1.08)}

  /* ---------- contenuti ---------- */
  .content{padding:22px 28px 48px;max-width:1480px}
  .lead{margin:0 0 18px;color:var(--text-dim);font-size:15px;max-width:900px;line-height:1.5}
  .grid{display:grid;gap:16px;margin-bottom:16px}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:1150px){.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);min-width:0}
  .card h3{margin:0 0 2px;font-size:16px;font-weight:700}
  .card .h-sub{margin:0 0 12px;font-size:13px;color:var(--text-dim)}
  .card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .card-head .dx{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ch{position:relative;height:300px} .ch.sm{height:240px} .ch.lg{height:360px}
  .kpi{position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--k,var(--cyan))}
  .kpi .lab{font-size:12.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:28px;font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .foot{font-size:13px;color:var(--text-dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
  .delta.up{background:var(--ok-bg);color:var(--ok)} .delta.down{background:var(--ko-bg);color:var(--ko)} .delta.flat{background:var(--card-2);color:var(--text-dim)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.ko{background:var(--ko-bg);color:var(--ko)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mut{background:var(--card-2);color:var(--text-dim)}
  .insight{border-left:4px solid var(--cyan);background:var(--card)}
  .insight ul{margin:8px 0 0;padding-left:0;list-style:none}
  .insight li{padding:7px 0 7px 28px;position:relative;font-size:14.5px;line-height:1.45;border-bottom:1px dashed var(--border)}
  .insight li:last-child{border-bottom:none}
  .insight li::before{content:attr(data-i);position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--cyan-dim);color:var(--info)}
  .insight b{font-weight:800}
  .tw{overflow-x:auto;max-width:100%}
  .tw.scroll{max-height:460px;overflow-y:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .r{text-align:right} .tbl th.r{text-align:right}
  .tbl tbody tr.click{cursor:pointer} .tbl tbody tr.click:hover td{background:var(--card-2)} .tbl tbody tr.sel td{background:var(--cyan-dim)}
  .tbl .t-tit{font-weight:700} .tbl .t-sub{font-size:12px;color:var(--text-dim)}
  .bar-in{height:8px;border-radius:999px;background:var(--card-2);overflow:hidden;min-width:80px}
  .bar-in i{display:block;height:100%;border-radius:999px;background:var(--cyan)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-dim)}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .giri{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
  .giro{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer;text-align:left}
  .giro:hover{border-color:var(--cyan)}
  .giro.on{outline:2px solid var(--cyan);border-color:var(--cyan)}
  .giro .n{font-family:'Bree Serif',serif;font-size:19px}
  .giro .d{font-size:12.5px;color:var(--text-dim);margin:2px 0 8px}
  .giro:has(.giro-ck){position:relative;padding-bottom:36px}
  .giro-ck{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:grid;place-items:center;width:30px;height:24px;cursor:pointer}
  .giro-ck input{width:17px;height:17px;margin:0;accent-color:var(--cyan);cursor:pointer}
  .giro .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;margin-top:8px}
  .list-ev{display:flex;flex-direction:column;gap:10px}
  .ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
  .ev .dt{text-align:center;border-radius:12px;background:var(--cyan-dim);color:var(--info);padding:6px 0}
  .ev .dt b{display:block;font-size:22px;line-height:1} .ev .dt span{font-size:11.5px;font-weight:800;text-transform:uppercase}
  .ev .t{font-weight:700} .ev .m{font-size:13px;color:var(--text-dim);margin-top:2px}
  .ev.pass{opacity:.62}
  .alert-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
  .alert-card .gg{width:62px;text-align:center;border-radius:12px;padding:6px 0;font-weight:800}
  .alert-card .gg b{display:block;font-size:22px;line-height:1} .alert-card .gg span{font-size:11px;text-transform:uppercase}
  .sev-alta{background:var(--ko-bg);color:var(--ko)} .sev-media{background:var(--warn-bg);color:var(--warn)} .sev-bassa{background:var(--info-bg);color:var(--info)}
  .drop{border:2px dashed var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-dim);cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--cyan);background:var(--cyan-dim);color:var(--info)}
  .drop b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
  .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
  .check:last-child{border-bottom:none}
  .check .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;border:1px solid var(--border)}
  .check.done .ck{background:var(--ok-bg);color:var(--ok);border-color:transparent}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--text-dim)}
  .muted{color:var(--text-dim)} .small{font-size:13px}
  .note{font-size:13px;color:var(--text-dim);margin-top:10px}
  .empty{padding:24px;text-align:center;color:var(--text-dim)}
  .num{font-variant-numeric:tabular-nums}

  [hidden]{display:none !important}
  .sc-su{background:#fff1e9;color:#b4461b} .sc-giu{background:var(--info-bg);color:var(--info)}
  .sc-tab td{padding:6px 8px} .sc-nm{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cop{width:34px;height:48px;object-fit:cover;border-radius:4px;background:var(--card-2);cursor:zoom-in;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .cop.gr{width:46px;height:66px}
  .con-cop{display:flex;gap:10px;align-items:center}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,18,40,.75);display:grid;place-items:center;cursor:zoom-out}
  .lightbox img{max-width:90vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#fff}
  .ed-logo{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;display:grid;place-items:center}
  .ed-logo img{max-width:100%;max-height:84px;object-fit:contain;display:block}
  .editore-box.con-logo .lab{display:none}
  .editore-box.con-logo .nome{font-size:14px;margin-top:0;text-align:center}
  .editore-box.con-logo .marchi{font-size:11.5px;text-align:center}
  .editore-box.con-logo #ed-logo-az{text-align:center}
  .logo-az{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--info);cursor:pointer;text-decoration:none}
  .inv-tab{min-width:900px} .inv-tab td{vertical-align:top} .inv-desc{white-space:normal}
  .inv-tab td:nth-child(2){min-width:230px} .inv-tab td:nth-child(3){min-width:160px} .inv-tab td:nth-child(5) .t-sub{white-space:nowrap} .inv-tab td:nth-child(6){max-width:140px}
  .inv-tab td:last-child{width:96px} .inv-tab td:last-child .btn{display:block;width:100%;margin-bottom:4px;padding:4px 9px;font-size:12.5px}
  .leg{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px}
  .leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
  .leg li:last-child{border-bottom:none} .leg li.tot{font-weight:700}
  .leg i{width:12px;height:12px;border-radius:4px} .leg b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .leg span:not(.p){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leg span.p{color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
  .periodo-wrap{position:relative}
  .per-btn{font-weight:700;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pan-per{position:absolute;left:0;top:calc(100% + 8px);z-index:30;width:min(640px,92vw);box-shadow:0 18px 40px -12px rgba(20,45,90,.35)}
  .pan-per .pp-sez{margin-bottom:12px} .pan-per .pp-sez b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-bottom:6px}
  .pp-griglia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pp-griglia label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--text-dim);padding:6px;border-radius:10px}
  .pp-griglia label.pp-on{background:var(--cyan-dim);color:var(--info)}
  .pp-piede{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px}
  .pp-piede span{margin-right:auto}
  @media (max-width:700px){ .pp-griglia{grid-template-columns:minmax(0,1fr)} .pan-per{position:fixed;left:8px;right:8px;top:70px;width:auto} }
  .tag-demo{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
  .nav a.active .tag-demo{background:rgba(255,255,255,.25);color:#fff}
  .banner-demo{margin:0 0 16px;padding:12px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;line-height:1.45;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
  .utente{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
  .dati-al{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--info-bg);color:var(--info)}
  .login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
  .login form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .login h2{margin:8px 0 0;font-family:'Bree Serif',serif;font-weight:400;font-size:24px}
  .login label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--text-dim)}
  .login input{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:15px}
  .login .err{color:var(--ko);font-size:13px;min-height:1em;margin:0}
  .login-logo .bu-logo{max-width:300px}
  @media (max-width:900px){
    .app{grid-template-columns:minmax(0,1fr)}
    .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border);padding:12px 16px}
    .brand{border-bottom:none;padding-bottom:4px}
    .editore-box{margin:6px 0}
    .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
    .nav-g{display:none}
    .nav a{flex-shrink:0;white-space:nowrap;border:1px solid var(--border)}
    .top{position:static;padding:14px 16px}
    .content{padding:16px 16px 40px}
    .ev{grid-template-columns:56px minmax(0,1fr)} .ev > :last-child{grid-column:2}

<script>
/* =====================================================================
   PDE EDITORI — app per gli editori: ogni editore vede solo i suoi dati.
   Ora: dati dimostrativi generati per l'editore della sessione.
   Poi: SESSIONE arriva dal login Supabase e i dati dalle tabelle con RLS
   filtrata sul codice editore.
   ===================================================================== */
const SESSIONE = {
  codiceEditore: '763',
  nome: 'HarperCollins Italia',
  marchi: [
    { id: 'hc',  nome: 'HarperCollins' },
    { id: 'mid', nome: 'Midnight HC' },
    { id: 'hcr', nome: 'HarperCollins Ragazzi' },
  ],
};

const OGGI = (d => new Date(d.getFullYear(), d.getMonth(), d.getDate()))(new Date());
const ULTIMO_MESE = 9;          // solo per le sezioni di esempio: ottobre come ultimo mese chiuso
const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MESI_L = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const SEASON = [.78,.82,.95,.9,1,.86,.8,.68,1.02,1.08,1.25,1.65];
const ZONE = ['Nord-Ovest','Nord-Est','Centro','Sud','Isole'];

/* ---------------- utilità ---------------- */
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const fEur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
const fNum = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' });
const fDec = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const eur = n => fEur.format(n);
const num = n => fNum.format(n);
const pct = (n, d = 1) => (n * 100).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
function eurK(n){
  const a = Math.abs(n);
  if (a >= 1e6) return '€ ' + fDec.format(n / 1e6) + ' mln';
  if (a >= 1e4) return '€ ' + fNum.format(n / 1e3) + ' mila';
  return eur(n);
}
function numK(n){
  if (Math.abs(n) >= 1e6) return fDec.format(n / 1e6) + ' mln';
  if (Math.abs(n) >= 1e4) return fNum.format(n / 1e3) + ' mila';
  return num(n);
}
const varr = (a, b) => b ? (a - b) / b : 0;
function delta(a, b, inverti = false){
  const v = varr(a, b);
  if (Math.abs(v) < 0.005) return `<span class="delta flat">= 0,0%</span>`;
  const buono = inverti ? v < 0 : v > 0;
  return `<span class="delta ${buono ? 'up' : 'down'}">${v > 0 ? '▲ +' : '▼ '}${pct(v)}</span>`;
}
const fData = d => d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fDataL = d => d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffGg = (a, b) => Math.round((a - b) / 86400000);
const nomeMarchio = id => (SESSIONE.marchi.find(m => m.id === id) || {}).nome || id;

function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

/* ---------------- dati dimostrativi ---------------- */
function generaDati(codice){
  const R = rng(hash(codice));
  const rnd = (a, b) => a + R() * (b - a);
  const ri = (a, b) => Math.round(rnd(a, b));
  const pick = a => a[Math.floor(R() * a.length)];

  const SETTORI = {
    'Narrativa straniera': { g: .06,  b: [6000, 32000] },
    'Gialli e thriller':   { g: .15,  b: [5000, 28000] },
    'Romance':             { g: .22,  b: [4000, 22000] },
    'Narrativa italiana':  { g: -.04, b: [3000, 15000] },
    'Saggistica':          { g: -.07, b: [2500, 12000] },
    'Fantasy':             { g: .18,  b: [3500, 16000] },
    'Ragazzi':             { g: .05,  b: [3000, 18000] },
  };
  const RAW = [
    "La casa sul fiordo|Ingrid Solberg|hc|Narrativa straniera|19.00|-1",
    "Le stagioni di Charleston|Mary Ellen Hale|hc|Narrativa straniera|18.50|-1",
    "Il silenzio delle maree|Owen Cartwright|hc|Narrativa straniera|19.90|3",
    "Una ragione per restare|Claire Dawson|hc|Narrativa straniera|17.90|-1",
    "Il giardino d'inverno|Hanna Lindqvist|hc|Narrativa straniera|18.00|-1",
    "Le lettere di Savannah|Grace Whitmore|hc|Narrativa straniera|19.50|6",
    "Il caso dell'Orient Line|Thomas Ashby|hc|Gialli e thriller|18.90|-1",
    "Nebbia su Edimburgo|Fiona McLeod|hc|Gialli e thriller|19.90|-1",
    "L'ultima testimone|Daniel Hayes|hc|Gialli e thriller|18.00|1",
    "Codice notturno|Erik Nyström|hc|Gialli e thriller|17.90|-1",
    "Sangue a Notting Hill|Laura Pembroke|hc|Gialli e thriller|19.00|8",
    "La donna del lago scuro|Ruth Calloway|hc|Gialli e thriller|18.50|-1",
    "Le sorelle di via Garibaldi|Marta Ferrante|hc|Narrativa italiana|18.00|-1",
    "Un'estate a Procida|Luca Benassi|hc|Narrativa italiana|17.00|4",
    "La bottega dei ricordi|Giulia Serra|hc|Narrativa italiana|16.90|-1",
    "Il treno delle sei|Paolo Martini|hc|Narrativa italiana|17.50|-1",
    "Pensare lento|Robert Klein|hc|Saggistica|20.00|-1",
    "La mente che guarisce|Sarah Mitchell|hc|Saggistica|22.00|-1",
    "Breve storia del domani|Adrian Cole|hc|Saggistica|21.00|2",
    "Il potere delle abitudini gentili|Nora Bates|hc|Saggistica|18.00|-1",
    "La corona di cenere|Elara Voss|hc|Fantasy|20.90|-1",
    "Il regno sommerso|Kieran Blake|hc|Fantasy|19.90|5",
    "Figli della tempesta|Selene Marsh|hc|Fantasy|21.00|-1",
    "Promettimi l'inverno|Jade Sullivan|mid|Romance|14.90|-1",
    "Il nostro ultimo settembre|Ava Monroe|mid|Romance|14.90|-1",
    "Cuori a Manhattan|Lily Carter|mid|Romance|13.90|7",
    "Tutto quello che non ti ho detto|Emma Rhodes|mid|Romance|15.90|-1",
    "Sotto lo stesso cielo|Chloe Bennett|mid|Romance|14.90|-1",
    "Un bacio a mezzanotte|Sophie Lane|mid|Romance|13.90|9",
    "Il drago che aveva paura del buio|Milo Greenwood|hcr|Ragazzi|12.90|-1",
    "La scuola dei mostri gentili|Penny Archer|hcr|Ragazzi|13.90|-1",
    "Agenti segreti a quattro zampe|Ben Wilder|hcr|Ragazzi|12.00|5",
    "Il mistero della biblioteca|Rosie Quill|hcr|Ragazzi|14.90|-1",
    "Le avventure di Pip e Momo|Anna Frost|hcr|Ragazzi|9.90|-1",
    "Stelle in tasca|Lucy Brooks|hcr|Ragazzi|11.90|8",
  ];
  const titoli = RAW.map((r, i) => {
    const [titolo, autore, marchio, settore, prezzo, nov] = r.split('|');
    const S = SETTORI[settore];
    const base = rnd(S.b[0], S.b[1]);
    const g = S.g + rnd(-.12, .12);
    const novita = +nov;
    const resa = rnd(.14, .32);
    const v25 = [], v26 = [], r25 = [], r26 = [];
    for (let m = 0; m < 12; m++){
      const a = novita >= 0 ? 0 : Math.round(base / 12 * SEASON[m] * rnd(.85, 1.15));
      v25.push(a); r25.push(Math.round(a * (resa + rnd(-.02, .05)) / (1 - resa)));
      let b = null;
      if (m <= ULTIMO_MESE){
        if (novita >= 0) b = m < novita ? 0 : Math.round(base * .3 / 12 * SEASON[m] * Math.max(.7, 2.6 - .5 * (m - novita)) * rnd(.9, 1.1));
        else b = Math.round(base * (1 + g) / 12 * SEASON[m] * rnd(.85, 1.15));
      }
      v26.push(b); r26.push(b == null ? null : Math.round(b * resa / (1 - resa)));
    }
    const media3 = (v26[7] + v26[8] + v26[9]) / 3;
    const giacenza = Math.round(media3 * rnd(.6, 3.4));
    return {
      id: i, ean: '97888' + String(69000000 + i * 7919).slice(0, 8),
      titolo, autore, marchio, settore, prezzo: +prezzo, novita,
      uscita: novita >= 0 ? new Date(2026, novita, 10) : new Date(ri(2019, 2025), ri(0, 11), 15),
      v25, v26, r25, r26, stato: '1-1', giacenza, impegnato: Math.round(giacenza * rnd(0, .15)), giorniZero: 0,
    };
  });
  // titoli attivi (1-1) a giacenza zero, con giorni dall'azzeramento
  [[7, 63], [24, 41], [2, 26], [13, 17], [30, 9], [26, 3]].forEach(([i, gg]) => {
    Object.assign(titoli[i], { giacenza: 0, impegnato: 0, giorniZero: gg, ristampa: gg > 20 ? null : fData(addDays(OGGI, ri(7, 25))) });
  });
  titoli[4].stato = '1-2'; titoli[4].giacenza = ri(20, 80);
  titoli[28].stato = '1-2'; titoli[28].giacenza = ri(10, 60);
  titoli[19].stato = '4-1'; titoli[19].giacenza = ri(40, 120);

  const canali = [
    { n: 'Catene', q26: .33, q25: .35 },
    { n: 'Librerie indipendenti', q26: .27, q25: .27 },
    { n: 'Online', q26: .25, q25: .22 },
    { n: 'GDO', q26: .10, q25: .11 },
    { n: 'Cartolibrerie e altri', q26: .05, q25: .05 },
  ];
  const zonePeso = { 'Nord-Ovest': .31, 'Nord-Est': .2, 'Centro': .22, 'Sud': .18, 'Isole': .09 };

  const agenti = [
    'Marco Bellini|Nord-Ovest|Milano e provincia', 'Chiara Valli|Nord-Ovest|Piemonte e Liguria', 'Davide Rinaldi|Nord-Est|Veneto e Trentino',
    'Elena Fabbri|Nord-Est|Emilia-Romagna e FVG', 'Stefano Conti|Centro|Toscana e Umbria', 'Laura Mancini|Centro|Lazio e Marche',
    'Giorgio Esposito|Sud|Campania e Basilicata', 'Francesca Greco|Sud|Puglia e Calabria', 'Salvatore Riva|Isole|Sicilia e Sardegna',
  ].map((r, i) => { const [nome, zona, area] = r.split('|'); return { id: i, nome, zona, area, pv: ri(45, 140), var: rnd(-.06, .16) }; });

  const CL = [
    'Libreria del Corso|Milano|0|Librerie indipendenti', 'LibroPiù Megastore|Milano|0|Catene', 'Il Segnalibro|Monza|0|Librerie indipendenti',
    'Pagine Torinesi|Torino|1|Librerie indipendenti', 'LibroPiù Porta Nuova|Torino|1|Catene', 'La Lanterna|Genova|1|Librerie indipendenti',
    'Libreria Arcobaleno|Padova|2|Librerie indipendenti', 'Leggere & Co.|Verona|2|Catene', 'Il Ponte dei Libri|Trento|2|Librerie indipendenti',
    'Libreria Due Torri|Bologna|3|Librerie indipendenti', 'IperCasa reparto libri|Modena|3|GDO', 'Carta e Inchiostro|Trieste|3|Cartolibrerie e altri',
    'Libreria Ponte Vecchio|Firenze|4|Librerie indipendenti', 'LibroPiù Firenze|Firenze|4|Catene', 'Il Grifone|Perugia|4|Librerie indipendenti',
    'Libreria dei Fori|Roma|5|Librerie indipendenti', 'LibroPiù Termini|Roma|5|Catene', 'Libridì.it|Roma|5|Online',
    'Libreria Partenope|Napoli|6|Librerie indipendenti', 'IperSud reparto libri|Caserta|6|GDO', 'Libreria del Levante|Bari|7|Librerie indipendenti',
    'Leggere & Co. Lecce|Lecce|7|Catene', 'Libreria Trinacria|Palermo|8|Librerie indipendenti', 'Il Nuraghe|Cagliari|8|Librerie indipendenti',
  ];
  const SC = { 'Catene': [41, 46], 'Librerie indipendenti': [32, 38], 'Online': [43, 48], 'GDO': [39, 44], 'Cartolibrerie e altri': [29, 34] };
  const clienti = CL.map((r, i) => {
    const [nome, citta, ag, canale] = r.split('|');
    const a = agenti[+ag];
    const peso = canale === 'Catene' || canale === 'Online' ? rnd(2.2, 4) : canale === 'GDO' ? rnd(1.2, 2) : rnd(.6, 1.8);
    return { id: i, nome, citta, agente: a.id, zona: a.zona, canale, peso, sconto: rnd(SC[canale][0], SC[canale][1]) / 100, var: rnd(-.12, .22) };
  });

  const TIPI_INV = ['Vetrine e visibilità', 'Eventi e presentazioni', 'Sconto extra promozionale', 'Materiale POP', 'Co-marketing online'];
  const investimenti = [];
  clienti.forEach(c => {
    const nE = c.canale === 'Catene' || c.canale === 'Online' ? ri(2, 3) : ri(0, 2);
    const nP = ri(1, 2);
    for (let k = 0; k < nE; k++) investimenti.push({ cliente: c.id, chi: 'Editore', tipo: pick(TIPI_INV), importo: ri(4, 60) * 100, mese: ri(0, ULTIMO_MESE) });
    for (let k = 0; k < nP; k++) investimenti.push({ cliente: c.id, chi: 'PDE', tipo: pick(TIPI_INV), importo: ri(3, 35) * 100, mese: ri(0, ULTIMO_MESE) });
  });

  const POOL = ["Il faro di Skagen","Ritorno a Bath","La figlia del cartografo","Delitto in Cornovaglia","Le api di maggio","Notte a Lisbona",
    "Il patto dei corvi","Una cena per dieci","Il bambino delle stelle","Lontano da Boston","La sarta di Trieste","Il codice Vermeer","Sette inverni",
    "Ti aspetto a Londra","L'isola delle lanterne","Il segreto di Rosewood","Fiori di sale","Ombre su Praga","La regina del nord","Mezzanotte sul Danubio",
    "Il quaderno blu","Venti di Scozia","Il guardiano del bosco","Piccoli eroi crescono","Il club dei lettori segreti","Una casa per Olivia",
    "La promessa di Ellie","Il mare d'agosto","Inchiostro e ossa","Lezioni di felicità","Il volo dell'airone","Cento giorni a Kyoto",
    "La bambina e il lupo","Il ritorno del capitano","Neve su Oslo","Il diario di June","Le chiavi di casa","La notte dei fuochi"];
  const SETT_NOV = [['hc','Narrativa straniera'],['hc','Gialli e thriller'],['mid','Romance'],['hc','Narrativa italiana'],['hc','Saggistica'],['hc','Fantasy'],['hcr','Ragazzi']];
  let pi = 0;
  const giri = [];
  for (let i = 1; i <= 12; i++){
    const inizio = new Date(2026, i - 1, 5 + (i % 3));
    const fine = addDays(inizio, 22);
    const consegna = addDays(inizio, -15);
    const mu = (i + 1) % 12;
    const stato = fine < OGGI ? 'chiuso' : inizio <= OGGI ? 'in corso' : 'programmato';
    const nt = ri(3, 6);
    const tit = [];
    for (let k = 0; k < nt; k++){
      const [marchio, settore] = pick(SETT_NOV);
      tit.push({ titolo: POOL[pi++ % POOL.length], marchio, settore, prezzo: marchio === 'hcr' ? rnd(10, 15) : marchio === 'mid' ? rnd(13.9, 15.9) : rnd(17, 21), prenotato: Math.round(rnd(.6, 9) * (marchio === 'hc' ? 1000 : 700)) });
    }
    const totale = sum(tit.map(t => t.prenotato));
    const obiettivo = Math.round(totale * rnd(.92, 1.15) / 100) * 100;
    const avanz = stato === 'chiuso' ? 1 : stato === 'in corso' ? Math.min(1, diffGg(OGGI, inizio) / 22) : 0;
    tit.forEach(t => t.prenotato = Math.round(t.prenotato * (stato === 'in corso' ? Math.min(1, avanz * 1.25) : stato === 'programmato' ? 0 : 1)));
    const prenotato = sum(tit.map(t => t.prenotato));
    const fornito = stato === 'chiuso' ? Math.round(prenotato * rnd(1.02, 1.16)) : 0;
    const maturo = stato === 'chiuso' ? Math.min(1, diffGg(OGGI, fine) / 90) : 0;
    const venduto = Math.round(fornito * rnd(.58, .8) * (.45 + .55 * maturo));
    const resi = Math.round((fornito - venduto) * rnd(.25, .5) * maturo);
    const zone = ZONE.map(z => zonePeso[z] * rnd(.85, 1.15)); const zs = sum(zone);
    const ag = agenti.map(a => zonePeso[a.zona] / 2 * rnd(.7, 1.3)); const as = sum(ag);
    giri.push({
      n: i, inizio, fine, consegna, uscita: MESI_L[mu] + ' ' + (i + 1 >= 12 ? 2027 : 2026), stato, titoli: tit,
      obiettivo, prenotato, avanz, fornito, venduto, resi, maturo,
      prenotato25: Math.round(totale * rnd(.78, 1.08)),
      perZona: ZONE.map((z, k) => ({ zona: z, copie: Math.round(prenotato * zone[k] / zs) })),
      perAgente: agenti.map((a, k) => ({ agente: a.id, copie: Math.round(prenotato * ag[k] / as) })),
      clientiRaggiunti: stato === 'programmato' ? 0 : Math.round(ri(380, 520) * (stato === 'in corso' ? avanz * 1.2 : 1)),
    });
  }

  const eventi = [
    ['2026-10-17','Presentazione','Nebbia su Edimburgo: incontro con Fiona McLeod','Libreria Due Torri, Bologna','Fiona McLeod'],
    ['2026-10-24','Firmacopie','Firmacopie di Jade Sullivan','LibroPiù Megastore, Milano','Jade Sullivan'],
    ['2026-11-07','Festival','Festival della letteratura per ragazzi: laboratorio Pip e Momo','Libreria Arcobaleno, Padova','Anna Frost'],
    ['2026-11-14','Fiera','BookCity Milano: incontro con Ingrid Solberg','Milano','Ingrid Solberg'],
    ['2026-11-21','Presentazione','Sangue a Notting Hill: dialogo con Laura Pembroke','Libreria dei Fori, Roma','Laura Pembroke'],
    ['2026-11-26','Incontro librai','Presentazione novità del giro 12 ai librai del Centro','Firenze','—'],
    ['2026-11-29','Firmacopie','Un bacio a mezzanotte: firmacopie con Sophie Lane','LibroPiù Termini, Roma','Sophie Lane'],
    ['2026-12-05','Fiera','Più libri più liberi: stand e incontri HarperCollins','Roma, La Nuvola','Vari autori'],
    ['2026-12-12','Presentazione','Il regno sommerso: serata fantasy con Kieran Blake','Libreria Partenope, Napoli','Kieran Blake'],
    ['2026-12-17','Scuole','Stelle in tasca: incontro con le scuole primarie','Libreria del Levante, Bari','Lucy Brooks'],
    ['2027-01-23','Presentazione','Breve storia del domani: Adrian Cole in dialogo','Libreria Ponte Vecchio, Firenze','Adrian Cole'],
    ['2027-02-06','Festival','Festival del giallo: tavola rotonda','Torino','Thomas Ashby, Daniel Hayes'],
  ].map(([d, tipo, titolo, luogo, autore], i) => ({ id: 'e' + i, data: new Date(d), tipo, titolo, luogo, autore }));

  return { titoli, canali, agenti, clienti, investimenti, giri, eventi, TIPI_INV, rnd, ri };
}

/* derivati: dipendono dai titoli, quindi dalla scelta del marchio */
let STATO = { marchio: 'tutti', giro: null, agente: null, settore: null };
const titoliF = () => DB.titoli;   // sezioni di esempio: titoli inventati, senza filtro marchio
const fattMese = (L, anno) => MESI.map((_, m) => { const v = L.map(t => t['v' + anno][m]); return v[0] == null ? null : sum(L.map(t => (t['v' + anno][m] || 0) * t.prezzo)); });
const copieMese = (L, k) => MESI.map((_, m) => L[0][k][m] == null ? null : sum(L.map(t => t[k][m] || 0)));
const ytd = (arr, fino = ULTIMO_MESE) => sum(arr.slice(0, fino + 1));
const ytdTit = (t, k) => sum(t[k].slice(0, ULTIMO_MESE + 1));
const fattTot26 = () => ytd(fattMese(DB.titoli, 26));

function clientiConFatt(){
  const tot = fattTot26() * .52;
  const ps = sum(DB.clienti.map(c => c.peso));
  return DB.clienti.map(c => ({ ...c, fatt: Math.round(tot * c.peso / ps) }));
}
function agentiConFatt(){
  const cl = clientiConFatt();
  const tot = fattTot26();
  const pz = { 'Nord-Ovest': .31, 'Nord-Est': .2, 'Centro': .22, 'Sud': .18, 'Isole': .09 };
  return DB.agenti.map(a => {
    const fatt = Math.round(tot * pz[a.zona] / 2 * (a.pv / 92));
    const miei = cl.filter(c => c.agente === a.id);
    const sconto = miei.length ? sum(miei.map(c => c.sconto * c.fatt)) / sum(miei.map(c => c.fatt)) : 0;
    return { ...a, fatt, fatt25: Math.round(fatt / (1 + a.var)), clienti: miei, sconto };
  });
}
function fatture(){
  const R = rng(hash(SESSIONE.codiceEditore + 'fatt'));
  const fm = fattMese(DB.titoli, 26);
  const out = [];
  let n = 1;
  for (let m = 0; m <= ULTIMO_MESE; m++){
    const data = new Date(2026, m + 1, 0);
    const imp = Math.round(fm[m] * .38);
    const scad = addDays(data, 60);
    let stato = scad < OGGI ? 'Pagata' : 'Da incassare';
    if (m === 6) stato = 'Scaduta';
    out.push({ num: `HC-2026/${String(n++).padStart(3, '0')}`, tipo: 'Fattura', data, scad, imp, stato, desc: `Forniture ${MESI_L[m]} 2026` });
    const nc = Math.round(imp * (.08 + R() * .08));
    out.push({ num: `HC-2026/${String(n++).padStart(3, '0')}`, tipo: 'Nota di credito', data, scad, imp: -nc, stato: scad < OGGI ? 'Compensata' : 'Da compensare', desc: `Rese ${MESI_L[m]} 2026` });
  }
  return out.reverse();
}
function gfk(L){
  const R = rng(hash('gfk' + STATO.marchio));
  const c26 = copieMese(L, 'v26'), c25 = copieMese(L, 'v25');
  const w26 = [], w25 = [];
  for (let w = 0; w < 52; w++){
    const m = Math.min(11, Math.floor(w / 4.35));
    w25.push(Math.round(c25[m] / 4.35 * .9 * (.9 + R() * .2)));
    if (w < 45) w26.push(Math.round((c26[m] ?? c26[ULTIMO_MESE]) / 4.35 * .92 * (.9 + R() * .2)));
  }
  const top = [...L].sort((a, b) => b.v26[ULTIMO_MESE] - a.v26[ULTIMO_MESE]).slice(0, 10).map((t, i) => ({
    t, pos: [4, 11, 19, 27, 38, 52, 66, 81, 97, 120][i] + Math.floor(R() * 6), sett: 2 + Math.floor(R() * 30),
    ult: Math.round(t.v26[ULTIMO_MESE] / 4.35 * .92),
  }));
  return { w26, w25, top, quota26: .0214, quota25: .0193, rank26: 14, rank25: 16 };
}

  afterDraw(c, _a, o){
    if (!o || !o.testo) return;
    const { ctx, chartArea: { left, right, top, bottom } } = c;
    const x = (left + right) / 2, y = (top + bottom) / 2;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = css('--text'); ctx.font = "800 19px 'DM Sans'"; ctx.fillText(o.testo, x, y - 7);

function torta(id, labels, valori, opz = {}){
  const el = document.getElementById(id); if (!el) return;
  const tot = sum(valori), colori = opz.colori || SER().slice(0, valori.length);
  const fmt = v => opz.eur ? eurK(v) : numK(v);
  const box = el.parentElement; box.style.height = '160px';
  let leg = box.nextElementSibling && box.nextElementSibling.classList.contains('leg') ? box.nextElementSibling : null;
  if (!leg) { leg = document.createElement('ul'); leg.className = 'leg'; box.after(leg); }
  leg.innerHTML = labels.map((l, i) => `<li><i style="background:${colori[i]}"></i><span>${esc(l)}</span><b>${fmt(valori[i])}</b><span class="p">${tot ? pct(valori[i] / tot) : '—'}</span></li>`).join('')

  return mk(id, {
    type: 'doughnut',

    options: {

}

function periodi(){
  const u = SESS.ultimo_giorno, y = +u.slice(0, 4), sc = SCELTA;
  let dal, al, nome;
  if (sc.tipo === 'rapido'){
    [dal, al] = { ultimo: [u, u], '7': [piuGg(u, -6), u], '30': [piuGg(u, -29), u], mese: [u.slice(0, 8) + '01', u], anno: [`${y}-01-01`, u], annoprec: [`${y - 1}-01-01`, `${y - 1}-12-31`] }[sc.rapido];
    nome = sc.rapido === 'anno' ? `Da inizio anno ${y}` : sc.rapido === 'annoprec' ? `Anno ${y - 1}` : RAPIDI.find(x => x[0] === sc.rapido)[1];
  } else if (sc.tipo === 'mese'){
    dal = sc.mese + '-01'; const fine = iso(new Date(+sc.mese.slice(0, 4), +sc.mese.slice(5, 7), 0)); al = fine < u ? fine : u;
    nome = `${titleCase(MESI_L[+sc.mese.slice(5, 7) - 1])} ${sc.mese.slice(0, 4)}`;
  } else if (sc.tipo === 'settimana'){
    dal = sc.settimana; al = piuGg(dal, 6); if (al > u) al = u; nome = 'Settimana';
  } else if (sc.tipo === 'giorno'){
    dal = al = sc.giorno; nome = 'Giorno';
  } else { dal = sc.dal; al = sc.al; nome = 'Periodo'; }
  const grana = sc.grana || (sc.tipo === 'rapido' && ['anno', 'annoprec'].includes(sc.rapido) ? 'mese' : granaAuto(dal, al));
  const date = dal === al ? fData(pd(dal)) : `${fData(pd(dal))} – ${fData(pd(al))}`;

  while (k <= al) { chiavi.push(k); k = grana === 'mese' ? iso(new Date(+k.slice(0, 4), +k.slice(5, 7), 1)) : piuGg(k, grana === 'settimana' ? 7 : 1); }

  return { dal, al, grana, chiavi, labels, Y, ultimo: pd(u), nome, date, etichetta: `${nome} (${date})`, prima,

async function rpc(nome, args){

async function caricaEditore(codice){
  const p = { p_editore: codice };
  const [vendite, titoli, giri, gfk, materiali, mesiCli, meli, inv, fatt, mensili] = await Promise.all([
    rpc('ed_vendite_periodo', { ...p, p_dal: PER.dal, p_al: PER.al, p_grana: PER.grana }),
    rpc('ed_titoli_periodo', { ...p, p_dal: PER.dal, p_al: PER.al }),
    rpc('ed_giri', p), rpc('ed_gfk', p), rpc('ed_materiali', p), rpc('ed_clienti_mesi', p),
    rpc('ed_meli_lista', p), rpc('ed_investimenti_lista', p), rpc('ed_fatture_lista', p), rpc('ed_vendite_mese', p),
  ]);
  vendite.forEach(v => v.d = pd(v.periodo));
  mensili.forEach(v => v.d = pd(v.mese));
  giri.forEach(g => {
    g.inizio = pd(g.inizio); g.fine = pd(g.fine); g.consegna = pd(g.consegna); g.titoli ||= [];
    g.obiettivo = sum(g.titoli.map(t => +t.obiettivo)); g.prenotato = sum(g.titoli.map(t => +t.prenotato));
    g.cf = sum(g.titoli.map(t => +t.cf)); g.cr = sum(g.titoli.map(t => +t.cr));
    g.stato = !g.inizio || !g.fine ? 'senza date' : g.fine < OGGI ? 'chiuso' : g.inizio <= OGGI ? 'in corso' : 'programmato';
  });
  R = { vendite, titoli, giri, gfk: gfk || { righe: [] }, materiali: materiali || [], mesiCli: mesiCli || [], clienti: {}, agenti: {}, giriDett: {},
        meli: meli || { righe: [] }, inv: inv || [], fatt: fatt || { perc: .05, fatture: [] }, anag: null, mensili };
  R.titoliMap = new Map(titoli.map(t => [t.ean, t]));
  R.meliMap = new Map((R.meli.righe || []).map(m => [m.ean, m]));
  const opz = opzioniPeriodoCli();
  if (opz.length) await clientiPer(opz[0].v);   // nomi degli agenti, servono anche ai giri
}

const totP = (rows, prima, f) => sum(rows.filter(v => !!v.prima === prima).map(f));
const serieP = (rows, prima, f) => { const m = new Map(); rows.filter(v => !!v.prima === prima).forEach(v => m.set(v.periodo, (m.get(v.periodo) || 0) + f(v))); return PER.chiavi.map(k => m.has(k) ? m.get(k) : (prima ? null : 0)); };

/* ---- clienti (ed_cliente_mese): solo i mesi con il dettaglio completo ---- */
function opzioniPeriodoCli(){
  const ms = R.mesiCli.filter(x => +x.copertura >= .98).map(x => pd(x.mese)).sort((a, b) => a - b);
  const blocchi = []; let cur = null;
  ms.forEach(d => {
    if (cur && d.getFullYear() * 12 + d.getMonth() === cur.b.getFullYear() * 12 + cur.b.getMonth() + 1) cur.b = d;
    else { cur = { a: d, b: d }; blocchi.push(cur); }
  });
  const lab = d => `${MESI_L[d.getMonth()]} ${d.getFullYear()}` + (d.getFullYear() === PER.ultimo.getFullYear() && d.getMonth() === PER.ultimo.getMonth() ? ` (fino al ${PER.ultimo.getDate()})` : '');
  const out = [];
  [...ms].reverse().forEach(d => out.push({ v: iso(d) + '|' + iso(d), label: lab(d) }));
  blocchi.filter(b => b.a < b.b).reverse().forEach(b => out.push({ v: iso(b.a) + '|' + iso(b.b), label: `${MESI_L[b.a.getMonth()]}${b.a.getFullYear() !== b.b.getFullYear() ? ' ' + b.a.getFullYear() : ''}–${MESI_L[b.b.getMonth()]} ${b.b.getFullYear()}` }));
  return out;
}
async function clientiPer(k){
  if (R.clienti[k]) return R.clienti[k];
  const [dal, al] = k.split('|').map(pd);
  const D = await rpc('ed_clienti', { p_editore: ED.codice_editore, p_dal: iso(dal), p_al: iso(al),
    p_dal_prima: iso(new Date(dal.getFullYear() - 1, dal.getMonth(), 1)), p_al_prima: iso(new Date(al.getFullYear() - 1, al.getMonth(), 1)) });
  (D.agenti || []).forEach(a => R.agenti[a.codice] = { nome: titleCase(a.nome), reale: !!a.reale });
  (D.clienti || []).forEach(c => {
    ['cf', 'cr', 'lf', 'lr', 'nf', 'nr', 'lf1', 'lr1'].forEach(x => c[x] = +c[x] || 0);
    c.zona = zonaDi(c.provincia, c.regione);
    const reali = (c.agenti || []).filter(a => R.agenti[a]?.reale).sort();
    c.agente = reali[0] || null;
    c.direzionale = !c.agente && (c.agenti || []).some(a => SEDE.includes(a));
    c.senzaAgente = !c.agente && !c.direzionale;
    c.f = c.lf - c.lr; c.n = c.nf - c.nr; c.f1 = c.lf1 - c.lr1;
    c.sconto = c.lf > 0 ? 1 - c.nf / c.lf : null;
    c.nome = titleCase(c.nome); c.citta = titleCase(c.citta);
  });
  R.clienti[k] = D;
  return D;
}

/* ---------- Settori: generi Messaggerie e collane ---------- */
function aggPer(chiave){
  const map = {};
  TF().forEach(t => {
    const k = chiave(t);
    const x = map[k] ||= { n: k, f: 0, f1: 0, cf: 0, cr: 0, nt: 0 };
    x.f += t.lf - t.lr; x.f1 += t.lf1 - t.lr1; x.cf += t.cf; x.cr += t.cr; if (t.cf > 0) x.nt++;
  });
  const righe = Object.values(map).sort((a, b) => b.f - a.f);
  const tot = sum(righe.map(x => Math.max(0, x.f)));
  righe.forEach(x => { x.quota = tot ? Math.max(0, x.f) / tot : 0; x.var = x.f1 > 0 ? varr(x.f, x.f1) : null; x.resa = x.cf ? x.cr / x.cf : 0; });
  return righe;
}
const collaneAgg = () => aggPer(t => t.collana || 'Senza collana');
function generiAgg(){
  const rilevati = (R.meli.righe || []).some(m => m.genere);
  return { rilevati, righe: rilevati ? aggPer(t => genereDi(t.ean) || 'Genere non rilevato') : [] };
}
function tabellaSettori(righe, nome, Y){
  const maxQ = righe[0] ? righe[0].quota || 1 : 1;
  return `<div class="tw scroll"><table class="tbl"><thead><tr><th>${nome}</th><th class="r">Titoli</th><th class="r">Venduto</th><th>Quota</th><th class="r">vs ${Y - 1}</th><th class="r">Resa</th></tr></thead>
    <tbody>${righe.map(x => `<tr><td class="t-tit">${esc(x.n)}</td><td class="r">${x.nt}</td><td class="r">${eur(x.f)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar-in" style="flex:1"><i style="width:${x.quota / maxQ * 100}%"></i></div><span class="small num">${pct(x.quota)}</span></div></td>
      <td class="r">${x.var == null ? '<span class="pill mut">nuovo</span>' : delta(x.f, x.f1)}</td><td class="r">${pct(x.resa)}</td></tr>`).join('')}</tbody></table></div>`;
}

        <div class="card"><h3>Prenotato per zona</h3><p class="h-sub">Dove si trovano i punti vendita</p><div class="ch"><canvas id="c-gz"></canvas></div></div>

  },
  init(){
    document.querySelectorAll('#ch-anno .chip').forEach(b => b.addEventListener('click', () => { STATO.annoGiri = b.dataset.a; render(); }));
    document.querySelectorAll('.giro[data-g]').forEach(b => b.addEventListener('click', e => {

    document.querySelectorAll('[data-ck]').forEach(ck => ck.addEventListener('change', () => {
      const k = ck.dataset.ck, L = new Set(STATO.giriSel);

    }));
    $('#b-giri-uno')?.addEventListener('click', () => { STATO.giriSel = [R.giri[0].chiave]; render(); });
    const D = this._D, s = SER();
    if (!D || !this._sel || !sum(this._sel.map(g => g.prenotato))) return;
    const gr = {}; (D.per_canale || []).forEach(c => gr[nomeGruppo(c.gruppo)] = (gr[nomeGruppo(c.gruppo)] || 0) + +c.copie);
    const ge = Object.entries(gr).sort((a, b) => b[1] - a[1]);
    torta('c-gc', ge.map(x => x[0]), ge.map(x => x[1]), { centroSub: 'copie' });
    const pa = {}; (D.per_agente || []).filter(a => a.agente !== 'DIREZIONALE').forEach(a => { const n = nomeAgente(a.agente); pa[n] ||= { copie: 0, clienti: 0 }; pa[n].copie += +a.copie; pa[n].clienti += +a.clienti; });
    const ag = Object.entries(pa).sort((a, b) => b[1].copie - a[1].copie);
    mk('c-ga', { type: 'bar', data: { labels: ag.map(a => a[0]), datasets: [barre('Copie prenotate', ag.map(a => a[1].copie), s[0], { maxBarThickness: 16 })] },
      options: { indexAxis: 'y', scales: { x: { ticks: tickNum }, y: { grid: { display: false }, ticks: { autoSkip: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${num(c.parsed.x)} copie · ${num(ag[c.dataIndex][1].clienti)} punti vendita` } } } } });
    const z = {}; (D.per_zona || []).forEach(r => { const k = zonaDi(r.provincia, r.regione); z[k] = (z[k] || 0) + +r.copie; });

    torta('c-gz', zl, zl.map(k => z[k]), { centroSub: 'copie' });
  },
};

/* ---------- Fine giro: il giro in lavorazione (o, a giro chiuso, l'ultimo lavorato) con avanzamento e consuntivo ---------- */
const giroInLavorazione = () => R.giri.find(g => g.stato === 'in corso') || R.giri.find(g => g.stato === 'chiuso') || null;
S.finegiri = {
  titolo: 'Fine giro', sub: () => { const g = giroInLavorazione(); return g ? `${nomeGiro(g)} · ${g.stato === 'in corso' ? 'in lavorazione' : 'ultimo giro lavorato, chiuso il ' + fData(g.fine)}` : 'Nessun giro in lavorazione'; },
  async prepara(){ const g = giroInLavorazione(); this._g = g; this._D = g ? await dettaglioGiri([g.chiave]) : null; },
  html(){
    const g = this._g, D = this._D;
    if (!g) return vuoto('Non c\'è un giro in lavorazione né un giro chiuso con titoli dell\'editore. <a href="#giri">Vedi tutti i giri</a>');
    const inCorso = g.stato === 'in corso';
    const tot = g.inizio && g.fine ? diffGg(g.fine, g.inizio) + 1 : null;
    const fatti = tot ? Math.min(tot, Math.max(1, diffGg(OGGI, g.inizio) + 1)) : null;
    const ritmo = fatti ? g.prenotato / fatti : null;
    const stima = inCorso && ritmo ? Math.round(ritmo * tot) : null;
    const P = g.prenotato, O = g.obiettivo;
    const tit = g.titoli.map(t => ({ ...t, perc: +t.obiettivo ? t.prenotato / t.obiettivo : null })).sort((a, b) => (+b.obiettivo) - (+a.obiettivo) || b.prenotato - a.prenotato);
    const indietro = tit.filter(t => t.perc != null && t.perc < .9).length;
    const dir = (D.per_agente || []).find(a => a.agente === 'DIREZIONALE');
    this._d = { g, D };
    return `
      <p class="lead">${inCorso ? `Il giro su cui si sta lavorando: quanto è stato prenotato finora, a che ritmo e dove si arriva a fine giro se il ritmo resta questo.`
        : `Il giro è chiuso: qui resta l'ultimo giro lavorato, con il consuntivo Messaggerie, finché non parte il prossimo.`} <a href="#giri">Tutti i giri →</a></p>
      <div class="grid g-kpi">
        ${kpi('Prenotato', num(P), `<span>copie${O ? ' su obiettivo ' + num(O) : ''}</span>`, '--s1')}
        ${kpi('Obiettivo raggiunto', O ? pct(P / O, 0) : '—', `<span>${indietro ? num(indietro) + ' titoli sotto il 90%' : 'tutti i titoli almeno al 90%'}</span>`, '--s3')}
        ${inCorso ? kpi('Giorni', `${fatti} di ${tot}`, `<span>${fData(g.inizio)} – ${fData(g.fine)} · mancano ${tot - fatti}</span>`, '--s7')
          : kpi('Giro chiuso', fData(g.fine), `<span>dal ${fData(g.inizio)} · ${tot || '—'} giorni</span>`, '--s7')}
        ${kpi('Ritmo', ritmo ? num(Math.round(ritmo)) : '—', '<span>copie prenotate al giorno</span>', '--s4')}
        ${inCorso ? kpi('Stima a fine giro', stima ? num(stima) : '—', stima && O ? `${pillPerc(stima / O)} <span>dell'obiettivo, a questo ritmo</span>` : '<span>a questo ritmo</span>', '--s2')
          : kpi('Venduto a oggi', num(g.cf - g.cr), `<span>fornito ${num(g.cf)} · resa ${g.cf ? pct(g.cr / g.cf) : '—'}</span>`, '--s2')}
        ${kpi('Punti vendita', num(D.clienti || 0), '<span>che hanno prenotato</span>', '--s8')}
      </div>
      <div class="card" style="margin-bottom:16px"><h3>Avanzamento dei titoli</h3><p class="h-sub">Prenotato sull'obiettivo, titolo per titolo${inCorso ? '' : ', con il consuntivo Messaggerie'}</p>
        <div class="tw scroll"><table class="tbl"><thead><tr><th>Titolo</th><th>Uscita</th><th class="r">Obiettivo</th><th class="r">Prenotato</th><th style="min-width:160px">Avanzamento</th>${inCorso ? '' : '<th class="r">Fornito</th><th class="r">Venduto</th><th class="r">Resa</th>'}</tr></thead>
        <tbody>${tit.map(t => `<tr><td><div class="con-cop">${cop(t.ean)}<div><div class="t-tit">${esc(titleCase(t.titolo))}</div><div class="t-sub">${esc(titleCase(t.autore || ''))} · EAN ${esc(t.ean)}</div></div></div></td>
          <td class="small">${esc(titleCase(t.uscita || ''))}</td><td class="r">${num(+t.obiettivo)}</td><td class="r t-tit">${num(+t.prenotato)}</td>
          <td>${t.perc != null ? `<div style="display:flex;align-items:center;gap:8px"><div class="bar-in" style="flex:1"><i style="width:${Math.min(100, t.perc * 100)}%;background:${t.perc >= 1 ? 'var(--ok)' : t.perc >= .9 ? 'var(--warn)' : 'var(--cyan)'}"></i></div>${pillPerc(t.perc)}</div>` : '<span class="pill mut">senza obiettivo</span>'}</td>
          ${inCorso ? '' : `<td class="r">${num(+t.cf)}</td><td class="r t-tit">${num(t.cf - t.cr)}</td><td class="r">${+t.cf ? pct(t.cr / t.cf) : '—'}</td>`}</tr>`).join('')}</tbody></table></div></div>
      ${P ? `<div class="grid g2">
        <div class="card"><h3>Agenti</h3><p class="h-sub">Copie raccolte da ogni agente PDE sul territorio${dir ? ` · clienti direzionali: ${num(dir.copie)} copie in ${num(dir.clienti)} punti vendita` : ''}</p><div class="ch" style="height:${Math.max(260, (D.per_agente || []).length * 24 + 60)}px"><canvas id="c-fga"></canvas></div></div>
        <div><div class="card" style="margin-bottom:16px"><h3>Per canale</h3><p class="h-sub">Copie prenotate</p><div class="ch"><canvas id="c-fgc"></canvas></div></div>
          <div class="card"><h3>Per zona</h3><p class="h-sub">Copie prenotate</p><div class="ch"><canvas id="c-fgz"></canvas></div></div></div>
      </div>` : ''}`;
  },
  init(){
    if (!this._d || !this._d.g.prenotato) return;
    const { D } = this._d, s = SER();
    const pa = {}; (D.per_agente || []).filter(a => a.agente !== 'DIREZIONALE').forEach(a => { const n = nomeAgente(a.agente); pa[n] ||= { copie: 0, clienti: 0 }; pa[n].copie += +a.copie; pa[n].clienti += +a.clienti; });
    const ag = Object.entries(pa).sort((a, b) => b[1].copie - a[1].copie);
    mk('c-fga', { type: 'bar', data: { labels: ag.map(a => a[0]), datasets: [barre('Copie prenotate', ag.map(a => a[1].copie), s[0], { maxBarThickness: 16 })] },
      options: { indexAxis: 'y', scales: { x: { ticks: tickNum }, y: { grid: { display: false }, ticks: { autoSkip: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${num(c.parsed.x)} copie · ${num(ag[c.dataIndex][1].clienti)} punti vendita` } } } } });
    const gr = {}; (D.per_canale || []).forEach(c => gr[nomeGruppo(c.gruppo)] = (gr[nomeGruppo(c.gruppo)] || 0) + +c.copie);
    const ge = Object.entries(gr).sort((a, b) => b[1] - a[1]);
    torta('c-fgc', ge.map(x => x[0]), ge.map(x => x[1]), { centroSub: 'copie' });
    const z = {}; (D.per_zona || []).forEach(r => { const k = zonaDi(r.provincia, r.regione); z[k] = (z[k] || 0) + +r.copie; });
    const zl = ZONE_ND.filter(k => z[k]);
    torta('c-fgz', zl, zl.map(k => z[k]), { centroSub: 'copie' });
  },
};

/* ---------- Agenti e zone: solo agenti reali, esclusi i clienti direzionali ---------- */
S.agenti = {
  titolo: 'Agenti e zone', sub: () => `Gli agenti PDE sul territorio · ${etichettaPerCli()}`,
  async prepara(){ this._D = await clientiCorrenti(); },
  html(){
    const D = this._D;
    if (!D) return vuoto('Il dettaglio per cliente non è ancora disponibile.');
    const cl = D.clienti.filter(c => c.agente);
    const dir = D.clienti.filter(c => c.direzionale), senza = D.clienti.filter(c => c.senzaAgente);
    const inCorso = R.giri.filter(g => g.stato === 'in corso');
    const pren = {};
    // agenti reali, uniti per nome (uno stesso agente può avere più codici)
    const per = {};
    (D.agenti || []).filter(a => a.reale).forEach(a => {
      const n = titleCase(a.nome);
      const x = per[n] ||= { nome: n, codici: [], clientiAss: 0 };
      x.codici.push(a.codice); x.clientiAss += +a.clienti;
    });
    const ag = Object.values(per).map(a => {
      const miei = cl.filter(c => a.codici.includes(c.agente));
      const zc = {}; miei.forEach(c => zc[c.zona] = (zc[c.zona] || 0) + 1);
      const zona = Object.entries(zc).sort((x, y) => y[1] - x[1])[0]?.[0] || 'N.D.';
      const lf = sum(miei.map(c => c.lf)), nf = sum(miei.map(c => c.nf));
      return { ...a, miei, zona, f: sum(miei.map(c => c.f)), sconto: lf ? 1 - nf / lf : null };
    }).sort((a, b) => b.f - a.f);
    if (!ag.find(a => a.nome === STATO.agente)) STATO.agente = ag[0]?.nome;
    const a = ag.find(x => x.nome === STATO.agente);
    const zone = ZONE_ND.map(z => ({ z, f: sum(cl.filter(c => c.zona === z).map(c => c.f)), n: cl.filter(c => c.zona === z && c.f > 0).length })).filter(x => x.n || x.f);
    this._d = { ag, zone };
    return `
      <div class="card-head" style="margin-bottom:14px"><p class="lead" style="margin:0;flex:1">${ag.length} agenti PDE seguono sul territorio i punti vendita dell'editore. Sono esclusi i clienti direzionali, seguiti dalla sede.</p><div class="dx">${selPerCli()}</div></div>
      <div class="grid g-kpi">${zone.map((z, i) => kpi(z.z, eurK(z.f), `<span>${num(z.n)} punti vendita attivi</span>`, '--s' + (i + 1))).join('')}</div>
      <div class="grid g2">
        <div class="card"><h3>Venduto per agente</h3><p class="h-sub">A prezzo di copertina · ${esc(etichettaPerCli())}</p><div class="ch" style="height:${Math.max(280, ag.length * 24 + 60)}px"><canvas id="c-ag"></canvas></div></div>
        <div class="card"><h3>Venduto per zona</h3><p class="h-sub">${esc(etichettaPerCli())}, esclusi i direzionali</p><div class="ch"><canvas id="c-zo"></canvas></div>
          <p class="note">Fuori da questi conti: clienti direzionali ${eurK(sum(dir.map(c => c.f)))} (${num(dir.length)})${senza.length ? `, clienti senza agente assegnato ${eurK(sum(senza.map(c => c.f)))} (${num(senza.length)})` : ''}.</p></div>
      </div>
      <div class="grid g2">
        <div class="card"><h3>Agenti</h3><p class="h-sub">Clicca una riga per i suoi punti vendita</p>
          <div class="tw scroll"><table class="tbl"><thead><tr><th>Agente</th><th>Zona</th><th class="r">Punti vendita</th><th class="r">Venduto</th><th class="r">Sconto medio</th></tr></thead>
          <tbody>${ag.map(x => `<tr class="click ${a && x.nome === a.nome ? 'sel' : ''}" data-a="${esc(x.nome)}"><td class="t-tit">${esc(x.nome)}</td><td>${esc(x.zona)}</td>
            <td class="r">${num(x.clientiAss)}</td><td class="r">${eur(x.f)}</td><td class="r">${x.sconto != null ? pct(x.sconto) : '—'}</td></tr>`).join('')}</tbody></table></div></div>
        <div class="card">${a ? `<h3>${esc(a.nome)}</h3><p class="h-sub">${esc(a.zona)} · ${num(a.clientiAss)} punti vendita assegnati · ${num(a.miei.filter(c => c.f > 0).length)} con venduto nel periodo</p>
          <div class="tw scroll"><table class="tbl"><thead><tr><th>Punto vendita</th><th>Canale</th><th class="r">Venduto</th><th class="r">Sconto</th></tr></thead>
          <tbody>${a.miei.sort((x, y) => y.f - x.f).slice(0, 60).map(c => `<tr><td><div class="t-tit">${esc(c.nome)}</div><div class="t-sub">${esc(c.citta || '')}${c.provincia ? ' (' + esc(c.provincia) + ')' : ''}</div></td><td class="small">${esc(c.canale || nomeGruppo(c.canale_gruppo))}</td><td class="r">${eur(c.f)}</td><td class="r">${c.sconto != null ? pct(c.sconto) : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nessun movimento nel periodo</td></tr>'}</tbody></table></div>` : '<div class="empty">Nessun agente</div>'}</div>
      </div>${notaCopertura()}`;
  },
  init(){
    agganciaPerCli();
    if (!this._d) return;
    const { ag, zone } = this._d, s = SER();
    const col = z => ZONE.includes(z) ? s[ZONE.indexOf(z)] : css('--prev');
    mk('c-ag', { type: 'bar', data: { labels: ag.map(a => a.nome), datasets: [barre('Venduto', ag.map(a => a.f), ag.map(a => col(a.zona)), { maxBarThickness: 16 })] },
      options: { indexAxis: 'y', scales: { x: { ticks: tickEur }, y: { grid: { display: false }, ticks: { autoSkip: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${eur(c.parsed.x)} · ${ag[c.dataIndex].zona}` } } } } });
    torta('c-zo', zone.map(z => z.z), zone.map(z => Math.max(0, Math.round(z.f))), { eur: true, colori: zone.map(z => col(z.z)) });
    document.querySelectorAll('tr[data-a]').forEach(tr => tr.addEventListener('click', () => { STATO.agente = tr.dataset.a; render(); }));
  },
};

/* ---------- Sconto per cliente: mappa venduto / sconto ---------- */
S.sconti = {
  titolo: 'Sconto per cliente', sub: () => `Lo sconto fatturato a ogni cliente e la media · ${etichettaPerCli()}`,
  async prepara(){ this._D = await clientiCorrenti(); },
  html(){
    const D = this._D;
    if (!D) return vuoto('Il dettaglio per cliente non è ancora disponibile.');
    const cl = D.clienti.filter(c => c.lf > 0).sort((a, b) => b.f - a.f);
    const LF = sum(cl.map(c => c.lf)), NF = sum(cl.map(c => c.nf));
    const media = LF ? 1 - NF / LF : 0;
    const signif = cl.filter(c => c.lf >= 300);
    const semplice = signif.length ? sum(signif.map(c => c.sconto)) / signif.length : 0;
    const perSc = [...signif].sort((a, b) => b.sconto - a.sconto);
    const gruppi = Object.keys(GRUPPI).map(k => { const x = cl.filter(c => (c.canale_gruppo || 'ALTRO').toUpperCase() === k); const lf = sum(x.map(c => c.lf)); return { k, n: GRUPPI[k], cl: x.length, f: sum(x.map(c => c.f)), sc: lf ? 1 - sum(x.map(c => c.nf)) / lf : null }; }).filter(x => x.cl);
    const fasce = [['fino al 30%', 0, .30], ['30–35%', .30, .35], ['35–40%', .35, .40], ['40–45%', .40, .45], ['45–50%', .45, .50], ['oltre il 50%', .50, 2]]
      .map(([n, a, b]) => { const x = signif.filter(c => c.sconto >= a && c.sconto < b); return { n, cl: x.length, f: sum(x.map(c => c.f)) }; });
    const sopra = signif.filter(c => c.sconto > media + .02 && c.f >= (signif[Math.floor(signif.length * .1)]?.f || 0));
    this._d = { signif, media, gruppi, fasce };
    return `
      <div class="card-head" style="margin-bottom:14px"><p class="lead" style="margin:0;flex:1">Lo sconto è la differenza tra prezzo di copertina e fatturato, sul fornito. La media ponderata pesa ogni cliente per quanto acquista: è quella che incide davvero sul margine.</p><div class="dx">${selPerCli()}</div></div>
      <div class="grid g-kpi">
        ${kpi('Sconto medio ponderato', pct(media), `<span>${num(cl.length)} clienti con forniture</span>`, '--s1')}
        ${kpi('Sconto medio semplice', pct(semplice), '<span>clienti con almeno 300 € di fornito</span>', '--s3')}
        ${kpi('Sconto più alto', perSc[0] ? pct(perSc[0].sconto) : '—', `<span>${esc(perSc[0]?.nome || '')}</span>`, '--s2')}
        ${kpi('Sconto più basso', perSc.length ? pct(perSc[perSc.length - 1].sconto) : '—', `<span>${esc(perSc[perSc.length - 1]?.nome || '')}</span>`, '--s4')}
        ${kpi('Grandi clienti sopra la media', num(sopra.length), '<span>tra i primi 10% per venduto, oltre 2 punti</span>', '--s8')}
      </div>
      <div class="grid g2">
        <div class="card"><h3>I clienti più importanti e il loro sconto</h3><p class="h-sub">La barra è quanto vendono; a destra lo sconto: <span class="pill sc-su">sopra la media</span> <span class="pill sc-giu">sotto la media</span> (media ${pct(media)})</p>
          <div class="tw"><table class="tbl sc-tab"><tbody>${(() => { const top = cl.slice(0, 20), mx = Math.max(1, top[0]?.f || 1);
            return top.map(c => { const d = c.sconto - media; return `<tr><td><div class="t-tit sc-nm">${esc(c.nome)}</div><div class="t-sub">${esc(c.citta || '')}${c.provincia ? ' (' + esc(c.provincia) + ')' : ''}</div></td>
              <td style="width:36%"><div class="bar-in" style="height:10px"><i style="width:${Math.max(1, c.f / mx * 100)}%"></i></div></td><td class="r">${eurK(c.f)}</td>
              <td class="r"><span class="pill ${d > .005 ? 'sc-su' : d < -.005 ? 'sc-giu' : 'mut'}" title="${d > 0 ? '+' : ''}${fDec.format(d * 100)} punti sulla media">${pct(c.sconto)}</span></td></tr>`; }).join(''); })()}</tbody></table></div></div>
        <div>
          ${(() => {
            // sintesi: chi pesa, quanto costa lo sconto sopra la media, dove si concentra
            const F = sum(cl.map(c => c.f)), li = [];
            const top5 = cl.slice(0, 5), f5 = sum(top5.map(c => c.f)), lf5 = sum(top5.map(c => c.lf)), sc5 = lf5 ? 1 - sum(top5.map(c => c.nf)) / lf5 : 0;
            li.push(`Lo sconto medio ponderato è <b>${pct(media)}</b> su ${num(cl.length)} clienti; la media semplice è ${pct(semplice)}: ${semplice > media ? 'i clienti piccoli hanno sconti più alti dei grandi' : 'i clienti grandi hanno sconti più alti dei piccoli'}.`);
            if (F > 0) li.push(`I primi 5 clienti fanno il <b>${pct(f5 / F, 0)}</b> del venduto, con uno sconto medio del <b>${pct(sc5)}</b> (${sc5 >= media ? '+' : ''}${fDec.format((sc5 - media) * 100)} punti sulla media).`);
            const gs = gruppi.filter(g => g.sc != null).sort((a, b) => b.sc - a.sc);
            if (gs.length > 1) li.push(`Il canale con più sconto è <b>${esc(gs[0].n)}</b> (${pct(gs[0].sc)}), quello con meno è <b>${esc(gs[gs.length - 1].n)}</b> (${pct(gs[gs.length - 1].sc)}).`);
            const sopraM = cl.filter(c => c.sconto != null && c.sconto > media);
            const extra = sum(sopraM.map(c => (c.sconto - media) * c.lf));

/* ---------- Fatturazione PDE: compenso del 5% sul venduto a copertina netto rese, nel periodo scelto ---------- */
const STATI_FATT = ['Da emettere', 'Emessa', 'Pagata', 'Scaduta', 'Annullata'];
const percPde = () => +R.fatt.perc || .05;
const chiaveDi = d => PER.grana === 'mese' ? d.slice(0, 8) + '01' : PER.grana === 'settimana' ? lunedi(d) : d;
// fatture registrate nel periodo: ogni fattura si divide in parti uguali sui giorni dei mesi di competenza
function fatturatoSerie(){
  const out = PER.chiavi.map(() => 0), pos = new Map(PER.chiavi.map((k, i) => [k, i]));
  (R.fatt.fatture || []).filter(f => f.stato !== 'Annullata').forEach(f => {

const atCod = c => String(c ?? '').replace(/^0+(?=\w)/, '');
const atUtenza = a => a === 'pde_service' ? 'Service' : 'PDE';
async function atCall(body){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/anagrafiche-titoli`, { method: 'POST',
    headers: { Authorization: `Bearer ${session ? session.access_token : SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (data.risposta ? atTesto(data.risposta) : `Errore ${res.status}`));
  return data;
}
function atTesto(r){
  if (r == null) return '';
  if (typeof r === 'string') return r;
  return (Array.isArray(r) ? r : [r]).map(x => typeof x === 'object' ? [x.ean, x.errorCode, x.errorMessage || x.message || x.description || x.title].filter(Boolean).join(' · ') || JSON.stringify(x).slice(0, 200) : String(x)).join('\n');
}

const AT_CAMPI = [['longTitle', 'Titolo completo', 'span2'], ['shortTitle', 'Titolo breve (max 30)', ''], ['author', 'Autore', ''], ['editorialSeriesCode', 'Collana', 'sel'], ['genre', 'Genere', 'sel'],
  ['price', 'Prezzo €', ''], ['publicationDate', 'Data pubblicazione', 'date'], ['pageCount', 'Pagine', ''], ['volumeNumber', 'N. volume', ''], ['titleVendorCode', 'Cod. titolo presso editore', ''],
  ['designer', 'Disegnatore', ''], ['screenwriter', 'Sceneggiatore', '']];
async function atOpzioni(u){
  const k = `${u.account}|${u.code}`;
  if (!AT.opzioni[k]) AT.opzioni[k] = atCall({ azione: 'opzioni', account: u.account, vendorCode: u.code }).catch(e => { delete AT.opzioni[k]; throw e; });
  return AT.opzioni[k];
}
const atOpt = (L, val, lab, sel) => L.map(x => `<option value="${esc(x[val])}"${String(x[val]) === String(sel ?? '') ? ' selected' : ''}>${esc(lab(x))}</option>`).join('');

  if (g) g.innerHTML = '<option value="">— Genere —</option>' + atOpt(o.genre || [], 'code', x => `${x.code}${x.description ? ' – ' + x.description : ''}`, v.genere);
  if (iva) iva.innerHTML = atOpt(o.vat || [], 'code', x => `${x.code} – ${x.description || ''}`, v.iva || 'L');
  if (l) l.innerHTML = atOpt(Array.isArray(o.lingue) && o.lingue.length ? o.lingue : [{ languageCode: 'IT', languageDefinition: 'Italiano' }], 'languageCode', x => x.languageDefinition || x.languageCode, v.lingua || 'IT');
  if (s && g) s.addEventListener('change', () => { const c = (o.series || []).find(x => x.code === s.value); if (c && c.genre) g.value = c.genre; });

async function atCerca(pagina = 1){
  const st = $('#at-st'); if (st) st.textContent = 'Cerco su Messaggerie (utenze PDE e Service)…';
  const eans = [...new Set(($('#at-q-ean')?.value || '').split(/[\s,;]+/).map(x => x.replace(/\D/g, '')).filter(Boolean))];
  const filtri = { search: ($('#at-q-testo')?.value || '').trim(), vendor: ED.codice_editore };

          try { const d = await atCall({ azione: 'modifica', account: m.u.account, titoli: [card] }); const t = atTesto(d.risposta);
            msg.innerHTML = `<span style="color:var(--ok)">Modifiche inviate.</span>${t ? ' ' + esc(t).slice(0, 400) : ''}`; m.orig = { ...card }; m.card = card;

          titleVendorCode: V('at-codtit').toUpperCase(), volumeNumber: V('at-volume'), pageCount: V('at-pagine'), price: V('at-prezzo').replace(',', '.') };
        const err = [];

// Logo dell'editore nel riquadro a sinistra: lo carica PDE (ridotto a 400 px), lo vede anche l'editore
function mostraLogo(){
  const L = ED && ED.logo, box = $('#ed-logo');
  box.hidden = !L; box.innerHTML = L ? `<img src="${L}" alt="Logo ${esc(ED.nome)}">` : '';
  box.closest('.editore-box').classList.toggle('con-logo', !!L);   // con il logo: nome e codice sotto, in piccolo
  const az = $('#ed-logo-az');
  az.innerHTML = ADMIN() ? `<label class="logo-az">${L ? 'Cambia logo' : '+ Carica il logo dell\'editore'}<input type="file" id="ed-logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label>${L ? ' · <a href="#" class="logo-az" id="ed-logo-togli">togli</a>' : ''}` : '';
  const salva = async logo => {
    try { await rpc('ed_editore_logo_salva', { p_editore: ED.codice_editore, p_logo: logo }); }
    catch (e) { alert('Logo non salvato: ' + e.message); return; }
    ED.logo = logo; const x = (SESS.editori || []).find(e => e.codice_editore === ED.codice_editore); if (x) x.logo = logo;
    mostraLogo();
  };
  $('#ed-logo-togli')?.addEventListener('click', e => { e.preventDefault(); if (confirm('Togliere il logo dell\'editore?')) salva(null); });
  $('#ed-logo-file')?.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml') { if (r.result.length > 600000) { alert('Il file è troppo grande.'); return; } salva(r.result); return; }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        salva(c.toDataURL('image/png'));
      };
      img.onerror = () => alert('Immagine non leggibile.');
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}

  try { await caricaEditore(ED.codice_editore); }
  catch (e) { $('#content').innerHTML = `<div class="card empty">Non è stato possibile caricare i dati: ${esc(e.message)}</div>`; return; }
  $('#ed-marchi').textContent = 'Codice editore ' + ED.codice_editore;
  render();
}
async function avvio(){
  $('#f-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    $('#login-err').textContent = '';
    const b = ev.target.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password });
    b.disabled = false;
    if (error) { $('#login-err').textContent = 'Email o password non corrette.'; return; }
    entra();
  });
  $('#b-esci').addEventListener('click', esci);
  $('#b-periodo').addEventListener('click', apriPannelloPeriodo);
  document.addEventListener('click', e => { const i = e.target.closest('[data-cop]'); if (i) { e.stopPropagation(); apriCopertina(i.dataset.cop); } }, true);
  // chiude il pannello solo per un clic davvero fuori: il pannello si ridisegna a ogni scelta, e il pulsante cliccato non è più nella pagina
  document.addEventListener('click', e => { const p = $('#pan-per'); if (p && !p.hidden && e.target.isConnected && !e.target.closest('.periodo-wrap')) p.hidden = true; });
  $('#f-editore').addEventListener('change', e => {
    ED = (SESS.editori || []).find(x => x.codice_editore === e.target.value);
    try { localStorage.setItem('pde-editori-scelto', ED.codice_editore); } catch {}
    apriEditore();
  });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  const { data: { session } } = await sb.auth.getSession();
  if (session) entra(); else mostraLogin();
}
document.fonts?.ready.then(avvio) ?? avvio();
</script>
