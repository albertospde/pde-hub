<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookUp Publisher Edition</title>
<link rel="icon" href="assets/bookup-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --card-2:#eef4fa; --cyan:#0090c8; --cyan-dim:#e3f3fb;
    --text:#132033; --text-dim:#5b6b7d; --border:#d7e0ea; --grid:#e8edf3;
    --ok:#15803d; --ok-bg:#e9f7ee; --ko:#b91c1c; --ko-bg:#fdeceb; --warn:#9a5b00; --warn-bg:#fff4e0; --info:#005f86; --info-bg:#e3f3fb;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
    --prev:#a3adba; --shadow:0 12px 26px -18px rgba(20,45,90,.45);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1334; --card:#161f47; --card-2:#1c2754; --cyan:#33c3f0; --cyan-dim:#1c2f5e;
      --text:#e8ecf8; --text-dim:#97a3c9; --border:#2a3666; --grid:#222d5c;
      --ok:#4fd18b; --ok-bg:#14382f; --ko:#ff7a7a; --ko-bg:#40202f; --warn:#f0b84c; --warn-bg:#3a3020; --info:#33c3f0; --info-bg:#1c2f5e;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
      --prev:#5d6a93; --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1334; --card:#161f47; --card-2:#1c2754; --cyan:#33c3f0; --cyan-dim:#1c2f5e;
    --text:#e8ecf8; --text-dim:#97a3c9; --border:#2a3666; --grid:#222d5c;
    --ok:#4fd18b; --ok-bg:#14382f; --ko:#ff7a7a; --ko-bg:#40202f; --warn:#f0b84c; --warn-bg:#3a3020; --info:#33c3f0; --info-bg:#1c2f5e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --prev:#5d6a93; --shadow:none; color-scheme:dark;
  }
  *{box-sizing:border-box}
  /* spazio della barra di scorrimento sempre riservato: cambiando sezione la pagina non si allarga e non si stringe */
  html{font-size:16px;scrollbar-gutter:stable}
  body{margin:0;font-family:'DM Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

  /* ---------- menu laterale (stile BookUp) ---------- */
  /* menu laterale: logo BookUp e riquadro editore fermi in alto, scorrono solo le voci */
  .side{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;width:272px;min-width:0;background:var(--card);border-right:1px solid var(--border);padding:18px 12px 0}
  .side > .brand, .side > .editore-box{flex:none}
  .side > .nav{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-gutter:stable;margin:6px -12px 0 0;padding:0 8px 24px 0}
  .brand{padding:4px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:6px}
  /* Logo BookUp Publisher Edition: logo BookUp con la dicitura larga quanto tutto il logo (dall'ala alla "p"), lettere distribuite */
  .bu-logo{container-type:inline-size;width:100%;background:#fff;border-radius:12px}
  .bu-logo img{display:block;width:100%;height:auto}
  .bu-ed{display:flex;justify-content:space-between;margin:-.6cqw 1.6% 0 1.1%;padding-bottom:2.5cqw;font-family:Montserrat,'Segoe UI',sans-serif;font-size:5.6cqw;font-weight:700;line-height:1}
  .bu-ed b{font-weight:700;color:#13297a} .bu-ed i{font-style:normal;font-weight:700;color:#1a8ff0} .bu-ed s{width:3cqw;text-decoration:none}
  .brand .bu-logo{width:220px;max-width:220px}   /* misura fissa, non dipende dalla barra di scorrimento */
  .editore-box{margin:12px 6px 4px;padding:10px 12px;border-radius:14px;background:linear-gradient(140deg,#e3f3fb,#eef1ff);border:1px solid var(--border)}
  :root[data-theme="dark"] .editore-box{background:var(--card-2)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .editore-box{background:var(--card-2)}}
  .editore-box .lab{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
  .editore-box .nome{font-family:'Bree Serif',serif;font-size:18px;margin-top:2px}
  .editore-box .marchi{font-size:12px;color:var(--text-dim);margin-top:2px}
  .nav-g{display:block;margin:16px 10px 6px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}
  .nav a{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;margin:1px 0;border-radius:12px;color:var(--text);text-decoration:none;font-size:14.5px;font-weight:600;line-height:1.2;min-height:42px;white-space:nowrap}
  .nav a > span:not(.ic):not(.tag-demo){overflow:hidden;text-overflow:ellipsis}
  .nav a .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,var(--a1),var(--a2));color:#fff}
  .nav a .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .nav a:hover{background:var(--card-2)}
  .nav a.active{background:linear-gradient(140deg,var(--a1),var(--a2));color:#fff}
  .nav a.active .ic{background:rgba(255,255,255,.22)}
  .nav a .cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--ko);color:#fff;font-size:11.5px;font-weight:800;text-align:center}
  .nav a.active .cnt{background:rgba(255,255,255,.3)}

  /* ---------- testata ---------- */
  .main{min-width:0}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .top h1{margin:0;font-family:'Bree Serif',serif;font-weight:400;font-size:26px;line-height:1.1}
  .top .sub{color:var(--text-dim);font-size:14px;margin-top:3px}
  .top .dx{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);font-weight:600}
  select,input[type=text],input[type=search],input[type=date],textarea{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:0}
  .demo{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
  .btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--card-2)}
  .btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .btn.pri:hover{filter:brightness(1.08)}

  /* ---------- contenuti ---------- */
  .content{padding:22px 28px 48px;max-width:1480px}
  .lead{margin:0 0 18px;color:var(--text-dim);font-size:15px;max-width:900px;line-height:1.5}
  .grid{display:grid;gap:16px;margin-bottom:16px}
  .g-kpi{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
  .g2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
  .g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:1150px){.g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);min-width:0}
  .card h3{margin:0 0 2px;font-size:16px;font-weight:700}
  .card .h-sub{margin:0 0 12px;font-size:13px;color:var(--text-dim)}
  .card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .card-head .dx{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ch{position:relative;height:300px} .ch.sm{height:240px} .ch.lg{height:360px}
  .kpi{position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--k,var(--cyan))}
  .kpi .lab{font-size:12.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:28px;font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .foot{font-size:13px;color:var(--text-dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
  .delta.up{background:var(--ok-bg);color:var(--ok)} .delta.down{background:var(--ko-bg);color:var(--ko)} .delta.flat{background:var(--card-2);color:var(--text-dim)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.ko{background:var(--ko-bg);color:var(--ko)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.mut{background:var(--card-2);color:var(--text-dim)}
  .insight{border-left:4px solid var(--cyan);background:var(--card)}
  .insight ul{margin:8px 0 0;padding-left:0;list-style:none}
  .insight li{padding:7px 0 7px 28px;position:relative;font-size:14.5px;line-height:1.45;border-bottom:1px dashed var(--border)}
  .insight li:last-child{border-bottom:none}
  .insight li::before{content:attr(data-i);position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--cyan-dim);color:var(--info)}
  .insight b{font-weight:800}
  .tw{overflow-x:auto;max-width:100%}
  .tw.scroll{max-height:460px;overflow-y:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl .r{text-align:right} .tbl th.r{text-align:right}
  .tbl tbody tr.click{cursor:pointer} .tbl tbody tr.click:hover td{background:var(--card-2)} .tbl tbody tr.sel td{background:var(--cyan-dim)}
  .tbl .t-tit{font-weight:700} .tbl .t-sub{font-size:12px;color:var(--text-dim)}
  .bar-in{height:8px;border-radius:999px;background:var(--card-2);overflow:hidden;min-width:80px}
  .bar-in i{display:block;height:100%;border-radius:999px;background:var(--cyan)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-dim)}
  .chip.on{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .giri{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
  .giro{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--card);cursor:pointer;text-align:left}
  .giro:hover{border-color:var(--cyan)}
  .giro.on{outline:2px solid var(--cyan);border-color:var(--cyan)}
  .giro .n{font-family:'Bree Serif',serif;font-size:19px}
  .giro .d{font-size:12.5px;color:var(--text-dim);margin:2px 0 8px}
  .giro:has(.giro-ck){position:relative;padding-bottom:36px}
  .giro-ck{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:grid;place-items:center;width:30px;height:24px;cursor:pointer}
  .giro-ck input{width:17px;height:17px;margin:0;accent-color:var(--cyan);cursor:pointer}
  .giro .row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;margin-top:8px}
  .list-ev{display:flex;flex-direction:column;gap:10px}
  .ev{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
  .ev .dt{text-align:center;border-radius:12px;background:var(--cyan-dim);color:var(--info);padding:6px 0}
  .ev .dt b{display:block;font-size:22px;line-height:1} .ev .dt span{font-size:11.5px;font-weight:800;text-transform:uppercase}
  .ev .t{font-weight:700} .ev .m{font-size:13px;color:var(--text-dim);margin-top:2px}
  .ev.pass{opacity:.62}
  .alert-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--card)}
  .alert-card .gg{width:62px;text-align:center;border-radius:12px;padding:6px 0;font-weight:800}
  .alert-card .gg b{display:block;font-size:22px;line-height:1} .alert-card .gg span{font-size:11px;text-transform:uppercase}
  .sev-alta{background:var(--ko-bg);color:var(--ko)} .sev-media{background:var(--warn-bg);color:var(--warn)} .sev-bassa{background:var(--info-bg);color:var(--info)}
  .drop{border:2px dashed var(--border);border-radius:16px;padding:28px;text-align:center;color:var(--text-dim);cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--cyan);background:var(--cyan-dim);color:var(--info)}
  .drop b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
  .check{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}
  .check:last-child{border-bottom:none}
  .check .ck{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800;border:1px solid var(--border)}
  .check.done .ck{background:var(--ok-bg);color:var(--ok);border-color:transparent}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--text-dim)}
  .muted{color:var(--text-dim)} .small{font-size:13px}
  .note{font-size:13px;color:var(--text-dim);margin-top:10px}
  .empty{padding:24px;text-align:center;color:var(--text-dim)}
  .num{font-variant-numeric:tabular-nums}

  [hidden]{display:none !important}
  .sc-su{background:#fff1e9;color:#b4461b} .sc-giu{background:var(--info-bg);color:var(--info)}
  .sc-tab td{padding:6px 8px} .sc-nm{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cop{width:34px;height:48px;object-fit:cover;border-radius:4px;background:var(--card-2);cursor:zoom-in;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .cop.gr{width:46px;height:66px}
  /* copertina mancante: riquadro PDE "coming soon" (sempre bianco, come in PDE Analisi) */
  .cop-cs{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff;border:1px solid #d6e0f2;box-sizing:border-box;cursor:default;vertical-align:middle}
  .cop-cs img{width:18px;height:18px}
  .cop-cs b{font-size:8.5px;line-height:1;font-weight:800;letter-spacing:.5px;color:#0a2a6b}
  .cop-cs i{font-style:normal;font-size:5.2px;line-height:1.15;font-weight:700;letter-spacing:.3px;text-align:center;color:#fff;background:#1d5fd6;border-radius:2px;padding:1px 3px}
  .cop-cs.gr img{width:24px;height:24px} .cop-cs.gr b{font-size:10.5px} .cop-cs.gr i{font-size:6.5px}
  .con-cop{display:flex;gap:10px;align-items:center}
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(10,18,40,.75);display:grid;place-items:center;cursor:zoom-out}
  .lightbox img{max-width:90vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#fff}
  .ed-logo{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;display:grid;place-items:center}
  .ed-logo img{max-width:100%;max-height:84px;object-fit:contain;display:block}
  .editore-box.con-logo .lab{display:none}
  .editore-box.con-logo .nome{font-size:14px;margin-top:0;text-align:center}
  .editore-box.con-logo .marchi{font-size:11.5px;text-align:center}
  .editore-box.con-logo #ed-logo-az{text-align:center}
  .logo-az{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--info);cursor:pointer;text-decoration:none}
  .inv-tab{min-width:900px} .inv-tab td{vertical-align:top} .inv-desc{white-space:normal}
  .inv-tab td:nth-child(2){min-width:230px} .inv-tab td:nth-child(3){min-width:160px} .inv-tab td:nth-child(5) .t-sub{white-space:nowrap} .inv-tab td:nth-child(6){max-width:140px}
  .inv-tab td:last-child{width:96px} .inv-tab td:last-child .btn{display:block;width:100%;margin-bottom:4px;padding:4px 9px;font-size:12.5px}
  /* tendina di ricerca (libreria o città negli eventi) */
  .ac-wrap{position:relative}
  .ac{position:absolute;left:0;right:0;top:100%;z-index:40;margin-top:4px;max-height:320px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 36px -12px rgba(20,45,90,.35);text-transform:none;letter-spacing:0;font-weight:400;color:var(--text)}
  .ac-gr{padding:8px 12px 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);background:var(--card-2)}
  .ac-v{padding:8px 12px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--border)} .ac-v:last-child{border-bottom:none}
  .ac-v:hover{background:var(--cyan-dim)} .ac-vuoto{padding:10px 12px;font-size:13px;color:var(--text-dim)}
  .ev-piede{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:8px}
  .ev-piede .btn{padding:4px 10px;font-size:12.5px}
  /* interruttore valore / copie */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer}
  .seg button.on{background:var(--cyan);color:#fff}
  /* finestra "In sintesi" */
  .modale{position:fixed;inset:0;z-index:90;background:rgba(10,18,40,.45);display:grid;place-items:center;padding:16px}
  .modale-box{width:min(620px,100%);max-height:85vh;overflow-y:auto}
  /* sell-out e top 10 in panoramica */
  .sellout .lab{font-size:12.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
  .sellout .val{font-size:30px;font-weight:800;margin:4px 0}
  .sellout-fonti{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13px;padding-top:10px;border-top:1px dashed var(--border)}
  .sellout-fonti b{color:var(--text-dim);font-weight:600}
    .ch.alta{height:330px}
  .giri-ap{display:flex;flex-direction:column;gap:10px}
  .giro-ap{display:block;padding:11px 13px;border:1px solid var(--border);border-radius:12px;color:inherit;text-decoration:none;transition:background .12s}
  .giro-ap:hover{background:var(--card-2)} .giro-ap .row{display:flex;align-items:center;gap:8px;margin:0 0 6px}

<script>
/* =====================================================================
   PDE EDITORI — app per gli editori: ogni editore vede solo i suoi dati.
   Ora: dati dimostrativi generati per l'editore della sessione.
   Poi: SESSIONE arriva dal login Supabase e i dati dalle tabelle con RLS
   filtrata sul codice editore.
   ===================================================================== */
const SESSIONE = {
  codiceEditore: '763',
  nome: 'HarperCollins Italia',
  marchi: [
    { id: 'hc',  nome: 'HarperCollins' },
    { id: 'mid', nome: 'Midnight HC' },
    { id: 'hcr', nome: 'HarperCollins Ragazzi' },
  ],
};

const OGGI = (d => new Date(d.getFullYear(), d.getMonth(), d.getDate()))(new Date());
const ULTIMO_MESE = 9;          // solo per le sezioni di esempio: ottobre come ultimo mese chiuso
const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MESI_L = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const SEASON = [.78,.82,.95,.9,1,.86,.8,.68,1.02,1.08,1.25,1.65];
const ZONE = ['Nord-Ovest','Nord-Est','Centro','Sud','Isole'];

/* ---------------- utilità ---------------- */
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const fEur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
const fNum = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 0, useGrouping: 'always' });
const fDec = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const eur = n => fEur.format(n);
const num = n => fNum.format(n);
const pct = (n, d = 1) => (n * 100).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
function eurK(n){
  const a = Math.abs(n);
  if (a >= 1e6) return '€ ' + fDec.format(n / 1e6) + ' mln';
  if (a >= 1e4) return '€ ' + fNum.format(n / 1e3) + ' mila';
  return eur(n);
}
function numK(n){
  if (Math.abs(n) >= 1e6) return fDec.format(n / 1e6) + ' mln';
  if (Math.abs(n) >= 1e4) return fNum.format(n / 1e3) + ' mila';
  return num(n);
}
const varr = (a, b) => b ? (a - b) / b : 0;
function delta(a, b, inverti = false){
  const v = varr(a, b);
  if (Math.abs(v) < 0.005) return `<span class="delta flat">= 0,0%</span>`;
  const buono = inverti ? v < 0 : v > 0;
  return `<span class="delta ${buono ? 'up' : 'down'}">${v > 0 ? '▲ +' : '▼ '}${pct(v)}</span>`;
}
const fData = d => d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fDataL = d => d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffGg = (a, b) => Math.round((a - b) / 86400000);
const nomeMarchio = id => (SESSIONE.marchi.find(m => m.id === id) || {}).nome || id;

function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }

/* ---------------- dati dimostrativi ---------------- */
function generaDati(codice){
  const R = rng(hash(codice));
  const rnd = (a, b) => a + R() * (b - a);
  const ri = (a, b) => Math.round(rnd(a, b));
  const pick = a => a[Math.floor(R() * a.length)];

  const SETTORI = {
    'Narrativa straniera': { g: .06,  b: [6000, 32000] },
    'Gialli e thriller':   { g: .15,  b: [5000, 28000] },
    'Romance':             { g: .22,  b: [4000, 22000] },
    'Narrativa italiana':  { g: -.04, b: [3000, 15000] },
    'Saggistica':          { g: -.07, b: [2500, 12000] },
    'Fantasy':             { g: .18,  b: [3500, 16000] },
    'Ragazzi':             { g: .05,  b: [3000, 18000] },
  };
  const RAW = [
    "La casa sul fiordo|Ingrid Solberg|hc|Narrativa straniera|19.00|-1",
    "Le stagioni di Charleston|Mary Ellen Hale|hc|Narrativa straniera|18.50|-1",
    "Il silenzio delle maree|Owen Cartwright|hc|Narrativa straniera|19.90|3",
    "Una ragione per restare|Claire Dawson|hc|Narrativa straniera|17.90|-1",
    "Il giardino d'inverno|Hanna Lindqvist|hc|Narrativa straniera|18.00|-1",
    "Le lettere di Savannah|Grace Whitmore|hc|Narrativa straniera|19.50|6",
    "Il caso dell'Orient Line|Thomas Ashby|hc|Gialli e thriller|18.90|-1",
    "Nebbia su Edimburgo|Fiona McLeod|hc|Gialli e thriller|19.90|-1",
    "L'ultima testimone|Daniel Hayes|hc|Gialli e thriller|18.00|1",
    "Codice notturno|Erik Nyström|hc|Gialli e thriller|17.90|-1",
    "Sangue a Notting Hill|Laura Pembroke|hc|Gialli e thriller|19.00|8",
    "La donna del lago scuro|Ruth Calloway|hc|Gialli e thriller|18.50|-1",
    "Le sorelle di via Garibaldi|Marta Ferrante|hc|Narrativa italiana|18.00|-1",
    "Un'estate a Procida|Luca Benassi|hc|Narrativa italiana|17.00|4",
    "La bottega dei ricordi|Giulia Serra|hc|Narrativa italiana|16.90|-1",
    "Il treno delle sei|Paolo Martini|hc|Narrativa italiana|17.50|-1",
    "Pensare lento|Robert Klein|hc|Saggistica|20.00|-1",
    "La mente che guarisce|Sarah Mitchell|hc|Saggistica|22.00|-1",
    "Breve storia del domani|Adrian Cole|hc|Saggistica|21.00|2",
    "Il potere delle abitudini gentili|Nora Bates|hc|Saggistica|18.00|-1",
    "La corona di cenere|Elara Voss|hc|Fantasy|20.90|-1",
    "Il regno sommerso|Kieran Blake|hc|Fantasy|19.90|5",
    "Figli della tempesta|Selene Marsh|hc|Fantasy|21.00|-1",
    "Promettimi l'inverno|Jade Sullivan|mid|Romance|14.90|-1",
    "Il nostro ultimo settembre|Ava Monroe|mid|Romance|14.90|-1",
    "Cuori a Manhattan|Lily Carter|mid|Romance|13.90|7",
    "Tutto quello che non ti ho detto|Emma Rhodes|mid|Romance|15.90|-1",
    "Sotto lo stesso cielo|Chloe Bennett|mid|Romance|14.90|-1",
    "Un bacio a mezzanotte|Sophie Lane|mid|Romance|13.90|9",
    "Il drago che aveva paura del buio|Milo Greenwood|hcr|Ragazzi|12.90|-1",
    "La scuola dei mostri gentili|Penny Archer|hcr|Ragazzi|13.90|-1",
    "Agenti segreti a quattro zampe|Ben Wilder|hcr|Ragazzi|12.00|5",
    "Il mistero della biblioteca|Rosie Quill|hcr|Ragazzi|14.90|-1",
    "Le avventure di Pip e Momo|Anna Frost|hcr|Ragazzi|9.90|-1",
    "Stelle in tasca|Lucy Brooks|hcr|Ragazzi|11.90|8",
  ];
  const titoli = RAW.map((r, i) => {
    const [titolo, autore, marchio, settore, prezzo, nov] = r.split('|');
    const S = SETTORI[settore];
    const base = rnd(S.b[0], S.b[1]);
    const g = S.g + rnd(-.12, .12);
    const novita = +nov;
    const resa = rnd(.14, .32);
    const v25 = [], v26 = [], r25 = [], r26 = [];
    for (let m = 0; m < 12; m++){
      const a = novita >= 0 ? 0 : Math.round(base / 12 * SEASON[m] * rnd(.85, 1.15));
      v25.push(a); r25.push(Math.round(a * (resa + rnd(-.02, .05)) / (1 - resa)));
      let b = null;
      if (m <= ULTIMO_MESE){
        if (novita >= 0) b = m < novita ? 0 : Math.round(base * .3 / 12 * SEASON[m] * Math.max(.7, 2.6 - .5 * (m - novita)) * rnd(.9, 1.1));
        else b = Math.round(base * (1 + g) / 12 * SEASON[m] * rnd(.85, 1.15));
      }
      v26.push(b); r26.push(b == null ? null : Math.round(b * resa / (1 - resa)));
    }
    const media3 = (v26[7] + v26[8] + v26[9]) / 3;
    const giacenza = Math.round(media3 * rnd(.6, 3.4));

// Copertine (come PDE Analisi): laFeltrinelli, poi il portale. Per un EAN che non conoscono i due siti non danno errore
// ma un segnaposto ("Copertina in arrivo!"): Feltrinelli quadrato 200×200, portale 200×260. Quelli si scartano e si passa
// alla fonte dopo; senza copertina, il riquadro PDE "coming soon". COP_TROVATA ricorda per EAN la fonte buona (-1 = nessuna).
const COP_FONTI = [
  { url: (e, g) => `https://www.lafeltrinelli.it/images/${e}_0_0_${g ? 600 : 200}_0_75.jpg`, buona: (w, h) => h > w },
  { url: e => `https://img.messaggerielibri.it/images/${e}_0_0_260_0.png`, buona: (w, h) => h > w && !(w === 200 && h === 260) },
];
const COP_TROVATA = new Map();
const copVuota = (cls = '') => `<span class="cop cop-cs ${cls}" aria-label="Copertina non disponibile"><img src="assets/pde-ala.png" alt=""><b>PDE</b><i>COMING<br>SOON</i></span>`;
const cop = (ean, cls = '') => {
  if (!/^\d{10,13}$/.test(String(ean || ''))) return '';
  const f = COP_TROVATA.get(ean) ?? 0;
  if (f < 0) return copVuota(cls);
  return `<img class="cop ${cls}" loading="lazy" alt="" data-cop="${esc(ean)}" data-f="${f}" data-cls="${cls}" src="${COP_FONTI[f].url(ean)}" onload="copOk(this)" onerror="copNo(this)">`;
};
function copOk(img){
  const f = Number(img.dataset.f), w = img.naturalWidth, h = img.naturalHeight;
  if (w < 50 || !COP_FONTI[f].buona(w, h)) return copNo(img);
  COP_TROVATA.set(img.dataset.cop, f);
}
function copNo(img){
  const f = Number(img.dataset.f) + 1;
  if (f < COP_FONTI.length) { img.dataset.f = f; img.src = COP_FONTI[f].url(img.dataset.cop); return; }
  COP_TROVATA.set(img.dataset.cop, -1);
  img.outerHTML = copVuota(img.dataset.cls || '');
}
function apriCopertina(ean){
  const f = COP_TROVATA.get(ean) ?? 0;
  if (f < 0) return;
  const box = document.createElement('div'); box.className = 'lightbox'; box.title = 'Chiudi';
  box.innerHTML = `<img src="${COP_FONTI[f].url(ean, true)}" alt="">`;
  box.addEventListener('click', () => box.remove());
  document.addEventListener('keydown', function k(e){ if (e.key === 'Escape') { box.remove(); document.removeEventListener('keydown', k); } });
  document.body.appendChild(box);
}

/* ---- periodo scelto (come PDE Analisi): rapido, mese, settimana, giorno singolo o dal/al; confronto con le stesse date dell'anno prima ---- */
const RAPIDI = [['ultimo', 'Ultimo giorno'], ['7', 'Ultimi 7 giorni'], ['30', 'Ultimi 30 giorni'], ['mese', 'Mese in corso'], ['anno', 'Da inizio anno'], ['annoprec', 'Anno precedente']];
const GRANE = [['giorno', 'Giorno'], ['settimana', 'Settimana'], ['mese', 'Mese']];
let SCELTA = { tipo: 'rapido', rapido: 'anno', grana: null };
const piuGg = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const lunedi = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const granaAuto = (dal, al) => { const n = diffGg(pd(al), pd(dal)) + 1; return n <= 45 ? 'giorno' : n <= 200 ? 'settimana' : 'mese'; };
const annoPrimaIso = s => { const d = pd(s); const x = new Date(d.getFullYear() - 1, d.getMonth(), d.getDate()); if (x.getMonth() !== d.getMonth()) x.setDate(0); return iso(x); };
function periodi(){
  const u = SESS.ultimo_giorno, y = +u.slice(0, 4), sc = SCELTA;
  let dal, al, nome;
  if (sc.tipo === 'rapido'){
    [dal, al] = { ultimo: [u, u], '7': [piuGg(u, -6), u], '30': [piuGg(u, -29), u], mese: [u.slice(0, 8) + '01', u], anno: [`${y}-01-01`, u], annoprec: [`${y - 1}-01-01`, `${y - 1}-12-31`] }[sc.rapido];
    nome = sc.rapido === 'anno' ? `Da inizio anno ${y}` : sc.rapido === 'annoprec' ? `Anno ${y - 1}` : RAPIDI.find(x => x[0] === sc.rapido)[1];
  } else if (sc.tipo === 'mese'){
    dal = sc.mese + '-01'; const fine = iso(new Date(+sc.mese.slice(0, 4), +sc.mese.slice(5, 7), 0)); al = fine < u ? fine : u;
    nome = `${titleCase(MESI_L[+sc.mese.slice(5, 7) - 1])} ${sc.mese.slice(0, 4)}`;
  } else if (sc.tipo === 'settimana'){
    dal = sc.settimana; al = piuGg(dal, 6); if (al > u) al = u; nome = 'Settimana';
  } else if (sc.tipo === 'giorno'){
    dal = al = sc.giorno; nome = 'Giorno';
  } else { dal = sc.dal; al = sc.al; nome = 'Periodo'; }
  const grana = sc.grana || (sc.tipo === 'rapido' && ['anno', 'annoprec'].includes(sc.rapido) ? 'mese' : granaAuto(dal, al));
  const date = dal === al ? fData(pd(dal)) : `${fData(pd(dal))} – ${fData(pd(al))}`;
  const chiavi = []; let k = grana === 'mese' ? dal.slice(0, 8) + '01' : grana === 'settimana' ? lunedi(dal) : dal;
  while (k <= al) { chiavi.push(k); k = grana === 'mese' ? iso(new Date(+k.slice(0, 4), +k.slice(5, 7), 1)) : piuGg(k, grana === 'settimana' ? 7 : 1); }
  const unAnno = dal.slice(0, 4) === al.slice(0, 4);
  const labels = chiavi.map(c => { const d = pd(c); return grana === 'mese' ? MESI[d.getMonth()] + (unAnno ? '' : ' ' + String(d.getFullYear()).slice(2)) : (grana === 'settimana' ? 'sett. ' : '') + d.getDate() + '/' + (d.getMonth() + 1); });
  const Y = +al.slice(0, 4);
  const prima = `${fData(pd(annoPrimaIso(dal)))}${dal === al ? '' : ' – ' + fData(pd(annoPrimaIso(al)))}`;
  return { dal, al, grana, chiavi, labels, Y, ultimo: pd(u), nome, date, etichetta: `${nome} (${date})`, prima,
    granaNome: { giorno: 'giorno', settimana: 'settimana', mese: 'mese' }[grana] };
}

      <label class="${b.tipo === 'giorno' ? 'pp-on' : ''}">Giorno singolo<input type="date" id="pp-giorno" min="${g[0] || ''}" max="${u}" value="${b.tipo === 'giorno' ? b.giorno : ''}"></label>

    <div class="pp-piede"><span class="small" id="pp-err" style="color:var(--ko)"></span><button class="btn" id="pp-annulla" type="button">Annulla</button><button class="btn pri" id="pp-applica" type="button">Applica</button></div>`;
  pan.querySelectorAll('[data-r]').forEach(x => x.addEventListener('click', () => { PAN = { ...PAN, tipo: 'rapido', rapido: x.dataset.r }; disegnaPeriodo(); }));
  $('#pp-mese').addEventListener('change', e => { if (e.target.value) { PAN = { ...PAN, tipo: 'mese', mese: e.target.value }; disegnaPeriodo(); } });
  $('#pp-sett').addEventListener('change', e => { if (e.target.value) { PAN = { ...PAN, tipo: 'settimana', settimana: e.target.value }; disegnaPeriodo(); } });
  $('#pp-giorno').addEventListener('change', e => { if (e.target.value) { PAN = { ...PAN, tipo: 'giorno', giorno: e.target.value }; disegnaPeriodo(); } });
  ['#pp-dal', '#pp-al'].forEach(s => $(s).addEventListener('change', () => { const d = $('#pp-dal').value, a = $('#pp-al').value; PAN = { ...PAN, tipo: 'intervallo', dal: d || a, al: a || d }; disegnaPeriodo(); }));
  $('#pp-grana').addEventListener('change', e => PAN.grana = e.target.value || null);
  $('#pp-annulla').addEventListener('click', () => { pan.hidden = true; });
  $('#pp-applica').addEventListener('click', async () => {
    if (PAN.tipo === 'intervallo' && (!PAN.dal || !PAN.al || PAN.dal > PAN.al)) { $('#pp-err').textContent = 'Controlla le date Dal e Al.'; return; }
    if (PAN.tipo === 'intervallo' && diffGg(pd(PAN.al), pd(PAN.dal)) > 366) { $('#pp-err').textContent = 'Al massimo un anno, per confrontarlo con l\'anno prima.'; return; }
    SCELTA = { ...PAN }; pan.hidden = true;
    await applicaPeriodo();
  });
}
let PAN = null;
async function applicaPeriodo(){
  PER = periodi();
  // le sezioni per cliente seguono il mese scelto, se il dettaglio di quel mese c'è
  if (SCELTA.tipo === 'mese' && R && opzioniPeriodoCli().find(o => o.v === `${SCELTA.mese}-01|${SCELTA.mese}-01`)) STATO.perCli = `${SCELTA.mese}-01|${SCELTA.mese}-01`;

}

async function rpc(nome, args){
  const { data, error } = await sb.rpc(nome, args || {});
  if (error) throw new Error(error.message);
  return data;
}
async function caricaEditore(codice){
  const p = { p_editore: codice };
  // il riepilogo vendite dell'editore si aggiorna con gli ultimi giorni importati dal portale (veloce se è già aggiornato)
  try { await rpc('ed_vendite_aggiorna', p); } catch (e) { console.warn('Riepilogo vendite non aggiornato:', e.message); }
  const [vendite, titoli, giri, gfk, materiali, mesiCli, meli, inv, fatt, mensili] = await Promise.all([
    rpc('ed_vendite_periodo', { ...p, p_dal: PER.dal, p_al: PER.al, p_grana: PER.grana }),
    rpc('ed_titoli_periodo', { ...p, p_dal: PER.dal, p_al: PER.al }),
    rpc('ed_giri', p), rpc('ed_gfk', p), rpc('ed_materiali', p), rpc('ed_clienti_mesi', p),
    rpc('ed_meli_lista', p), rpc('ed_investimenti_lista', p), rpc('ed_fatture_lista', p), rpc('ed_vendite_mese', p),
  ]);
  vendite.forEach(v => v.d = pd(v.periodo));
  mensili.forEach(v => v.d = pd(v.mese));
  giri.forEach(g => {
    g.inizio = pd(g.inizio); g.fine = pd(g.fine); g.consegna = pd(g.consegna); g.titoli ||= [];
    g.obiettivo = sum(g.titoli.map(t => +t.obiettivo)); g.prenotato = sum(g.titoli.map(t => +t.prenotato));
    g.cf = sum(g.titoli.map(t => +t.cf)); g.cr = sum(g.titoli.map(t => +t.cr));
    g.stato = !g.inizio || !g.fine ? 'senza date' : g.fine < OGGI ? 'chiuso' : g.inizio <= OGGI ? 'in corso' : 'programmato';
  });
  R = { vendite, titoli, giri, gfk: gfk || { righe: [] }, materiali: materiali || [], mesiCli: mesiCli || [], clienti: {}, agenti: {}, giriDett: {},
        meli: meli || { righe: [] }, inv: inv || [], fatt: fatt || { perc: .05, fatture: [] }, anag: null, mensili };
  R.titoliMap = new Map(titoli.map(t => [t.ean, t]));
  R.meliMap = new Map((R.meli.righe || []).map(m => [m.ean, m]));
  const opz = opzioniPeriodoCli();
  if (opz.length) await clientiPer(opz[0].v);   // nomi degli agenti, servono anche ai giri
}

/* ---- clienti (ed_cliente_mese): solo i mesi con il dettaglio completo ---- */
function opzioniPeriodoCli(){
  const ms = R.mesiCli.filter(x => +x.copertura >= .98).map(x => pd(x.mese)).sort((a, b) => a - b);
  const blocchi = []; let cur = null;
  ms.forEach(d => {
    if (cur && d.getFullYear() * 12 + d.getMonth() === cur.b.getFullYear() * 12 + cur.b.getMonth() + 1) cur.b = d;
    else { cur = { a: d, b: d }; blocchi.push(cur); }
  });
  const lab = d => `${MESI_L[d.getMonth()]} ${d.getFullYear()}` + (d.getFullYear() === PER.ultimo.getFullYear() && d.getMonth() === PER.ultimo.getMonth() ? ` (fino al ${PER.ultimo.getDate()})` : '');
  const out = [];
  [...ms].reverse().forEach(d => out.push({ v: iso(d) + '|' + iso(d), label: lab(d) }));
  blocchi.filter(b => b.a < b.b).reverse().forEach(b => out.push({ v: iso(b.a) + '|' + iso(b.b), label: `${MESI_L[b.a.getMonth()]}${b.a.getFullYear() !== b.b.getFullYear() ? ' ' + b.a.getFullYear() : ''}–${MESI_L[b.b.getMonth()]} ${b.b.getFullYear()}` }));
  return out;
}
async function clientiPer(k){
  if (R.clienti[k]) return R.clienti[k];
  const [dal, al] = k.split('|').map(pd);
  const D = await rpc('ed_clienti', { p_editore: ED.codice_editore, p_dal: iso(dal), p_al: iso(al),
    p_dal_prima: iso(new Date(dal.getFullYear() - 1, dal.getMonth(), 1)), p_al_prima: iso(new Date(al.getFullYear() - 1, al.getMonth(), 1)) });
  (D.agenti || []).forEach(a => R.agenti[a.codice] = { nome: titleCase(a.nome), reale: !!a.reale });
  (D.clienti || []).forEach(c => {
    ['cf', 'cr', 'lf', 'lr', 'nf', 'nr', 'lf1', 'lr1'].forEach(x => c[x] = +c[x] || 0);
    c.zona = zonaDi(c.provincia, c.regione);
    const reali = (c.agenti || []).filter(a => R.agenti[a]?.reale).sort();
    c.agente = reali[0] || null;
    c.direzionale = !c.agente && (c.agenti || []).some(a => SEDE.includes(a));
    c.senzaAgente = !c.agente && !c.direzionale;
    c.f = c.lf - c.lr; c.n = c.nf - c.nr; c.f1 = c.lf1 - c.lr1;
    c.sconto = c.lf > 0 ? 1 - c.nf / c.lf : null;
    c.nome = titleCase(c.nome); c.citta = titleCase(c.citta);
  });
  R.clienti[k] = D;
  return D;
}

/* ---------- Settori: generi del portale e collane, con il confronto col mercato GfK ---------- */
function aggPer(chiave){
  const map = {};
  TF().forEach(t => {
    const k = chiave(t);
    const x = map[k] ||= { n: k, f: 0, f1: 0, cf: 0, cr: 0, nt: 0 };
    x.f += tM(t); x.f1 += tM1(t); x.cf += t.cf; x.cr += t.cr; if (t.cf > 0) x.nt++;
  });
  const righe = Object.values(map).sort((a, b) => b.f - a.f);
  const tot = sum(righe.map(x => Math.max(0, x.f)));
  righe.forEach(x => { x.quota = tot ? Math.max(0, x.f) / tot : 0; x.var = x.f1 > 0 ? varr(x.f, x.f1) : null; x.resa = x.cf ? x.cr / x.cf : 0; });
  return righe;
}
const collaneAgg = () => aggPer(t => nomeCollana(t.collana));
// Collane per esteso: i nomi vengono dal portale (li salva un admin la prima volta), altrimenti resta il codice
const nomeCollana = c => !c ? 'Senza collana' : R.collane && R.collane[c] ? `${titleCase(R.collane[c])} (${c})` : c;
async function nomiCollane(){
  if (!R.collane) R.collane = await rpc('ed_collane_lista', { p_editore: ED.codice_editore }).catch(() => ({}));
  const mancano = [...new Set(TF().map(t => t.collana).filter(c => c && !R.collane[c]))];
  if (!ADMIN() || !mancano.length || R.collaneProvate) return;
  R.collaneProvate = true;
  const r0 = R;
  (async () => {   // in sottofondo: legge le collane dell'editore sul portale e le salva per tutti
    try {
      const d = await atCall({ azione: 'editori' });
      const ut = (d.editori || []).filter(e => atCod(e.code) === atCod(ED.codice_editore)), serie = [];
      for (const u of ut){ const o = await atOpzioni(u); (o.series || []).forEach(x => x.code && serie.push({ code: x.code, description: x.description || '' })); }
      if (!serie.length || R !== r0) return;
      await rpc('ed_collane_salva', { p_editore: ED.codice_editore, p: serie });
      serie.forEach(x => { if (x.description) R.collane[x.code] = x.description; });
      if (['settori', 'analisi'].includes(location.hash.slice(1))) render();
    } catch (e) { console.warn('Nomi delle collane non letti:', e.message); }
  })();
}
function generiAgg(){
  const rilevati = (R.meli.righe || []).some(m => m.genere);
  return { rilevati, righe: rilevati ? aggPer(t => genereDi(t.ean) || 'Genere non rilevato') : [] };
}
function tabellaSettori(righe, nome, Y){
  const maxQ = righe[0] ? righe[0].quota || 1 : 1;
  return `<div class="tw scroll"><table class="tbl"><thead><tr><th>${nome}</th><th class="r">Titoli</th><th class="r">Venduto</th><th>Quota</th><th class="r">vs ${Y - 1}</th><th class="r">Resa</th></tr></thead>
    <tbody>${righe.map(x => `<tr><td class="t-tit">${esc(x.n)}</td><td class="r">${x.nt}</td><td class="r">${fmtMF(x.f)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar-in" style="flex:1"><i style="width:${x.quota / maxQ * 100}%"></i></div><span class="small num">${pct(x.quota)}</span></div></td>
      <td class="r">${x.var == null ? '<span class="pill mut">nuovo</span>' : delta(x.f, x.f1)}</td><td class="r">${pct(x.resa)}</td></tr>`).join('')}</tbody></table></div>`;
}
// Confronto col mercato: generi GfK del mercato (qdm_generi, tipo MERCATO) e dei titoli dell'editore in classifica (stesso genere GfK)
function confrontoMercato(){
  const M = ((R.mercato || {}).generi || []).filter(g => g.tipo === 'MERCATO' && !/unknown/i.test(g.genere));
  const T = (R.gfk.righe || []).filter(r => r.tipo === 'TOTALE' && r.week_key === R.gfk.settimana);
  const totE = sum(T.map(gM));
  return M.map(g => {
    const mie = T.filter(r => String(r.genre || '').toUpperCase() === String(g.genere).toUpperCase());
    const e = sum(mie.map(gM));
    return { n: titleCase(g.genere), quotaM: +g.quota, varM: VAL() ? +g.var_valore : +g.var_copie, e, quotaE: totE ? e / totE : 0, titoli: mie.length,
             pesoSulGenere: (VAL() ? +g.valore : +g.copie) ? e / (VAL() ? +g.valore : +g.copie) : 0 };
  });
}

/* ---- tutte le tabelle: clic sull'intestazione per riordinare (numeri, euro, percentuali, date o testo) ---- */
function chiaveOrd(cell){
  if (!cell) return null;
  if (cell.dataset.v != null) { const n = +cell.dataset.v; return isNaN(n) ? cell.dataset.v.toLowerCase() : n; }
  const t = (cell.innerText || '').trim().split('\n')[0].trim();
  if (!t || t === '—' || t === '-') return null;
  let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t);
  if (m) return +m[3] * 10000 + +m[2] * 100 + +m[1];
  m = /^[≥▲▼€+\-−\s]*([\d.]+(?:,\d+)?)\s*(mln|mila)?\s*(%|€|º|°|gg|giorni|copie|punti)?/i.exec(t.replace(/^€\s*/, ''));
  if (m && /\d/.test(m[1])){
    let n = +m[1].replace(/\./g, '').replace(',', '.');
    if (/mln/i.test(m[2] || '')) n *= 1e6; else if (/mila/i.test(m[2] || '')) n *= 1e3;
    if (/^[\s€▼]*[-−]/.test(t)) n = -n;
    return n;
  }
  return t.toLowerCase();
}
document.addEventListener('click', e => {
  const th = e.target.closest('table.tbl thead th');
  if (!th || e.target.closest('input,select,button,a')) return;
  const table = th.closest('table'), tb = table.tBodies[0]; if (!tb) return;
  const nCol = th.parentNode.children.length, idx = [...th.parentNode.children].indexOf(th);
  const dir = th.dataset.ord === 'desc' ? 'asc' : 'desc';
  table.querySelectorAll('thead th[data-ord]').forEach(x => delete x.dataset.ord);
  th.dataset.ord = dir;
  const righe = [...tb.rows];
  const fisse = righe.filter(r => r.cells.length !== nCol || r.querySelector('td.empty') || /^totale|^esposizione totale/i.test((r.cells[0]?.innerText || '').trim()));
  const mob = righe.filter(r => !fisse.includes(r)).map(r => [r, chiaveOrd(r.cells[idx])]);
  mob.sort((a, b) => {
    const x = a[1], y = b[1];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'it', { numeric: true });
    return dir === 'asc' ? c : -c;
  });
  tb.append(...mob.map(x => x[0]), ...fisse);
});

function mediePrenotato(D, nGiri){
  STATO.mediaPren ||= 'gruppo';
  const box = $('#box-media'); if (!box) return;
  const can = (D.per_canale || []).filter(c => +c.copie > 0);

    <td class="r t-tit">${fDec.format(m)}</td><td class="r">${mediaTot && pv ? pillMedia(m / mediaTot) : '—'}</td></tr>`; };

  const draw = () => {

// Periodo dei clienti per l'effetto sullo sconto: i mesi coperti dell'anno in corso (l'ultimo blocco continuo)
function periodoEffetto(){
  const ms = R.mesiCli.filter(x => +x.copertura >= .98).map(x => x.mese.slice(0, 10)).sort();
  if (!ms.length) return null;
  const al = ms[ms.length - 1], anno = al.slice(0, 4);
  let dal = al;
  for (let i = ms.length - 2; i >= 0; i--){ const d = pd(dal), p = pd(ms[i]);
    if (ms[i].slice(0, 4) === anno && d.getFullYear() * 12 + d.getMonth() === p.getFullYear() * 12 + p.getMonth() + 1) dal = ms[i]; else break; }
  return dal + '|' + al;
}
// Effetto di un investimento sullo sconto: il costo dell'investimento, tolto dal fatturato dei clienti coinvolti, fa salire lo sconto effettivo
function effettoInvestimenti(I, D){
  const anag = new Map((R.anag || []).map(c => [c.cc, c]));
  const cl = (D.clienti || []).filter(c => c.lf > 0);
  const norm = x => String(x || '').trim().toUpperCase();
  const LT = sum(cl.map(c => c.lf)), NT = sum(cl.map(c => c.nf));
  const righe = I.map(i => {
    const L = i.destinatario === 'Cliente' ? cl.filter(c => c.cc === i.codice_cliente)
      : i.destinatario === 'Gruppo' ? cl.filter(c => norm((anag.get(c.cc) || {}).gruppo || c.gruppo) === norm(i.gruppo))
      : i.destinatario === 'Canale' ? cl.filter(c => norm(c.canale || (anag.get(c.cc) || {}).canale) === norm(i.canale)) : cl;
    const lf = sum(L.map(c => c.lf)), nf = sum(L.map(c => c.nf)), inv = +i.importo || 0;
    return { i, n: L.length, lf, nf, inv, sc: lf ? 1 - nf / lf : null, eff: lf ? 1 - (nf - inv) / lf : null };
  });
  const INV = sum(righe.filter(r => r.lf).map(r => r.inv));
  return { righe, LT, NT, INV, sc: LT ? 1 - NT / LT : 0, eff: LT ? 1 - (NT - INV) / LT : 0 };
}

/* ---------- Fatturazione PDE: compenso del 5% sul venduto a copertina netto rese, nel periodo scelto ---------- */
const STATI_FATT = ['Da emettere', 'Emessa', 'Pagata', 'Scaduta', 'Annullata'];
const percPde = () => +R.fatt.perc || .05;
const chiaveDi = d => PER.grana === 'mese' ? d.slice(0, 8) + '01' : PER.grana === 'settimana' ? lunedi(d) : d;
// fatture registrate nel periodo: ogni fattura si divide in parti uguali sui giorni dei mesi di competenza
function fatturatoSerie(){
  const out = PER.chiavi.map(() => 0), pos = new Map(PER.chiavi.map((k, i) => [k, i]));
  (R.fatt.fatture || []).filter(f => f.stato !== 'Annullata').forEach(f => {
    const a = String(f.mese_dal).slice(0, 10), bm = pd(f.mese_al || f.mese_dal), b = iso(new Date(bm.getFullYear(), bm.getMonth() + 1, 0));
    const n = diffGg(pd(b), pd(a)) + 1, quota = +f.imponibile / n;
    for (let d = a > PER.dal ? a : PER.dal; d <= (b < PER.al ? b : PER.al); d = piuGg(d, 1)) { const i = pos.get(chiaveDi(d)); if (i != null) out[i] += quota; }
  });
  return out;
}

  init(){
    if (!ADMIN() || !this._d) return;
    const { m0, m1, fa, fasce, proj } = this._d, s = SER();

      { type: 'line', ...linea(`Maturato ${PER.Y}`, m0, s[0], { pointRadius: 3 }), order: 0 },
      { type: 'line', ...linea(`Maturato ${PER.Y - 1}`, m1, css('--prev'), { borderDash: [5, 4] }), order: 1 },
      { ...barre('Fatturato registrato', fa.map(x => x || null), s[2] + '99'), order: 2 },
    ] }, options: lineOpts(tickEur, ttEur) });
    mk('c-aging', { type: 'bar', data: { labels: fasce.map(x => x.n.replace('Scaduto ', '')), datasets: [barre('Esposizione', fasce.map(x => x.v), fasce.map((x, i) => i === 0 ? s[0] : i === 1 ? s[3] : css('--ko')))] },
      options: { scales: { y: { ticks: tickEur }, x: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${eur(c.parsed.y)} · ${fasce[c.dataIndex].k} fatture` } } } } });
    mk('c-proj', { type: 'bar', data: { labels: proj.map(x => MESI[pd(x.m).getMonth()] + ' ' + x.m.slice(2, 4)), datasets: [
      { type: 'line', ...linea('Esposizione residua', proj.map(x => x.resid), css('--ko'), { pointRadius: 3 }), order: 0 },
      { ...barre('Rate del piano', proj.map(x => x.r), s[0], { stack: 'r' }), order: 1 },
      { ...barre('Delegazioni portale', proj.map(x => x.d), s[2], { stack: 'r' }), order: 2 },
    ] }, options: { interaction: { mode: 'index', intersect: false }, scales: { y: { stacked: true, ticks: tickEur }, x: { stacked: true, grid: { display: false } } }, plugins: { tooltip: ttEur, legend: { position: 'top', align: 'end' } } } });
    const ricaricaFatt = async () => { await ricarica('fatt', 'ed_fatture_lista'); render(); };
    // conferma del pagamento di una fattura
    document.querySelectorAll('[data-fp]').forEach(b => b.addEventListener('click', () => { STATO.pagFatt = b.dataset.fp; render(); setTimeout(() => $('#f-pag')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60); }));
    $('#b-pag-annulla')?.addEventListener('click', () => { STATO.pagFatt = null; render(); });
    const salvaPag = (b, p) => salvaCon(b, async () => { await rpc('ed_fattura_pagamento', { p_editore: ED.codice_editore, p_id: STATO.pagFatt, p }); STATO.pagFatt = null; await ricaricaFatt(); });
    $('#f-pag')?.addEventListener('submit', ev => { ev.preventDefault(); salvaPag(ev.submitter || ev.target.querySelector('[type=submit]'), fdata(ev.target)); });
    $('#b-pag-togli')?.addEventListener('click', e => { if (confirm('Togliere il pagamento registrato? La fattura torna aperta.')) salvaPag(e.currentTarget, { pagato: 0 }); });
    // piano di rientro
    const fr = $('#f-ri');
    fr.addEventListener('submit', ev => { ev.preventDefault(); const d = fdata(fr); if (STATO.rientroEdit) d.id = STATO.rientroEdit;
      salvaCon(ev.submitter, async () => { await rpc('ed_rientro_salva', { p_editore: ED.codice_editore, p: d }); STATO.rientroEdit = null; await ricaricaFatt(); }); });
    $('#b-ri-annulla')?.addEventListener('click', () => { STATO.rientroEdit = null; render(); });
    document.querySelectorAll('[data-ri-e]').forEach(b => b.addEventListener('click', () => { STATO.rientroEdit = b.dataset.riE; render(); }));
    document.querySelectorAll('[data-ri-ok]').forEach(b => b.addEventListener('click', () => { const r = R.fatt.rientro.find(x => x.id === b.dataset.riOk);
      salvaCon(b, async () => { await rpc('ed_rientro_salva', { p_editore: ED.codice_editore, p: { ...r, stato: 'Incassata' } }); await ricaricaFatt(); }); }));
    document.querySelectorAll('[data-ri-d]').forEach(b => b.addEventListener('click', () => { if (!confirm('Eliminare questa rata?')) return;
      salvaCon(b, async () => { await rpc('ed_rientro_elimina', { p_editore: ED.codice_editore, p_tipo: 'rata', p_id: b.dataset.riD }); await ricaricaFatt(); }); }));
    $('#b-gen').addEventListener('click', e => {
      const T = +$('#g-tot').value, n = Math.max(1, +$('#g-n').value || 1), d0 = $('#g-dal').value;
      if (!T || !d0) { alert('Indica totale e data della prima rata'); return; }
      const q = Math.round(T / n * 100) / 100;
      salvaCon(e.currentTarget, async () => {
        for (let i = 0; i < n; i++){ const d = pd(d0); d.setMonth(d.getMonth() + i);
          await rpc('ed_rientro_salva', { p_editore: ED.codice_editore, p: { data: iso(d), importo: i === n - 1 ? Math.round((T - q * (n - 1)) * 100) / 100 : q, modalita: $('#g-mod').value, stato: 'Da incassare', note: `Rata ${i + 1} di ${n}` } }); }
        await ricaricaFatt();

    const fd = $('#f-de');
    $('#de-tipo').addEventListener('change', e => { $('#l-de-al').hidden = e.target.value === 'Perpetua'; });
    fd.addEventListener('submit', ev => { ev.preventDefault(); const d = fdata(fd);
      d.dal = d.dal + '-01'; d.al = d.tipo === 'Perpetua' || !d.al ? '' : d.al + '-01';

      if (!+d.importo_mensile && !d.al) { alert('Con un importo totale serve anche il mese di fine, per calcolare la quota mensile. Per una delegazione perpetua indica l\'importo al mese.'); return; }
      if (STATO.delegEdit) d.id = STATO.delegEdit;
      salvaCon(ev.submitter, async () => { await rpc('ed_delegazione_salva', { p_editore: ED.codice_editore, p: d }); STATO.delegEdit = null; await ricaricaFatt(); }); });
    $('#b-de-annulla')?.addEventListener('click', () => { STATO.delegEdit = null; render(); });
    document.querySelectorAll('[data-de-e]').forEach(b => b.addEventListener('click', () => { STATO.delegEdit = b.dataset.deE; render(); }));
    document.querySelectorAll('[data-de-d]').forEach(b => b.addEventListener('click', () => { if (!confirm('Eliminare questa delegazione?')) return;
      salvaCon(b, async () => { await rpc('ed_rientro_elimina', { p_editore: ED.codice_editore, p_tipo: 'delegazione', p_id: b.dataset.deD }); await ricaricaFatt(); }); }));
  },
};

/* ---------- Stock MeLi: fotografia presa da BookUp (edge function ou-titoli) ---------- */
const attivo11 = m => m.stato_articolo_cod === '1' && m.stato_vendita_cod === '1';
const statoMeli = m => `${m.stato_articolo_cod || '?'}-${m.stato_vendita_cod || '?'}`;
function coperturaSett(m){ const t = R.titoliMap.get(m.ean); const w = t ? Math.max(0, t.v_ult) / 4.35 : 0; return m.disponibilita <= 0 ? 0 : w ? m.disponibilita / w : Infinity; }
let AGG_MELI = null;   // aggiornamento in corso { fatti, totale, errori }
async function aggiornaMeli(){
  if (AGG_MELI) return;
  const tutti = await rpc('ed_titoli_periodo', { p_editore: ED.codice_editore, p_dal: (SESS.giorni || [])[0] || '2025-01-01', p_al: SESS.ultimo_giorno });
  const eans = [...new Set([...tutti.map(t => t.ean), ...R.giri.flatMap(g => g.titoli.map(t => t.ean))].filter(e => /^\d{10,13}$/.test(e)))];
  AGG_MELI = { fatti: 0, totale: eans.length, errori: 0, trovati: 0 };
  render();
  const { data: { session } } = await sb.auth.getSession();
  const buf = []; let i = 0;
  const salva = async () => { if (!buf.length) return; const righe = buf.splice(0); await rpc('ed_meli_salva', { p_editore: ED.codice_editore, p_righe: righe }); };
  async function worker(){
    while (i < eans.length){
      const ean = eans[i++];
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/ou-titoli`, { method: 'POST', headers: { Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ query: ean, limit: 1 }) });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(d.error || res.status);
        const t = (d.titles || []).find(x => String(x.ean) === ean);
        if (t){
          AGG_MELI.trovati++;
          buf.push({ ean, titolo: t.title, autore: t.author, prezzo: t.price ?? null, disponibilita: t.availability, m11: t.availability11, m21: t.availability21,
            stato_articolo: t.articleStatus, stato_articolo_cod: t.articleStatusCode, stato_vendita: t.saleStatus, stato_vendita_cod: t.saleStatusCode,
            risposta_editore: t.publisherResponse, genere: t.genre });
          if (buf.length >= 50) await salva();
        }
      } catch (_e) { AGG_MELI.errori++; }
      AGG_MELI.fatti++;
      const el = $('#meli-prog'); if (el) el.innerHTML = progMeli();
    }
  }
  try { await Promise.all(Array.from({ length: 6 }, worker)); await salva(); await ricarica('meli', 'ed_meli_lista'); R.meliMap = new Map((R.meli.righe || []).map(m => [m.ean, m])); }
  catch (e) { alert('Aggiornamento interrotto: ' + e.message); }
  finally { AGG_MELI = null; render(); }
}

async function atCall(body){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/anagrafiche-titoli`, { method: 'POST',
    headers: { Authorization: `Bearer ${session ? session.access_token : SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (data.risposta ? atTesto(data.risposta) : `Errore ${res.status}`));
  return data;
}
function atTesto(r){

  return (Array.isArray(r) ? r : [r]).map(x => typeof x === 'object' ? [x.ean, x.errorCode, x.errorMessage || x.message || x.description || x.title].filter(Boolean).join(' · ') || JSON.stringify(x).slice(0, 200) : String(x)).join('\n');

/* ---------- Materiali giri ----------
   L'editore carica PDF ed Excel per un giro vendita o un extra giro (bucket privato ed-materiali, elenco in ed_materiali_inviati).
   PDE pubblica i PDF nei Materiali dei giri di BookUp (bucket materiali-agenti + materiali_pdf, come fa BookUp) e usa l'Excel
   della cedola per creare la cedola in Giro Manager (Import da file editore). */
const TIPI_MAT = ['Cedola (Excel)', 'Cedola (PDF)', 'Schede titolo', 'Copertine', 'Comunicato stampa', 'Materiale POP', 'Altro'];
const MAT_ED = 'ed-materiali', MAT_BU = 'materiali-agenti';
const slugFile = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9.]+/g, '_').replace(/^_+|_+$/g, '') || 'file';
const formatoDi = n => /\.pdf$/i.test(n) ? 'pdf' : /\.(xlsx|xlsm|xls|csv)$/i.test(n) ? 'excel' : 'altro';

const STATI_MAT = { 'Inviato': ['warn', 'Arrivato a PDE'], 'In BookUp': ['ok', 'Pubblicato in BookUp'], 'In Giro Manager': ['ok', 'Cedola in Giro Manager'], 'Scartato': ['mut', 'Scartato'] };
async function apriMateriale(path){

  if (error) throw error; window.open(data.signedUrl, '_blank', 'noopener');
}
// PDF → Materiali dei giri di BookUp: stesso schema di BookUp (cartella del giro, nome "ranking-EDITORE")
async function pubblicaInBookUp(m, marchio){
  const { data: blob, error: e1 } = await sb.storage.from(MAT_ED).download(m.storage_path); if (e1) throw e1;
  const ed = String(marchio.nome).replace(/[\/\\:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  const base = m.tipo_materiale === 'Cedola (PDF)' ? `${Number(marchio.ranking)}-${ed}` : m.tipo_materiale === 'Altro' ? `${Number(marchio.ranking)}-${ed} - ${m.nome_file.replace(/\.pdf$/i, '')}` : `${Number(marchio.ranking)}-${ed} - ${m.tipo_materiale}`;
  const nome = base + '.pdf', path = `${slugFile(m.cartella)}/${slugFile(base)}.pdf`;
  const { error: e2 } = await sb.storage.from(MAT_BU).upload(path, blob, { upsert: true, contentType: 'application/pdf' });
  if (e2) throw new Error('BookUp non accetta il file: serve un utente amministratore di BookUp. ' + e2.message);
  const { error: e3 } = await sb.from('materiali_pdf').upsert({ cartella: m.cartella, tipo: m.destinazione === 'extra' ? 'extra' : 'giro', ranking: Number(marchio.ranking),
    editore: marchio.nome, codice_editore: ED.codice_editore, nome_file: nome, storage_path: path, dimensione: m.dimensione, caricato_il: new Date().toISOString() }, { onConflict: 'cartella,nome_file' });
  if (e3) throw e3;
  await rpc('ed_materiale_stato', { p_editore: ED.codice_editore, p_id: m.id, p_stato: 'In BookUp' });
}

          ${F.map(m => { const [c, l] = STATI_MAT[m.stato] || ['mut', m.stato];
            const az = ADMIN() ? (m.stato === 'Inviato'
                ? (m.formato === 'pdf' ? (marchi.length > 1 ? `<select class="m-marchio" data-id="${m.id}" style="max-width:150px">${marchi.map((x, i) => `<option value="${i}">${esc(titleCase(x.nome))}</option>`).join('')}</select> ` : '')
                    + `<button class="btn pri" data-mbu="${m.id}" ${marchi.length ? '' : 'disabled title="L\'editore non è in Ranking editori di BookUp"'}>Pubblica in BookUp</button> `
                  : m.formato === 'excel' ? `<button class="btn pri" data-mgm="${m.id}" title="Dopo averla caricata in Giro Manager con Import da file editore">Cedola in Giro Manager</button> ` : '')
                  + `<button class="btn" data-mst="${m.id}" data-st="Scartato">Scarta</button> `
                : `<button class="btn" data-mst="${m.id}" data-st="Inviato">Riapri</button> `) + `<button class="btn" data-mdel="${m.id}">Elimina</button>`
              : m.stato === 'Inviato' ? `<button class="btn" data-mdel="${m.id}">Elimina</button>` : '';
            return `<tr><td class="t-tit"><a href="#" data-mapri="${esc(m.storage_path)}">${esc(m.nome_file)}</a><div class="t-sub">${m.formato === 'pdf' ? 'PDF' : m.formato === 'excel' ? 'Excel' : 'File'}${m.dimensione ? ' · ' + fDec.format(m.dimensione / 1048576) + ' MB' : ''}${m.note ? ' · ' + esc(m.note) : ''}</div></td>
              <td class="small">${esc(titleCase(m.cartella))}<div class="t-sub">${m.destinazione === 'extra' ? 'Extra giro' : 'Giro vendita'}</div></td><td class="small">${esc(m.tipo_materiale)}</td>
              <td class="small">${fData(new Date(m.creato_il))}${ADMIN() && m.creato_da ? `<div class="t-sub">${esc(m.creato_da)}</div>` : ''}</td>
              <td><span class="pill ${c}">${l}</span></td><td style="white-space:nowrap">${az}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Quando invii un file lo trovi qui, con lo stato: arrivato a PDE, pubblicato in BookUp, cedola in Giro Manager.</div>'}</div>
      <div class="card" style="margin-top:16px"><h3>Già nei Materiali dei giri di BookUp</h3><p class="h-sub">${M.length} file di ${esc(ED.nome)} che gli agenti vedono in BookUp</p>
        <div class="tw scroll" style="max-height:360px"><table class="tbl"><thead><tr><th>File</th><th>Giro o extra giro</th><th class="r">Dimensione</th><th>Caricato il</th></tr></thead>
        <tbody>${M.map(m => `<tr><td class="t-tit">${esc(m.nome_file)}</td><td class="small">${esc(titleCase(m.cartella || ''))}</td><td class="r small">${m.dimensione ? fDec.format(m.dimensione / 1048576) + ' MB' : '—'}</td><td class="small">${m.caricato_il ? fData(new Date(m.caricato_il)) : '—'}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nessun materiale in BookUp</td></tr>'}</tbody></table></div></div>`;
  },
  init(){
    const drop = $('#drop'), inp = $('#m-file'), st = $('#m-stato');
    if (!drop) return;
    const X = R.matInv || { file: [], marchi: [] };
    const ricaricaMat = async () => { R.matInv = await rpc('ed_materiali_inviati_lista', { p_editore: ED.codice_editore }); render(); };
    $('#m-dest').addEventListener('change', e => { STATO.matDest = e.target.value; STATO.matTipo = $('#m-tipo').value; render(); });
    $('#m-tipo').addEventListener('change', e => { STATO.matTipo = e.target.value; });
    $('#m-extra')?.addEventListener('input', e => { STATO.matExtra = e.target.value; });
    const invia = async files => {
      files = [...files]; if (!files.length) return;
      const extra = STATO.matDest === 'extra', g = extra ? null : R.giri.find(x => x.chiave === $('#m-giro').value);
      const cartella = extra ? ($('#m-extra').value || '').trim().toUpperCase() : g ? cartellaGiro(g) : '';
      if (!cartella) { alert(extra ? 'Scrivi il nome dell\'extra giro' : 'Scegli il giro'); return; }
      const grandi = files.filter(f => f.size > 52428800); if (grandi.length) { alert('Questi file superano 50 MB: ' + grandi.map(f => f.name).join(', ')); return; }
      drop.classList.add('busy'); let ok = 0; const err = [];
      for (const [i, f] of files.entries()){
        st.textContent = `Invio ${i + 1} di ${files.length}: ${f.name}…`;
        const formato = formatoDi(f.name);
        let tipo = $('#m-tipo').value; if (formato === 'excel' && tipo === 'Cedola (PDF)') tipo = 'Cedola (Excel)'; if (formato === 'pdf' && tipo === 'Cedola (Excel)') tipo = 'Cedola (PDF)';
        const path = `${ED.codice_editore}/${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${slugFile(f.name)}`;
        try {
          const { error } = await sb.storage.from(MAT_ED).upload(path, f, { contentType: f.type || undefined });
          if (error) throw error;
          await rpc('ed_materiale_registra', { p_editore: ED.codice_editore, p: { destinazione: extra ? 'extra' : 'giro', giro_chiave: g ? g.chiave : '', cartella,
            tipo_materiale: tipo, formato, nome_file: f.name, storage_path: path, dimensione: f.size, note: $('#m-note').value } });
          ok++;
        } catch (e) { err.push(`${f.name}: ${e.message || e}`); }
      }
      drop.classList.remove('busy');
      await ricaricaMat();
      const s2 = $('#m-stato'); if (s2) s2.innerHTML = `${ok ? `<span class="pill ok">${ok} ${ok === 1 ? 'file inviato' : 'file inviati'} a PDE</span>` : ''}${err.length ? ` <span class="pill ko">non inviati: ${esc(err.join(' · '))}</span>` : ''}`;
    };
    drop.addEventListener('click', () => inp.click());
    inp.addEventListener('change', () => invia(inp.files));
    ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', ev => invia(ev.dataTransfer.files));
    const trova = id => (X.file || []).find(m => m.id === id);
    document.querySelectorAll('[data-mapri]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); apriMateriale(a.dataset.mapri).catch(er => alert('Non riesco ad aprire il file: ' + er.message)); }));
    document.querySelectorAll('[data-mdel]').forEach(b => b.addEventListener('click', () => { if (!confirm('Eliminare questo file?')) return;
      salvaCon(b, async () => { const path = await rpc('ed_materiale_elimina', { p_editore: ED.codice_editore, p_id: b.dataset.mdel }); if (path) await sb.storage.from(MAT_ED).remove([path]); await ricaricaMat(); }); }));
    document.querySelectorAll('[data-mst]').forEach(b => b.addEventListener('click', () => salvaCon(b, async () => {
      await rpc('ed_materiale_stato', { p_editore: ED.codice_editore, p_id: b.dataset.mst, p_stato: b.dataset.st }); await ricaricaMat(); })));
    document.querySelectorAll('[data-mgm]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('Segnare la cedola come caricata in Giro Manager?\n\nIn Giro Manager si carica con "Import da file editore": apri il file con il link qui accanto e trascinalo lì.')) return;
      salvaCon(b, async () => { await rpc('ed_materiale_stato', { p_editore: ED.codice_editore, p_id: b.dataset.mgm, p_stato: 'In Giro Manager' }); await ricaricaMat(); }); }));
    document.querySelectorAll('[data-mbu]').forEach(b => b.addEventListener('click', () => {
      const m = trova(b.dataset.mbu), sel = document.querySelector(`.m-marchio[data-id="${m.id}"]`), marchio = (X.marchi || [])[sel ? +sel.value : 0];
      if (!m || !marchio) return;
      if (!confirm(`Pubblicare "${m.nome_file}" nei Materiali dei giri di BookUp?\n\nCartella: ${m.cartella}\nEditore: ${marchio.nome} (ranking ${marchio.ranking})\n\nGli agenti lo vedranno in BookUp.`)) return;
      salvaCon(b, async () => { await pubblicaInBookUp(m, marchio); await ricarica('materiali', 'ed_materiali'); await ricaricaMat(); });
    }));
  },
};

// Sezioni ancora senza fonte dati: restano con dati di esempio, segnalati
// tutte le sezioni leggono dati veri

/* =====================================================================
   MENU, ACCESSO E NAVIGAZIONE
   ===================================================================== */
const MENU = [
  { g: 'Panoramica' },
  { id: 'dashboard', l: 'Panoramica', ic: 'home', a: ['#6d72f6', '#4338ca'] },
  { g: 'Analisi' },
  { id: 'analisi', l: 'Analisi dati', ic: 'bar', a: ['#29a9e1', '#0072b5'] },
  { id: 'settori', l: 'Settori e sell-out', ic: 'pie', a: ['#22c1a4', '#0d8a74'] },
  { g: 'Vendite' },
  { id: 'giri', l: 'Giri vendita', ic: 'route', a: ['#f59e42', '#d9622b'] },
  { id: 'finegiri', l: 'Fine giro', ic: 'flag', a: ['#f2b53a', '#c98500'] },
  { id: 'agenti', l: 'Agenti e zone', ic: 'users', a: ['#3d8bfd', '#1f5fc8'] },
  { id: 'sconti', l: 'Sconto per cliente', ic: 'perc', a: ['#ec6ca0', '#c23d74'], admin: true },
  { g: 'Economico' },
  { id: 'investimenti', l: 'Investimenti', ic: 'coins', a: ['#2bb673', '#127a48'] },
  { id: 'invconf', l: 'Investimenti confermati', ic: 'coins', a: ['#16a34a', '#0f6b33'] },
  { id: 'fatturazione', l: 'Fatturazione PDE', ic: 'rec', a: ['#5b7cfa', '#3a4fc4'], admin: true },
  { g: 'Catalogo e magazzino' },
  { id: 'anagrafiche', l: 'Anagrafiche titoli', ic: 'book', a: ['#6366f1', '#4338ca'], admin: true },
  { id: 'stock', l: 'Stock MeLi', ic: 'box', a: ['#8a94a6', '#56607a'] },
  { id: 'alert', l: 'Alert approvvigionamento', ic: 'alert', a: ['#f06b6b', '#c62828'] },
  { g: 'Attività' },
  { id: 'eventi', l: 'Eventi', ic: 'cal', a: ['#16b3c9', '#0a7f91'] },
  { id: 'materiali', l: 'Materiali giri', ic: 'up', a: ['#7c4dbe', '#552f94'] },
];
function disegnaMenu(attiva){
  const nav = $('#nav'), pos = nav.scrollTop;   // il menu si ridisegna: resta dov'era
  setTimeout(() => { nav.scrollTop = pos; });
  nav.innerHTML = MENU.filter(m => !m.admin || ADMIN()).map(m => m.g ? `<span class="nav-g">${m.g}</span>` : `<a href="#${m.id}" class="${m.id === attiva ? 'active' : ''}" style="--a1:${m.a[0]};--a2:${m.a[1]}">
    <span class="ic"><svg viewBox="0 0 24 24">${IC[m.ic]}</svg></span><span>${m.l}</span>${S[m.id]?.demo ? '<span class="tag-demo">esempio</span>' : ''}</a>`).join('');
}
const BANNER_DEMO = `<div class="banner-demo"><b>Sezione di esempio.</b> Questi numeri sono inventati e servono a mostrare come sarà la sezione: i dati veri arriveranno quando la fonte sarà collegata.</div>`;
let TOKEN = 0;
let ULTIMA_SEZ = null;
const SEZ_MISURA = ['dashboard', 'analisi', 'settori'];
async function render(){
  const t = ++TOKEN;
  const id = location.hash.slice(1) || 'dashboard';
  if (id === 'gfk') { STATO.tabSet = 'gfk'; history.replaceState(null, '', '#settori'); }   // GfK ora è una scheda di Settori e sell-out
  const idOk = id === 'gfk' ? 'settori' : id;
  const soloAdmin = (MENU.find(m => m.id === idOk) || {}).admin && !ADMIN();
  const key = S[idOk] && !soloAdmin ? idOk : 'dashboard';
  const sez = S[key];
  if (key !== ULTIMA_SEZ){ MISURA = 'valore'; ULTIMA_SEZ = key; }   // ogni sezione si apre sul valore
  const segM = $('#seg-misura'); if (segM){ segM.hidden = !SEZ_MISURA.includes(key); disegnaMisura(); }
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  setupChart();
  disegnaMenu(key);
  $('#tit').textContent = sez.titolo;
  document.title = sez.titolo + ' · BookUp Publisher Edition';
  if (!R) return;
  try {
    if (sez.prepara){
      $('#sub').textContent = '';
      $('#content').innerHTML = '<div class="card empty">Caricamento…</div>';
      await sez.prepara();
      if (t !== TOKEN) return;
    }
    $('#sub').textContent = sez.sub();
    $('#content').innerHTML = (sez.demo ? BANNER_DEMO : '') + sez.html();
    sez.init && sez.init();
  } catch (e) {
    if (t !== TOKEN) return;
    console.error(e);
    $('#content').innerHTML = `<div class="card empty">Non è stato possibile caricare la sezione: ${esc(e.message)}</div>`;
  }
}

function mostraLogin(msg){
  $('#app').hidden = true; $('#login').hidden = false;
  $('#login-err').textContent = msg || '';
}
function bloccato(msg){
  $('#app').hidden = true; $('#login').hidden = false;
  $('#f-login').innerHTML = `<div class="login-logo">${$('.brand').innerHTML}</div><h2>Accesso non autorizzato</h2>
    <p class="muted">${esc(msg)}</p><button class="btn pri" type="button" id="b-esci2">Esci</button>`;
  $('#b-esci2').addEventListener('click', esci);
}
async function esci(){ await sb.auth.signOut(); location.hash = ''; location.reload(); }
async function entra(){
  $('#login').hidden = true; $('#app').hidden = false;
  $('#content').innerHTML = '<div class="card empty">Caricamento dei dati…</div>';
  try { SESS = await rpc('ed_sessione'); }
  catch (e) { return bloccato('Errore di collegamento: ' + e.message); }
  PER = periodi();
  disegnaPeriodo();
  $('#utente').textContent = SESS.email || '';
  $('#dati-al').textContent = 'Dati al ' + fData(PER.ultimo);
  const ammesso = UTENTI_AMMESSI.includes(String(SESS.email || '').toLowerCase());
  if (SESS.admin && ammesso){
    const L = SESS.editori || [];
    if (!L.length) return bloccato('Nessun editore attivo nell\'area editori.');
    let scelto = null; try { scelto = localStorage.getItem('pde-editori-scelto'); } catch {}
    ED = L.find(e => e.codice_editore === scelto) || L[0];
    const s = $('#f-editore');
    s.innerHTML = L.map(e => `<option value="${esc(e.codice_editore)}">${esc(e.nome)}</option>`).join('');
    s.value = ED.codice_editore;
    $('#sel-editore').hidden = false;
  } else if (SESS.editore && !SESS.admin){
    ED = SESS.editore;
  } else {
    return bloccato('Questo utente non è abilitato all\'area editori. Scrivi a PDE per ricevere l\'accesso.');
  }
  await apriEditore();
}
// Logo dell'editore nel riquadro a sinistra: lo carica PDE (ridotto a 400 px), lo vede anche l'editore
function mostraLogo(){
  const L = ED && ED.logo, box = $('#ed-logo');
  box.hidden = !L; box.innerHTML = L ? `<img src="${L}" alt="Logo ${esc(ED.nome)}">` : '';
  box.closest('.editore-box').classList.toggle('con-logo', !!L);   // con il logo: nome e codice sotto, in piccolo
  const az = $('#ed-logo-az');
  az.innerHTML = ADMIN() ? `<label class="logo-az">${L ? 'Cambia logo' : '+ Carica il logo dell\'editore'}<input type="file" id="ed-logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label>${L ? ' · <a href="#" class="logo-az" id="ed-logo-togli">togli</a>' : ''}` : '';
  const salva = async logo => {
    try { await rpc('ed_editore_logo_salva', { p_editore: ED.codice_editore, p_logo: logo }); }
    catch (e) { alert('Logo non salvato: ' + e.message); return; }
    ED.logo = logo; const x = (SESS.editori || []).find(e => e.codice_editore === ED.codice_editore); if (x) x.logo = logo;
    mostraLogo();
  };
  $('#ed-logo-togli')?.addEventListener('click', e => { e.preventDefault(); if (confirm('Togliere il logo dell\'editore?')) salva(null); });
  $('#ed-logo-file')?.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml') { if (r.result.length > 600000) { alert('Il file è troppo grande.'); return; } salva(r.result); return; }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        salva(c.toDataURL('image/png'));
      };
      img.onerror = () => alert('Immagine non leggibile.');
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}
async function apriEditore(){
  R = null;
  STATO = { giriSel: [], annoGiri: 'tutti', agente: null };
  $('#ed-nome').textContent = ED.nome;
  mostraLogo();
  $('#ed-marchi').textContent = 'Caricamento…';
  $('#content').innerHTML = '<div class="card empty">Caricamento dei dati…</div>';
  try { await caricaEditore(ED.codice_editore); }
  catch (e) { $('#content').innerHTML = `<div class="card empty">Non è stato possibile caricare i dati: ${esc(e.message)}</div>`; return; }
  $('#ed-marchi').textContent = 'Codice editore ' + ED.codice_editore;
  await nomiCollane().catch(() => {});
  render();
}
async function avvio(){
  $('#f-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    $('#login-err').textContent = '';
    const b = ev.target.querySelector('button'); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password });
    b.disabled = false;
    if (error) { $('#login-err').textContent = 'Email o password non corrette.'; return; }
    entra();
  });
  $('#b-esci').addEventListener('click', esci);
  $('#b-periodo').addEventListener('click', apriPannelloPeriodo);
  document.querySelectorAll('#seg-misura button').forEach(b => b.addEventListener('click', () => { MISURA = b.dataset.m; disegnaMisura(); render(); }));
  document.addEventListener('click', e => { const i = e.target.closest('[data-cop]'); if (i) { e.stopPropagation(); apriCopertina(i.dataset.cop); } }, true);
  // chiude il pannello solo per un clic davvero fuori: il pannello si ridisegna a ogni scelta, e il pulsante cliccato non è più nella pagina
  document.addEventListener('click', e => { const p = $('#pan-per'); if (p && !p.hidden && e.target.isConnected && !e.target.closest('.periodo-wrap')) p.hidden = true; });
  $('#f-editore').addEventListener('change', e => {
    ED = (SESS.editori || []).find(x => x.codice_editore === e.target.value);
    try { localStorage.setItem('pde-editori-scelto', ED.codice_editore); } catch {}
    apriEditore();
  });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  const { data: { session } } = await sb.auth.getSession();
  if (session) entra(); else mostraLogin();
}
document.fonts?.ready.then(avvio) ?? avvio();
