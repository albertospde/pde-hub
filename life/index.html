<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDE Life</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/pde-app-logo.css">
<script>try{if(localStorage.getItem('pde-hub-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<style>
/* Layout: mappa a colonne da sinistra a destra (chi usa → ingresso → app → Supabase → motori → mondo esterno),
   tela SVG con pan/zoom, tubi animati per tipo di flusso, pannello dettagli a destra (in basso su telefono). */
:root{
  --ink:#060a13; --ink-2:#0b1220; --glass:#0f1828; --glass-2:#142035; --line:#1d2b44;
  --fg:#e6edf8; --fg-2:#9fb0c9; --fg-3:#62738f;
  --c-accesso:#3ee8ff; --c-dati:#a98bff; --c-funzione:#5b8cff; --c-esterno:#ffb547;
  --c-auto:#45f0a6; --c-auth:#ff5fa2; --c-link:#7d8aa3;
  --live:#45f0a6; --arriva:#ffb547; --legacy:#7d8aa3;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --line-2:#2d4166; --band:rgba(255,255,255,.012); --band-line:rgba(255,255,255,.03);
  --tube:#132036; --tube-on:#1a2c4a; --panel:rgba(10,17,30,.95); --fg-body:#cfd9ea; --bar:rgba(8,13,32,.94);
  color-scheme:dark;
}
/* Tema chiaro: segue la scelta fatta nel PDE Hub (stessa chiave pde-hub-theme, stesso dominio) */
:root[data-theme="light"]{
  --ink:#f3f6fb; --ink-2:#eaf0f8; --glass:#ffffff; --glass-2:#f1f6ff; --line:#d3dcea; --line-2:#9fb3d6;
  --fg:#0f1c4d; --fg-2:#3e5278; --fg-3:#73839f; --fg-body:#24365f;
  --c-accesso:#0090c4; --c-dati:#7752e8; --c-funzione:#1f6fe5; --c-esterno:#d0820a;
  --c-auto:#0f9e63; --c-auth:#d8367a; --c-link:#8a96ad;
  --live:#0f9e63; --arriva:#d0820a; --legacy:#8a96ad;
  --band:rgba(31,111,229,.025); --band-line:rgba(31,111,229,.07);
  --tube:#e2e9f4; --tube-on:#cfdbee; --panel:rgba(255,255,255,.97); --bar:rgba(255,255,255,.94);
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}

/* ── BARRA UNICA IN ALTO, come nel PDE Hub: filtri a sinistra, menu a destra ── */
.topbar{
  position:relative;z-index:8;height:50px;box-sizing:border-box;
  display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bar);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.topbar .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;padding-block:2px}
.topbar .chips::-webkit-scrollbar{display:none}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:500 13px var(--f-body);color:var(--fg-2);background:var(--glass);border:1px solid var(--line);white-space:nowrap;
  padding:5px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s;flex-shrink:0;
}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
#aud .chip[aria-pressed="true"]{background:linear-gradient(135deg,#1f6fe5 0%,#00b4e8 100%);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(0,120,220,.35)}
.dd-flussi .chip{border-radius:8px;width:100%;justify-content:flex-start;font-size:12.5px}
.dd-flussi .chip[aria-pressed="true"]{color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.off{opacity:.45}
.chip.off i{background:transparent;border:1px solid currentColor}
input.q{
  font:13px var(--f-body);color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;width:190px;box-sizing:border-box;
}
input.q:focus,.chip:focus-visible,button:focus-visible{outline:2px solid var(--c-accesso);outline-offset:2px}
.menu-wrap{position:relative}
.menu-btn{
  display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid var(--line);color:var(--fg-2);
  border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer;
}
.menu-btn:hover{color:var(--fg);border-color:var(--c-funzione)}
.menu-btn svg{width:14px;height:14px;fill:currentColor}
.dropdown{
  position:absolute;top:calc(100% + 8px);right:0;min-width:270px;max-width:calc(100vw - 24px);max-height:calc(100vh - 80px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.45);
  display:none;z-index:50;
}
.dropdown.open{display:block;animation:dropIn .2s ease}
@keyframes dropIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.dd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.dd-col{flex-direction:column;align-items:stretch}
.dd-label{font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em}
.dd-search{display:none}
.dd-search input.q{width:100%}
.stats{display:grid;grid-template-columns:repeat(5,auto);gap:4px 14px;font-family:var(--f-mono);font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.stats span{display:flex;flex-direction:column}
.stats span b{color:var(--fg);font-weight:500;font-size:16px}
.dd-flussi .chips{flex-direction:column;gap:4px}
.theme-switch{display:inline-flex;gap:4px}
.theme-opt{font:500 12px var(--f-body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg-2);cursor:pointer}
.theme-opt[aria-pressed="true"]{background:linear-gradient(135deg,#1f6fe5,#00b4e8);border-color:transparent;color:#fff}
.dropdown-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font:13px var(--f-body);color:var(--fg);background:none;border:0;width:100%;text-align:left;cursor:pointer}
.dropdown-item:hover{background:rgba(107,127,232,.1)}

/* ── BENVENUTO: riquadro iniziale con il logo del kit condiviso, si chiude ── */
.welcome-back{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:rgba(4,8,20,.45);backdrop-filter:blur(3px);
}
:root[data-theme="light"] .welcome-back{background:rgba(15,28,77,.18)}
.home-welcome{
  display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%;box-sizing:border-box;
  background:#fff;border:1px solid #d3dcea;border-radius:16px;padding:22px clamp(16px,5vw,30px);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);animation:dropIn .35s ease;
}
.home-welcome .hw-txt{font-family:Montserrat,var(--f-body);font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#1f6fe5}
.home-welcome .pde-logo{font-size:clamp(18px,7.2vw,34px)}
.home-welcome .hw-sub{font:13px var(--f-body);color:#3e5278;text-align:center;margin-top:6px;max-width:42ch}
.home-welcome .hw-go{
  margin-top:10px;font:600 13px var(--f-body);color:#fff;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;
  background:linear-gradient(135deg,#1f6fe5 0%,#00b4e8 100%);box-shadow:0 2px 10px rgba(0,120,220,.35);
}
.welcome-back[hidden]{display:none}
.stage{position:relative;overflow:hidden;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.stage aside#panel{-webkit-user-select:text;user-select:text}
.stage.dragging{cursor:grabbing}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 35% 40%,rgba(62,232,255,.06),transparent 60%),
    radial-gradient(900px 600px at 80% 70%,rgba(169,139,255,.06),transparent 60%);
}
svg#map{width:100%;height:100%;display:block;position:relative}
.zoom{position:absolute;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font:600 16px var(--f-display);cursor:pointer;
}
.zoom button:hover{border-color:var(--c-accesso)}
.hint{position:absolute;left:64px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--fg-3);pointer-events:none}

/* --- SVG --- */
.colhead{font:600 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;fill:var(--fg-3)}
.grouphead{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;fill:var(--fg-3);opacity:.75}
.colband{fill:var(--band);stroke:var(--band-line)}
.pipe{fill:none;transition:opacity .3s}
.pipe .tube{stroke:var(--tube);stroke-width:6;stroke-linecap:round}
.pipe .core{stroke-width:1.6;stroke-opacity:.35;stroke-linecap:round}
.pipe .flow{stroke-width:2.4;stroke-linecap:round;stroke-dasharray:2 22;animation:flow 1.6s linear infinite}
.pipe.rev .flow{animation-direction:reverse}
.pipe.t-link .flow{stroke-dasharray:1 9;animation-duration:3s}
.pipe.t-link .core{stroke-dasharray:3 5}
.pipe.dashed .core{stroke-dasharray:4 6}
@keyframes flow{to{stroke-dashoffset:-24}}
.dim .pipe{opacity:.06}
.dim .pipe.on{opacity:1}
.pipe.on .tube{stroke:var(--tube-on)}
.pipe.on .core{stroke-opacity:.9;stroke-width:2}
.pipe.on .flow{stroke-width:3.2;animation-duration:.9s;filter:url(#glow)}
.pipe.hide{display:none}

.node{cursor:pointer}
.node rect.box{fill:var(--glass);stroke:var(--line);stroke-width:1;transition:stroke .2s,fill .2s}
.node:hover rect.box{stroke:var(--line-2);fill:var(--glass-2)}
.node .halo{fill:none;stroke-width:1.5;opacity:0;transition:opacity .25s}
.node.sel .halo,.node.hit .halo{opacity:1}
.node .lbl{font:600 13px var(--f-display);fill:var(--fg)}
.node .sub{font:400 10.5px var(--f-mono);fill:var(--fg-3)}
.node .dot{stroke:var(--ink);stroke-width:2}
.node .tag{font:600 9px var(--f-mono);letter-spacing:.08em}
.node.big .lbl{font-size:22px}
.node.big .sub{font-size:11px}
.dim .node{opacity:.18;transition:opacity .3s}
.dim .node.on{opacity:1}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke:var(--c-accesso);stroke-width:2}

/* --- pannello --- */
aside#panel{
  position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:min(380px,calc(100% - 24px));
  background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
  z-index:6;display:flex;flex-direction:column;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);
  transform:translateX(0);transition:transform .3s,opacity .3s;
}
aside#panel[hidden]{display:flex!important;transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.p-head > div{min-width:0;flex:1}
.p-kicker{font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.p-head h2{margin:4px 0 2px;font:700 20px var(--f-display);text-wrap:balance}
.p-sub{font:12px var(--f-mono);color:var(--fg-2);word-break:break-all}
.p-close{background:none;border:1px solid var(--line);color:var(--fg-2);border-radius:8px;width:30px;height:30px;cursor:pointer;flex:none;font-size:16px}
.p-body{padding:14px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0}
.p-body p{margin:0;line-height:1.55;color:var(--fg-body);max-width:65ch}
.p-sec h3{margin:0 0 6px;font:500 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:12px var(--f-mono);padding:3px 8px;border-radius:6px;background:var(--ink-2);border:1px solid var(--line);color:var(--fg-2)}
.pill.who{font-family:var(--f-body);color:var(--fg);border-color:var(--line-2)}
.conn{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.conn li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 8px;border-radius:8px;cursor:pointer;background:var(--ink-2)}
.conn li:hover{background:var(--glass-2)}
.conn li i{width:10px;height:3px;border-radius:2px}
.conn li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn li em{font-style:normal;font:11px var(--f-mono);color:var(--fg-3)}
.status{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;width:max-content}
.status.live{color:var(--live)} .status.arriva{color:var(--arriva)} .status.legacy{color:var(--legacy)}
a.url{color:var(--c-accesso);font:12px var(--f-mono);word-break:break-all}

@media (max-width:760px){
  .topbar{gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .topbar > input.q{display:none}
  .dd-search{display:flex}
  .menu-btn .mb-txt{display:none}
  .stats{grid-template-columns:repeat(3,auto)}
  .hint{display:none}
  aside#panel{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;height:58%;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  aside#panel[hidden]{transform:translateY(calc(100% + 40px))}
}
@media (prefers-reduced-motion:reduce){
  .pipe .flow{animation:none;stroke-dasharray:none;stroke-opacity:.5}
  aside#panel{transition:none}
}
</style>
</head>
<body>

<div class="app">
<div class="topbar" id="topbar">
  <div class="chips" id="aud" role="group" aria-label="Filtra per destinatario"></div>
  <input class="q" id="q" type="search" placeholder="Cerca app, funzione, tabella…" aria-label="Cerca nella mappa">
  <div class="topbar-right">
    <div class="menu-wrap">
      <button class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        <span class="mb-txt">Menu</span>
        <svg viewBox="0 0 24 24" style="width:10px;height:10px"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="dropdown" id="dropdown">
        <div class="dd-row dd-col dd-search"><span class="dd-label">Cerca</span><input class="q" id="q2" type="search" placeholder="App, funzione, tabella…" aria-label="Cerca nella mappa"></div>
        <div class="dd-row dd-col"><span class="dd-label">La mappa in numeri</span><div class="stats" id="stats"></div></div>
        <div class="dd-row dd-col dd-flussi"><span class="dd-label">Flussi visibili</span><div class="chips" id="legend" role="group" aria-label="Mostra o nascondi tipi di flusso"></div></div>
        <div class="dd-row"><span class="dd-label">Tema</span><div class="theme-switch" role="group" aria-label="Tema">
          <button class="theme-opt" data-set="light" type="button">Chiaro</button><button class="theme-opt" data-set="dark" type="button">Scuro</button>
        </div></div>
        <button class="dropdown-item" id="dd-welcome" type="button">Rivedi il benvenuto</button>
      </div>
    </div>
  </div>
</div>

<div class="stage" id="stage">
  <svg id="map" role="img" aria-label="Mappa interattiva di PDE Hub e delle app collegate">
    <defs>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="nodeglow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
    </defs>
    <g id="world">
      <g id="bands"></g>
      <g id="pipes"></g>
      <g id="nodes"></g>
    </g>
  </svg>
  <div class="zoom">
    <button id="zin" aria-label="Ingrandisci">+</button>
    <button id="zout" aria-label="Riduci">−</button>
    <button id="zfit" aria-label="Adatta allo schermo" style="font-size:12px">⤢</button>
  </div>
  <div class="hint">Trascina per spostarti · rotella per lo zoom · clic su un nodo per i dettagli</div>

  <div class="welcome-back" id="welcome" hidden>
    <div class="home-welcome" role="dialog" aria-label="Benvenuto in PDE Life">
      <span class="hw-txt">Benvenuto in</span>
      <div class="pde-logo" role="img" aria-label="PDE Life — Chi. Cosa. Con chi."><div class="pl-text"><div class="pl-name"><b>PDE</b><span>LIFE</span></div><div class="pl-tag"><i class="c0">CHI.</i><em>I</em><i class="c1">COSA.</i><em>I</em><i class="c2">CON CHI.</i></div></div><div class="pl-wing"></div></div>
      <p class="hw-sub">La mappa viva di PDE Hub: chi usa ogni app, con cosa parla e dove vanno i dati. Clicca un nodo per i dettagli.</p>
      <button class="hw-go" id="hw-go" type="button">Esplora la mappa</button>
    </div>
  </div>

  <aside id="panel" hidden aria-live="polite">
    <div class="p-head">
      <div>
        <div class="p-kicker" id="p-kicker"></div>
        <h2 id="p-title"></h2>
        <div class="p-sub" id="p-sub"></div>
      </div>
      <button class="p-close" id="p-close" aria-label="Chiudi dettagli">×</button>
    </div>
    <div class="p-body" id="p-body"></div>
  </aside>
</div>
</div>

<script>
/* ============================================================
   DATI — ricostruiti dal codice in C:\Users\simolaa\PDE APP (24/11/2026)
   ============================================================ */
const COLS = [
  {t:"Chi lo usa"},
  {t:"Ingresso"},
  {t:"App"},
  {t:"Supabase"},
  {t:"Motori · edge function & automazioni"},
  {t:"Mondo esterno"}
];

const TYPES = {
  accesso:  {label:"Accesso utenti",      c:"var(--c-accesso)", on:true},
  dati:     {label:"Lettura / scrittura DB", c:"var(--c-dati)", on:true},
  funzione: {label:"Chiamata edge function", c:"var(--c-funzione)", on:true},
  esterno:  {label:"Integrazione esterna", c:"var(--c-esterno)", on:true},
  auto:     {label:"Automatico / pianificato", c:"var(--c-auto)", on:true},
  auth:     {label:"Login e utenze",       c:"var(--c-auth)", on:true},
  link:     {label:"Link dal Hub",         c:"var(--c-link)", on:false}
};

const AUD = {
  gest:{label:"Gestori"}, team:{label:"Team PDE"}, agenti:{label:"Agenti"}, editori:{label:"Editori"}, librerie:{label:"Librerie"}
};
const ALL_INT = ["gest","team"];

const N = [
  // ---- col 0: destinatari
  {id:"u_gest", col:0, g:"Persone", label:"Gestori PDE", sub:"Alberto · Elisa", aud:"gest",
   desc:"Account con app_metadata.gestione_utenti = true. Vedono tutto, comprese le card con data-solo-per (Analisi, Publisher, Events; Festival solo Alberto) e la sezione Amministrazione."},
  {id:"u_team", col:0, g:"Persone", label:"Team PDE", sub:"ruolo admin / altro", aud:"team",
   desc:"Colleghi interni. Nel Hub vedono Tool interni, AppSelling & Utility, Comunicazione, Presenze e HR, tranne le card riservate ai gestori."},
  {id:"u_agenti", col:0, g:"Persone", label:"Agenti", sub:"ruolo agente", aud:"agenti",

/* ============================================================
   LAYOUT
   ============================================================ */
const COLX = [0, 300, 600, 920, 1220, 1540];
const NW = 220, NH = 48, GAP = 10, GHEAD = 30, GGAP = 18, TOP = 70;
const byId = {}; N.forEach(n=>byId[n.id]=n);

function layout(){
  const heights = [];
  COLS.forEach((c,ci)=>{
    const ns = N.filter(n=>n.col===ci);
    let y=0, lastG=null; c.groups=[];
    ns.forEach(n=>{
      if(n.g!==lastG){ if(lastG!==null) y+=GGAP; c.groups.push({g:n.g,y}); y+=GHEAD-8; lastG=n.g; }
      n.w = NW; n.h = n.big?150:(n.big2?72:NH);
      n.x = COLX[ci]; n.y = y; y += n.h + GAP;
    });
    c.h = y; heights.push(y);
  });
  const H = Math.max(...heights);
  COLS.forEach((c,ci)=>{
    const off = TOP + (H - c.h)/2;
    c.off = off;
    N.filter(n=>n.col===ci).forEach(n=>n.y+=off);
    c.groups.forEach(g=>g.y+=off);
  });
  return {W: COLX[5]+NW, H: H+TOP+40};
}
const SIZE = layout();

/* ports: distribuisce gli attacchi lungo il lato del nodo, ordinati per posizione dell'altro capo */
const edges = E.map((e,i)=>{
  const [a,b,t,l,o] = e; const A=byId[a], B=byId[b];
  if(!A||!B) console.warn("edge",e);
  const L = A.col<=B.col?A:B, R = L===A?B:A;
  return {i,a,b,t,l:l||"",o:o||{},L,R,rev:L!==A};
});
N.forEach(n=>{ n.outP=[]; n.inP=[]; });
edges.forEach(e=>{ e.L.outP.push(e); e.R.inP.push(e); });
function cy(n){return n.y+n.h/2}
N.forEach(n=>{
  const assign=(arr,key,other)=>{
    arr.sort((p,q)=>cy(p[other])-cy(q[other]));
    const k=arr.length, span=Math.min(n.h-14, k*7);
    arr.forEach((e,j)=>{ e[key] = cy(n) + (k===1?0:(-span/2 + span*j/(k-1))); });
  };
  assign(n.outP,"y1","R"); assign(n.inP,"y2","L");
});

   ============================================================ */
const world=$("#world");
function neighbors(id){ return edges.filter(e=>(e.a===id||e.b===id)&&TYPES[e.t].on); }
function downstream(startIds){
  // segue i tubi verso destra (colonne crescenti) a partire dalle app
  const seenN=new Set(startIds), seenE=new Set(), q=[...startIds];
  while(q.length){
    const id=q.shift(), n=byId[id];
    if(n.col===3) continue; // Supabase è un punto d'arrivo: non riespandere verso tutte le automazioni
    edges.forEach(e=>{
      if(!TYPES[e.t].on) return;
      let other=null;
      if(e.a===id) other=e.b; else if(e.b===id) other=e.a; else return;
      const o=byId[other];
      if(o.col<=n.col && !(n.col===4 && o.col===3)) return; // solo verso valle (DB raggiungibile dai motori)
      if(o.col<=1) return;
      seenE.add(e);
      if(!seenN.has(other)){ seenN.add(other); q.push(other); }
    });
  }
  return {seenN,seenE};
}
function highlight(nodeSet,edgeSet,selId){
  world.classList.add("dim");
  N.forEach(n=>{ n.g.classList.toggle("on",nodeSet.has(n.id)); n.g.classList.toggle("sel",n.id===selId); n.g.classList.remove("hit"); });
  edges.forEach(e=>e.g.classList.toggle("on",edgeSet.has(e)));
}
function clearSel(){
  world.classList.remove("dim");
  N.forEach(n=>n.g.classList.remove("on","sel","hit"));
  edges.forEach(e=>e.g.classList.remove("on"));
  $("#panel").hidden=true; current=null;
}
let current=null;
function select(id){
  const n=byId[id]; current=id;
  let ns=new Set([id]), es=new Set();
  if(n.col===0){
    const aud=n.aud;
    const apps=N.filter(x=>x.col===2 && (x.who||[]).includes(aud)).map(x=>x.id);
    const d=downstream(apps); ns=d.seenN; es=d.seenE; ns.add(id);
    edges.forEach(e=>{
      if(!TYPES[e.t].on) return;
      if(e.a===id){ es.add(e); ns.add(e.b); }
      if(e.a==="hub" && apps.includes(e.b) && ["gest","team","agenti"].includes(aud)) { es.add(e); ns.add("hub"); }
      if(aud==="agenti" && e.a==="hub" && e.t==="link" && ["x_rpn","x_meli"].includes(e.b)){ es.add(e); ns.add(e.b); }
    });
  }else{
    neighbors(id).forEach(e=>{ es.add(e); ns.add(e.a); ns.add(e.b); });
    if(n.col===2){ const d=downstream([id]); d.seenN.forEach(x=>ns.add(x)); d.seenE.forEach(x=>es.add(x)); }
  }
  highlight(ns,es,id);
  showPanel(n,es);
}

const svg=$("#map"), stage=$("#stage");
let vb={x:0,y:0,w:SIZE.W,h:SIZE.H};
function setVB(){ svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit(){
  const r=stage.getBoundingClientRect(), pad=40;
  const W=SIZE.W+pad*2, H=SIZE.H+pad;
  const ar=r.width/r.height;
  if(W/H>ar){ vb.w=W; vb.h=W/ar; } else { vb.h=H; vb.w=H*ar; }
  vb.x=-pad-(vb.w-W)/2; vb.y=-(vb.h-H)/2;
  // su schermi stretti parti dal lato sinistro a una scala leggibile
  if(r.width<760){ const s=r.width/700; vb.w=r.width/s; vb.h=r.height/s; vb.x=-20; vb.y=0; }
  setVB();
}
function zoomAt(f,cx,cy){
  const r=stage.getBoundingClientRect();
  const px=vb.x+(cx-r.left)/r.width*vb.w, py=vb.y+(cy-r.top)/r.height*vb.h;
  const nw=Math.min(Math.max(vb.w*f,300),SIZE.W*3); const k=nw/vb.w;
  vb.x=px-(px-vb.x)*k; vb.y=py-(py-vb.y)*k; vb.w=nw; vb.h*=k; setVB();
}
function focusNode(n){
  const r=stage.getBoundingClientRect();
  const s=r.width/vb.w;
  vb.x=n.x+n.w/2-(r.width<760?r.width/2:(r.width-400)/2)/s; vb.y=n.y+n.h/2-(r.width<760?r.height*0.22:r.height/2)/s; setVB();
}
stage.addEventListener("wheel",ev=>{ev.preventDefault(); zoomAt(ev.deltaY>0?1.12:1/1.12,ev.clientX,ev.clientY);},{passive:false});
let drag=null, moved=false;
const pts=new Map();
stage.addEventListener("pointerdown",ev=>{
  if(ev.target.closest("#panel,.zoom")) return;
  if(ev.pointerType==="mouse") ev.preventDefault(); // niente selezione del testo mentre si trascina
  pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  drag={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y}; moved=false;
});
stage.addEventListener("pointermove",ev=>{
  if(!pts.has(ev.pointerId)) return;
  const prev=pts.get(ev.pointerId); pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pts.size===2){
    const [a,b]=[...pts.values()]; const pa=[...pts.entries()].find(([k])=>k!==ev.pointerId)[1];
    const d1=Math.hypot(prev.x-pa.x,prev.y-pa.y), d2=Math.hypot(a.x-b.x,a.y-b.y);
    if(d1>0) zoomAt(d1/d2,(a.x+b.x)/2,(a.y+b.y)/2); moved=true; return;
  }
  if(!drag) return;
  const r=stage.getBoundingClientRect(), dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; stage.classList.add("dragging"); if(!stage.hasPointerCapture(ev.pointerId)) stage.setPointerCapture(ev.pointerId); }
  vb.x=drag.vx-dx*vb.w/r.width; vb.y=drag.vy-dy*vb.h/r.height; setVB();
});
const endPtr=ev=>{ pts.delete(ev.pointerId); if(pts.size===0){ drag=null; stage.classList.remove("dragging"); } };
stage.addEventListener("pointerup",endPtr); stage.addEventListener("pointercancel",endPtr);
svg.addEventListener("click",ev=>{ if(moved){moved=false;return;} if(!ev.target.closest(".node")){ clearSel(); audSel=null; Object.entries(audChips).forEach(([k,b])=>b.setAttribute("aria-pressed",k==="all"?"true":"false")); } });
