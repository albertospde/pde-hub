<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PDE · Sfondo settimana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/pde-app-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b1220; --bg2: #101a2e; --card: rgba(22, 34, 58, .78); --line: rgba(120, 160, 220, .16);
    --tx: #e8eef8; --tx2: #9fb0c8; --tx3: #6c7f9c;
    --blu: #1f6fe5; --ciano: #00b4e8; --verde: #2fbf8f; --ambra: #f0a93b; --rosso: #ef5b5b; --viola: #9b7bf0;
    /* margini per icone del desktop (sx) e barra applicazioni (basso) */
    --pad-sx: 7vw; --pad-dx: 2.6vw; --pad-top: 3vh; --pad-bot: 7.5vh;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Montserrat, "Segoe UI", sans-serif; color: var(--tx); font-size: clamp(11px, .78vw, 17px);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(0,180,232,.16), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(31,111,229,.18), transparent 60%),
      linear-gradient(160deg, var(--bg2), var(--bg));
    /* sfondo: niente clic, niente selezione */
    pointer-events: none; user-select: none; -webkit-user-select: none; cursor: default;
  }
  .wrap { position: absolute; inset: var(--pad-top) var(--pad-dx) var(--pad-bot) var(--pad-sx);
    display: grid; grid-template-columns: 1.15fr 1.15fr .95fr; grid-template-rows: auto 1fr; gap: 1.6vh 1.4vw; }

  /* intestazione */
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .logo-box { background: #fff; border-radius: 10px; padding: .55em .9em; display: inline-flex; }
  .logo-box .pde-logo { font-size: clamp(13px, 1vw, 20px); }
  .ora { text-align: right; }
  .ora .h { font-size: 3.6em; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  .ora .d { font-size: 1.15em; color: var(--tx2); margin-top: .3em; text-transform: capitalize; }
  .giro { flex: 1; max-width: 42em; }
  .giro .lbl { font-size: .85em; color: var(--tx2); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; }
  .giro .lbl b { color: var(--tx); letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 1.15em; }
  .bar { height: 7px; background: rgba(255,255,255,.08); border-radius: 9px; margin: .55em 0 .35em; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--blu), var(--ciano)); }
  .giro .sub { font-size: .85em; color: var(--tx3); display: flex; justify-content: space-between; }

  /* card */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.3em 1.4em;
    display: flex; flex-direction: column; min-height: 0; backdrop-filter: blur(6px); }
  .kicker { font-size: .78em; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: .6em; }
  .kicker .dot { width: .6em; height: .6em; border-radius: 50%; }
  .card h2 { font-size: 2.7em; font-weight: 700; letter-spacing: -.02em; margin: .2em 0 .1em; line-height: 1.05; }
  .card h2 small { font-size: .42em; font-weight: 500; color: var(--tx2); letter-spacing: 0; margin-left: .4em; }
  .meta { color: var(--tx2); font-size: 1em; margin-bottom: .9em; }
  .meta b { color: var(--tx); font-weight: 600; }
  .chip { display: inline-block; font-size: .78em; padding: .2em .65em; border-radius: 99px; font-weight: 600; margin-left: .4em; vertical-align: middle; }
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7em; margin-bottom: 1em; }
  .kpi div { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: .6em .75em; }
  .kpi span { display: block; font-size: .72em; color: var(--tx3); letter-spacing: .1em; text-transform: uppercase; }
  .kpi b { font-size: 1.55em; font-weight: 600; font-variant-numeric: tabular-nums; }
  .lista { list-style: none; overflow: hidden; flex: 1; min-height: 0; }
  .lista li { display: grid; grid-template-columns: 1fr auto; gap: .2em 1em; padding: .5em 0; border-top: 1px solid var(--line); }
  .lista .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; }
  .lista .t::first-letter { text-transform: uppercase; }
  .lista .e { grid-column: 1; font-size: .82em; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .03em; }
  .lista .n { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tx2); }
  .vuoto { color: var(--tx3); font-style: italic; padding: 1em 0; }
  .countdown { margin-left: auto; font-size: .95em; font-weight: 700; padding: .25em .7em; border-radius: 8px; letter-spacing: 0; text-transform: none; }

  /* colonna agenda */
  .agenda { gap: 0; }
  .agenda h3 { font-size: .78em; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; color: var(--tx2); margin: .2em 0 .6em; }
  .agenda h3 + * { margin-bottom: 1.1em; }
  .tl { list-style: none; overflow: hidden; }
  .tl li { display: grid; grid-template-columns: 4.3em 1fr; gap: .9em; padding: .42em 0; align-items: center; }
  .tl .dt { text-align: center; border-radius: 9px; padding: .25em 0; background: rgba(255,255,255,.05); border: 1px solid var(--line); line-height: 1.1; }
  .tl .dt b { display: block; font-size: 1.3em; }
  .tl .dt span { font-size: .7em; color: var(--tx3); text-transform: uppercase; letter-spacing: .08em; }
  .tl .tx { font-size: .95em; line-height: 1.3; }
  .tl .tx small { display: block; color: var(--tx3); font-size: .82em; }
  .tl li.oggi .dt { background: rgba(0,180,232,.18); border-color: rgba(0,180,232,.5); }
  .tag { display: inline-block; width: .55em; height: .55em; border-radius: 50%; margin-right: .45em; vertical-align: middle; }
  .riunione { background: rgba(155,123,240,.1); border: 1px solid rgba(155,123,240,.35); border-radius: 10px; padding: .6em .8em; margin-bottom: .5em; }
  .riunione b { display: block; }
  .riunione span { color: var(--tx2); font-size: .9em; }
  footer { position: absolute; right: var(--pad-dx); bottom: calc(var(--pad-bot) - 2.2em); font-size: .72em; color: var(--tx3); }
  .offline footer { color: var(--ambra); }
  /* login: visibile solo alla prima configurazione */
  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5,10,20,.82); z-index: 10; pointer-events: auto; }
  body.da-login #login { display: flex; }
  body.da-login { pointer-events: auto; }
  #login form { background: #121d33; border: 1px solid var(--line); border-radius: 16px; padding: 2em 2.2em; width: 26em; display: flex; flex-direction: column; gap: .8em; }
  #login h1 { font-size: 1.4em; font-weight: 600; }
  #login p { color: var(--tx2); font-size: .9em; line-height: 1.4; }
  #login input { font: inherit; padding: .7em .9em; border-radius: 9px; border: 1px solid var(--line); background: #0b1220; color: var(--tx); user-select: text; -webkit-user-select: text; }
  #login button { font: inherit; font-weight: 600; padding: .75em; border: 0; border-radius: 9px; background: var(--blu); color: #fff; cursor: pointer; }
  #login .err { color: var(--rosso); font-size: .85em; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-box"><div class="pde-logo" role="img" aria-label="PDE Settimana"><div class="pl-text"><div class="pl-name"><b>PDE</b><span>SETTIMANA</span></div><div class="pl-tag"><i class="c0">LANCI.</i><em>I</em><i class="c1">USCITE.</i><em>I</em><i class="c2">SCADENZE.</i></div></div><div class="pl-wing"></div></div></div>
    <div class="giro" id="giro"></div>
    <div class="ora"><div class="h" id="h">--:--</div><div class="d" id="d"></div></div>
  </header>
  <section class="card" id="trasm"></section>
  <section class="card" id="uscita"></section>
  <section class="card agenda" id="agenda"></section>
</div>
<footer id="ft"></footer>
<div id="login"><form id="lf" autocomplete="on">
  <h1>Accedi a PDE Settimana</h1>
  <p>Usa le credenziali PDE. Serve solo la prima volta: poi lo sfondo resta collegato e non è più cliccabile.</p>
  <input id="le" type="email" placeholder="nome.cognome@pde.it" required autocomplete="username">
  <input id="lp" type="password" placeholder="Password" required autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button type="submit">Accedi</button>
</form></div>

<script>
// Sfondo dinamico PDE: sola lettura, accesso solo con account PDE
const SUPABASE_URL = 'https://tdflwenlylhctxssatax.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmx3ZW5seWxoY3R4c3NhdGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzgyNzYsImV4cCI6MjA5MTkxNDI3Nn0.l35qEL7LOvyYuI1McQlVqj4vbyTqmlevcmqWbTGYi2Q';
const FEED = SUPABASE_URL + '/functions/v1/sfondo-feed';
const P = new URLSearchParams(location.search);
const DEMO = P.get('demo'); // file json locale per prove
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pde-sfondo-auth' } });
const AGGIORNA_MIN = 10;

// blocca qualsiasi interazione (Lively di norma non inoltra il mouse, questo è un doppio blocco)
// (attivo solo quando non serve il login)
['contextmenu','mousedown','keydown','wheel','dragstart','selectstart'].forEach(ev =>
  addEventListener(ev, e => { if (!document.body.classList.contains('da-login')) e.preventDefault(); }, { capture: true, passive: false }));

const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const MM = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const d0 = s => new Date(s + 'T12:00:00');
const fmt = s => { const d = d0(s); return `${GG[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`; };
const num = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const oggiISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const diffGG = s => Math.round((d0(s) - d0(oggiISO())) / 864e5);

function orologio() {
  const d = new Date();
  document.getElementById('h').textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('d').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function listaTitoli(t) {
  if (!t || !t.length) return '<div class="vuoto">Titoli non ancora sincronizzati da Messaggerie</div>';
  return '<ul class="lista">' + t.map(r => `<li><span class="t">${esc(r.titolo)}</span><span class="n">${num(r.prenotato)}</span><span class="e">${esc(r.editore)}${r.autore ? ' · ' + esc(r.autore) : ''}</span></li>`).join('') + '</ul>';
}

function rTrasm(l, prox) {
  const el = document.getElementById('trasm');
  if (!l) { el.innerHTML = '<div class="kicker">Lancio da trasmettere</div><div class="vuoto">Nessun lancio in calendario</div>'; return; }
  const g = diffGG(l.iscrizione);
  let cd = '', col = 'var(--ciano)';
  if (g > 0) { cd = g === 1 ? 'iscrizione domani' : `iscrizione tra ${g} gg`; col = g <= 2 ? 'var(--rosso)' : 'var(--ambra)'; }
  else if (g === 0) { cd = 'iscrizione OGGI'; col = 'var(--rosso)'; }
  else { cd = 'da trasmettere'; col = 'var(--ambra)'; }
  const proxTxt = prox ? ` · prossima: lancio ${prox.numero} il ${fmt(prox.iscrizione)}` : '';
  el.innerHTML = `
    <div class="kicker" style="color:var(--ciano)"><span class="dot" style="background:var(--ciano)"></span>${l.della_settimana ? 'Lancio della settimana' : 'Prossimo lancio'}
      <span class="countdown" style="background:${col}22;color:${col}">${cd}</span></div>
    <h2>Lancio ${l.numero}<small>${l.anno}</small></h2>
    <div class="meta">Iscrizione <b>${fmt(l.iscrizione)}</b> · in libreria <b>${fmt(l.vendita_sopra)}</b>${l.uscita_stimata ? ' <span class="chip" style="background:#ffffff14;color:var(--tx3)">stima</span>' : ''}${esc(proxTxt)}</div>
    <div class="kpi">
      <div><span>Titoli</span><b>${num(l.n_titoli)}</b></div>
      <div><span>Editori</span><b>${num(l.n_editori)}</b></div>
      <div><span>Prenotato</span><b>${num(l.prenotato_trasmesso || l.prenotato_iscrizione)}</b></div>
    </div>
    ${listaTitoli(l.titoli)}`;
}

function rUscita(arr) {
  const el = document.getElementById('uscita');
  if (!arr || !arr.length) { el.innerHTML = '<div class="kicker">In uscita</div><div class="vuoto">Nessuna uscita in calendario</div>'; return; }
  const l = arr[0];
  const date = l.vendita_sopra === l.vendita_sotto
    ? `in libreria <b>${fmt(l.vendita_sopra)}</b>`
    : `in libreria <b>${fmt(l.vendita_sopra)}</b> (&gt; 2.000) · <b>${fmt(l.vendita_sotto)}</b> (&lt; 2.000)`;
  const altri = arr.slice(1).map(x => `lancio ${x.numero}`).join(', ');
  el.innerHTML = `
    <div class="kicker" style="color:var(--verde)"><span class="dot" style="background:var(--verde)"></span>${l.settimana_corrente ? 'Esce questa settimana' : 'Prossima uscita'}</div>
    <h2>Lancio ${l.numero}<small>${l.anno}</small></h2>
    <div class="meta">${date}${l.uscita_stimata ? ' <span class="chip" style="background:#ffffff14;color:var(--tx3)">stima</span>' : ''}${altri ? ` · anche ${esc(altri)}` : ''}</div>
    <div class="kpi">
      <div><span>Titoli</span><b>${num(l.n_titoli)}</b></div>
      <div><span>Editori</span><b>${num(l.n_editori)}</b></div>
      <div><span>Prenotato</span><b>${num(l.prenotato_trasmesso || l.prenotato_iscrizione)}</b></div>
    </div>
    ${listaTitoli(l.titoli)}`;
}

const COL = { iscrizione: 'var(--ciano)', magazzino: 'var(--ambra)', uscita: 'var(--verde)', giro: 'var(--blu)', evento: 'var(--viola)' };

function rAgenda(f) {
  const el = document.getElementById('agenda');
  const oggi = oggiISO();
  const ev = (f.eventi || []).map(e => ({ data: e.data, tipo: 'evento',
    testo: e.titolo, sub: [e.ora, e.autore, e.luogo || e.citta].filter(Boolean).join(' · ') }));
  const tutte = [...(f.scadenze || []), ...ev].sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0).slice(0, 11);
  const riun = (f.riunioni || []).map(r => `<div class="riunione"><b>Riunioni ${esc(r.giro)}</b><span>${esc(r.quando)} · uscite ${esc(r.mese_uscita || '')}</span></div>`).join('');
  el.innerHTML = `
    <h3>Prossime scadenze</h3>
    <ul class="tl">${tutte.map(s => { const d = d0(s.data); return `
      <li class="${s.data === oggi ? 'oggi' : ''}"><div class="dt"><b>${d.getDate()}</b><span>${GG[d.getDay()]} ${MM[d.getMonth()]}</span></div>
      <div class="tx"><span class="tag" style="background:${COL[s.tipo] || 'var(--tx3)'}"></span>${esc(s.testo)}${s.sub ? `<small>${esc(s.sub)}</small>` : ''}</div></li>`; }).join('') || '<li class="vuoto">Nessuna scadenza nelle prossime 4 settimane</li>'}</ul>
    ${riun ? `<h3>Riunioni</h3><div>${riun}</div>` : ''}
    ${(f.eventi || []).length ? '' : '<h3>Eventi</h3><div class="vuoto" style="padding:0">Nessun evento in calendario</div>'}`;
}

function rGiro(g) {
  const el = document.getElementById('giro');
  if (!g) { el.innerHTML = ''; return; }
  const a = d0(g.inizio), b = d0(g.fine), t = d0(oggiISO());
  const pct = Math.max(0, Math.min(100, (t - a) / (b - a) * 100));
  const rest = diffGG(g.fine);
  el.innerHTML = `<div class="lbl">Giro in corso <b>${esc(g.nome)} · ${esc(g.mese_uscita || '')}</b></div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="sub"><span>${fmt(g.inizio)}</span><span>${rest > 0 ? `fine giro tra ${rest} gg` : rest === 0 ? 'fine giro OGGI' : 'giro chiuso'} · dati agli editori ${fmt(g.dati_a_editori)}</span><span>${fmt(g.fine)}</span></div>`;
}

function render(f, offline) {
  rGiro(f.giro_in_corso); rTrasm(f.da_trasmettere, f.prossima_iscrizione); rUscita(f.in_uscita); rAgenda(f);
  document.body.classList.toggle('offline', !!offline);
  const t = new Date(f.generato).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  document.getElementById('ft').textContent = (offline ? 'Non aggiornato · ultimo dato ' : 'Aggiornato ') + t;
}

async function carica() {
  try {
    let r;
    if (DEMO) r = await fetch(DEMO, { cache: 'no-store' });
    else {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { document.body.classList.add('da-login'); return; }
      r = await fetch(FEED, { cache: 'no-store', headers: { Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_KEY } });
      if (r.status === 401) { document.body.classList.add('da-login'); return; }
      if (r.status === 403) { document.getElementById('ft').textContent = 'Utente non abilitato allo sfondo'; return; }
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const f = await r.json();
    if (f.error) throw new Error(f.error);
    try { localStorage.setItem('pde_sfondo_feed', JSON.stringify(f)); } catch (_) {}
    render(f, false);
  } catch (e) {
    let f = null;
    try { f = JSON.parse(localStorage.getItem('pde_sfondo_feed') || 'null'); } catch (_) {}
    if (f) render(f, true);
    else document.getElementById('ft').textContent = 'Dati non disponibili, riprovo tra poco';
  }
}

document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('lerr'); err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('le').value.trim(), password: document.getElementById('lp').value });
  if (error) { err.textContent = 'Credenziali non valide'; return; }
  document.getElementById('lp').value = '';
  document.body.classList.remove('da-login');
  carica();
});

orologio(); setInterval(orologio, 15000);
carica(); setInterval(carica, AGGIORNA_MIN * 60000);
// ricarica completa ogni 6 ore per prendere eventuali aggiornamenti della pagina
setTimeout(() => location.reload(), 6 * 3600000);
</script>
</body>
</html>
