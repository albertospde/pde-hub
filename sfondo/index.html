<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PDE · Sfondo settimana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/pde-app-logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eef2f8; --bg2: #f8fafd; --card: #ffffff; --line: rgba(15, 28, 77, .10);
    --tx: #0f1c4d; --tx2: #4a5b78; --tx3: #8391a8;
    --blu: #1f6fe5; --ciano: #0089bd; --verde: #158a62; --ambra: #c2740a; --rosso: #d23c3c; --viola: #6b4fd1;
    /* spazio libero a sinistra per icone di app e cartelle, e in basso per la barra applicazioni */
    --pad-sx: 12vw; --pad-dx: 1.8vw; --pad-top: 2.6vh; --pad-bot: 7vh;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: Montserrat, "Segoe UI", sans-serif; color: var(--tx); font-size: clamp(10px, .72vw, 16px);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(41,169,225,.12), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(31,111,229,.08), transparent 60%),
      linear-gradient(160deg, var(--bg2), var(--bg));
    pointer-events: none; user-select: none; -webkit-user-select: none; cursor: default;
  }
  .wrap { position: absolute; inset: var(--pad-top) var(--pad-dx) var(--pad-bot) var(--pad-sx);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 1.4vh 1.2vw; }

  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .logo-box { background: #fff; border-radius: 10px; padding: .5em .85em; display: inline-flex; box-shadow: 0 1px 3px rgba(15,28,77,.08); }
  .logo-box .pde-logo { font-size: clamp(12px, .9vw, 18px); }
  .ora { text-align: right; }
  .ora .h { font-size: 3.4em; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  .ora .d { font-size: 1.1em; color: var(--tx2); margin-top: .25em; text-transform: capitalize; }
  .giro { flex: 1; max-width: 44em; }
  .giro .lbl { font-size: .85em; color: var(--tx2); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; }
  .giro .lbl b { color: var(--tx); letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 1.15em; }
  .bar { height: 6px; background: rgba(15,28,77,.08); border-radius: 9px; margin: .5em 0 .3em; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--blu), var(--ciano)); }
  .giro .sub { font-size: .85em; color: var(--tx3); display: flex; justify-content: space-between; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.1em 1.3em;
    display: flex; flex-direction: column; min-height: 0; box-shadow: 0 1px 3px rgba(15,28,77,.06), 0 8px 24px rgba(15,28,77,.05); }
  .kicker { font-size: .78em; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: .6em; }
  .kicker .dot { width: .6em; height: .6em; border-radius: 50%; }
  .titolo-card { display: flex; align-items: baseline; gap: .8em; margin: .25em 0 .7em; flex-wrap: wrap; }
  .titolo-card h2 { font-size: 2.1em; font-weight: 700; letter-spacing: -.02em; }
  .titolo-card span { color: var(--tx2); }
  .titolo-card b { color: var(--tx); font-weight: 600; }
  .chip { display: inline-block; font-size: .75em; padding: .15em .6em; border-radius: 99px; font-weight: 600; background: rgba(15,28,77,.06); color: var(--tx2); }
  .vuoto { color: var(--tx3); font-style: italic; padding: .6em 0; }

  /* usciti: tutta la metà sinistra, due colonne, carattere adattato perché entri tutto */
  #usciti { grid-row: 2 / span 2; }
  #elenco { flex: 1; min-height: 0; column-count: 2; column-gap: 2em; column-fill: auto; overflow: hidden; column-rule: 1px solid var(--line); }
  .ed { break-inside: avoid; margin-bottom: .55em; }
  .ed h4 { font-size: .78em; color: var(--blu); letter-spacing: .08em; font-weight: 600; text-transform: uppercase; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: .15em; margin-bottom: .15em; }
  .ed h4 small { color: var(--tx3); letter-spacing: 0; font-weight: 500; }
  .ti { display: flex; justify-content: space-between; gap: .8em; line-height: 1.35; }
  .ti span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: lowercase; }
  .ti span::first-letter { text-transform: uppercase; }
  .ti span em { font-style: normal; color: var(--tx3); text-transform: none; }
  .ti b { font-weight: 500; color: var(--tx2); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* calendario lanci */
  #cal { min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { font-size: .72em; color: var(--tx3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; text-align: left; padding: .35em .5em; border-bottom: 1px solid var(--line); }
  th.g { text-align: center; color: var(--tx2); border-bottom: 0; padding-bottom: 0; }
  td { padding: .38em .5em; border-bottom: 1px solid rgba(15,28,77,.06); white-space: nowrap; }
  td.n { font-weight: 700; font-size: 1.05em; }
  tr.passato td { color: var(--tx3); }
  tr.uscita td { background: rgba(21,138,98,.08); }
  tr.uscita td:first-child { box-shadow: inset 3px 0 0 var(--verde); }
  tr.corrente td { background: rgba(0,137,189,.10); font-weight: 600; }
  tr.corrente td:first-child { box-shadow: inset 3px 0 0 var(--ciano); }
  td .st { color: var(--tx3); font-weight: 400; }
  td.tag { font-size: .78em; font-weight: 600; }
  .focus { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6em; margin: .2em 0 .8em; }
  .focus div { background: rgba(0,137,189,.05); border: 1px solid rgba(0,137,189,.25); border-radius: 10px; padding: .5em .7em; }
  .focus span { display: block; font-size: .7em; color: var(--tx2); letter-spacing: .08em; text-transform: uppercase; }
  .focus b { font-size: 1.15em; font-weight: 600; }
  .focus i { display: block; font-style: normal; font-size: .78em; font-weight: 600; margin-top: .1em; }

  /* prossime 2 settimane: compatto */
  #scad { padding: .8em 1.1em; }
  #scad .kicker { font-size: .7em; margin-bottom: .5em; color: var(--tx2); }
  .sc { display: grid; grid-template-columns: 1fr 1fr; gap: .15em 1.6em; font-size: .88em; }
  .sc div { display: flex; gap: .6em; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .sc div b { width: 5.6em; flex-shrink: 0; color: var(--tx2); font-weight: 600; }
  .sc div span { overflow: hidden; text-overflow: ellipsis; }
  .sc div.oggi b { color: var(--ciano); }
  .tg { display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .4em; }
  .riu { margin-top: .5em; font-size: .85em; color: var(--tx2); }
  .riu b { color: var(--viola); font-weight: 600; }

  footer { position: absolute; right: var(--pad-dx); bottom: calc(var(--pad-bot) - 2em); font-size: .72em; color: var(--tx3); }
  .offline footer { color: var(--ambra); }

  #login { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(238,242,248,.88); z-index: 10; pointer-events: auto; }
  body.da-login #login { display: flex; }
  body.da-login { pointer-events: auto; }
  #login form { background: #fff; box-shadow: 0 10px 40px rgba(15,28,77,.15); border: 1px solid var(--line); border-radius: 16px; padding: 2em 2.2em; width: 26em; display: flex; flex-direction: column; gap: .8em; }
  #login h1 { font-size: 1.4em; font-weight: 600; }
  #login p { color: var(--tx2); font-size: .9em; line-height: 1.4; }
  #login input { font: inherit; padding: .7em .9em; border-radius: 9px; border: 1px solid var(--line); background: #f8fafd; color: var(--tx); user-select: text; -webkit-user-select: text; }
  #login button { font: inherit; font-weight: 600; padding: .75em; border: 0; border-radius: 9px; background: var(--blu); color: #fff; cursor: pointer; }
  #login .err { color: var(--rosso); font-size: .85em; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-box"><div class="pde-logo" role="img" aria-label="PDE Settimana"><div class="pl-text"><div class="pl-name"><b>PDE</b><span>SETTIMANA</span></div><div class="pl-tag"><i class="c0">LANCI.</i><em>I</em><i class="c1">USCITE.</i><em>I</em><i class="c2">SCADENZE.</i></div></div><div class="pl-wing"></div></div></div>
    <div class="giro" id="giro"></div>
    <div class="ora"><div class="h" id="h">--:--</div><div class="d" id="d"></div></div>
  </header>
  <section class="card" id="usciti"></section>
  <section class="card" id="cal"></section>
  <section class="card" id="scad"></section>
</div>
<footer id="ft"></footer>
<div id="login"><form id="lf" autocomplete="on">
  <h1>Accedi a PDE Settimana</h1>
  <p>Usa le credenziali PDE. Serve solo la prima volta: poi lo sfondo resta collegato e non è più cliccabile.</p>
  <input id="le" type="email" placeholder="nome.cognome@pde.it" required autocomplete="username">
  <input id="lp" type="password" placeholder="Password" required autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button type="submit">Accedi</button>
</form></div>

<script>
// Sfondo dinamico PDE: sola lettura, accesso solo con account PDE
const SUPABASE_URL = 'https://tdflwenlylhctxssatax.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmx3ZW5seWxoY3R4c3NhdGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzgyNzYsImV4cCI6MjA5MTkxNDI3Nn0.l35qEL7LOvyYuI1McQlVqj4vbyTqmlevcmqWbTGYi2Q';
const FEED = SUPABASE_URL + '/functions/v1/sfondo-feed';
const P = new URLSearchParams(location.search);
const DEMO = P.get('demo'); // file json locale per prove
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pde-sfondo-auth' } });
const AGGIORNA_MIN = 10;

// blocca qualsiasi interazione, tranne durante il login
['contextmenu','mousedown','keydown','wheel','dragstart','selectstart'].forEach(ev =>
  addEventListener(ev, e => { if (!document.body.classList.contains('da-login')) e.preventDefault(); }, { capture: true, passive: false }));

const GG = ['dom','lun','mar','mer','gio','ven','sab'];
const MM = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const d0 = s => new Date(s + 'T12:00:00');
const fmt = s => { if (!s) return '—'; const d = d0(s); return `${GG[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`; };
const corta = s => { if (!s) return '—'; const d = d0(s); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
const num = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const oggiISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const diffGG = s => Math.round((d0(s) - d0(oggiISO())) / 864e5);
const traGG = s => { const g = diffGG(s); return g < 0 ? 'fatto' : g === 0 ? 'oggi' : g === 1 ? 'domani' : `tra ${g} gg`; };
const colGG = s => { const g = diffGG(s); return g < 0 ? 'var(--tx3)' : g <= 2 ? 'var(--rosso)' : g <= 5 ? 'var(--ambra)' : 'var(--verde)'; };

function orologio() {
  const d = new Date();
  document.getElementById('h').textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('d').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function rGiro(g) {
  const el = document.getElementById('giro');
  if (!g) { el.innerHTML = ''; return; }
  const a = d0(g.inizio), b = d0(g.fine), t = d0(oggiISO());
  const pct = Math.max(0, Math.min(100, (t - a) / (b - a) * 100));
  const rest = diffGG(g.fine);
  el.innerHTML = `<div class="lbl">Giro in corso <b>${esc(g.nome)} · ${esc(g.mese_uscita || '')}</b></div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <div class="sub"><span>${fmt(g.inizio)}</span><span>${rest > 0 ? `fine giro tra ${rest} gg` : rest === 0 ? 'fine giro OGGI' : 'giro chiuso'} · dati agli editori ${fmt(g.dati_a_editori)}</span><span>${fmt(g.fine)}</span></div>`;
}

// titoli usciti in settimana, raggruppati per editore, su due colonne
function rUsciti(arr) {
  const el = document.getElementById('usciti');
  const titoli = (arr || []).flatMap(l => l.titoli.map(t => ({ ...t, lancio: l.numero })));
  const lanci = (arr || []).map(l => `lancio ${l.numero}`).join(' + ');
  const l0 = (arr || [])[0];
  const quando = l0 ? (l0.vendita_sopra === l0.vendita_sotto ? `in libreria <b>${fmt(l0.vendita_sopra)}</b>`
    : `in libreria <b>${fmt(l0.vendita_sopra)}</b> (&gt; 2.000) · <b>${fmt(l0.vendita_sotto)}</b> (&lt; 2.000)`) : '';
  const gruppi = [];
  for (const t of titoli.sort((a, b) => a.editore.localeCompare(b.editore, 'it') || a.titolo.localeCompare(b.titolo, 'it'))) {
    const g = gruppi[gruppi.length - 1];
    if (g && g.editore === t.editore) g.titoli.push(t); else gruppi.push({ editore: t.editore, titoli: [t] });
  }
  el.innerHTML = `
    <div class="kicker" style="color:var(--verde)"><span class="dot" style="background:var(--verde)"></span>Usciti questa settimana</div>
    <div class="titolo-card"><h2>${titoli.length ? `${titoli.length} titoli` : 'Nessuna uscita'}</h2>
      <span>${esc(lanci)}${quando ? ' · ' + quando : ''} · ${gruppi.length} editori</span>
      ${l0 && l0.uscita_stimata ? '<span class="chip">data stimata</span>' : ''}</div>
    <div id="elenco">${gruppi.map(g => `<div class="ed"><h4>${esc(g.editore)}<small>${g.titoli.length}</small></h4>
      ${g.titoli.map(t => `<div class="ti"><span>${esc(t.titolo)}${t.autore ? ` <em>· ${esc(t.autore)}</em>` : ''}</span><b>${num(t.prenotato)}</b></div>`).join('')}</div>`).join('')}</div>`;
  adatta();
}

// riduce il carattere dell'elenco finché tutti i titoli entrano nelle due colonne
function adatta() {
  const el = document.getElementById('elenco');
  if (!el) return;
  let size = 15;
  el.style.fontSize = size + 'px';
  while (size > 8 && (el.scrollWidth > el.clientWidth + 2 || el.scrollHeight > el.clientHeight + 2)) {
    size -= 0.25; el.style.fontSize = size + 'px';
  }
}

function rCal(cal) {
  const el = document.getElementById('cal');
  const c = (cal || []).find(l => l.corrente);
  const focus = c ? `
    <div class="kicker" style="color:var(--ciano)"><span class="dot" style="background:var(--ciano)"></span>Lancio della settimana</div>
    <div class="titolo-card"><h2>Lancio ${c.numero}</h2><span>${esc(c.note || '')}</span></div>
    <div class="focus">
      <div><span>Iscrizione</span><b>${fmt(c.iscrizione)}</b><i style="color:${colGG(c.iscrizione)}">${traGG(c.iscrizione)}</i></div>
      <div><span>Consegna mag.</span><b>${c.mag_sopra ? fmt(c.mag_sopra) : '—'}</b><i style="color:${c.mag_sopra ? colGG(c.mag_sopra) : 'var(--tx3)'}">${c.mag_sopra ? traGG(c.mag_sopra) + (c.mag_sotto && c.mag_sotto !== c.mag_sopra ? ' · &lt;2.000 ' + corta(c.mag_sotto) : '') : 'da calendario'}</i></div>
      <div><span>Consegna libreria</span><b>${c.lib_sopra ? fmt(c.lib_sopra) : '—'}</b><i style="color:var(--tx3)">${c.lib_sotto && c.lib_sotto !== c.lib_sopra ? '&lt;2.000 ' + corta(c.lib_sotto) : '&nbsp;'}</i></div>
      <div><span>In libreria</span><b>${fmt(c.vendita_sopra)}</b><i style="color:${colGG(c.vendita_sopra)}">${c.uscita_stimata ? 'stima · ' : ''}${traGG(c.vendita_sopra)}</i></div>
    </div>` : '';
  const righe = (cal || []).map(l => {
    const cls = l.corrente ? 'corrente' : l.in_uscita ? 'uscita' : l.passato ? 'passato' : '';
    const tag = l.corrente ? '<span style="color:var(--ciano)">questa settimana</span>' : l.in_uscita ? '<span style="color:var(--verde)">in uscita</span>' : '';
    const st = l.uscita_stimata ? '<span class="st">~</span>' : '';
    return `<tr class="${cls}"><td class="n">${l.numero}</td><td>${fmt(l.iscrizione)}</td>
      <td>${corta(l.mag_sopra)}</td><td>${corta(l.mag_sotto)}</td>
      <td>${st}${corta(l.vendita_sopra)}</td><td>${st}${corta(l.vendita_sotto)}</td><td class="tag">${tag}</td></tr>`;
  }).join('');
  el.innerHTML = focus + `
    <div class="kicker" style="color:var(--tx2);margin-bottom:.3em">Calendario lanci</div>
    <table><thead>
      <tr><th></th><th></th><th class="g" colspan="2">Consegna mag.</th><th class="g" colspan="2">In libreria</th><th></th></tr>
      <tr><th>N°</th><th>Iscrizione</th><th>&gt; 2.000</th><th>&lt; 2.000</th><th>&gt; 2.000</th><th>&lt; 2.000</th><th></th></tr>
    </thead><tbody>${righe}</tbody></table>`;
}

const COL = { iscrizione: 'var(--ciano)', magazzino: 'var(--ambra)', uscita: 'var(--verde)', giro: 'var(--blu)', evento: 'var(--viola)' };
function rScad(f) {
  const el = document.getElementById('scad');
  const oggi = oggiISO();
  const s = (f.scadenze || []);
  const riu = (f.riunioni || []).map(r => `<b>Riunioni ${esc(r.giro)}</b>: ${esc(r.quando)}`).join(' · ');
  el.innerHTML = `<div class="kicker">Prossime 2 settimane</div>
    <div class="sc">${s.map(x => `<div class="${x.data === oggi ? 'oggi' : ''}"><b>${fmt(x.data)}</b><span><i class="tg" style="background:${COL[x.tipo] || 'var(--tx3)'}"></i>${esc(x.testo)}${x.sub ? ' · ' + esc(x.sub) : ''}</span></div>`).join('') || '<div class="vuoto">Nessuna scadenza</div>'}</div>
    ${riu ? `<div class="riu">${riu}</div>` : ''}`;
}

function render(f, offline) {
  rGiro(f.giro_in_corso); rCal(f.calendario); rScad(f); rUsciti(f.usciti);
  document.body.classList.toggle('offline', !!offline);
  const t = new Date(f.generato).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  document.getElementById('ft').textContent = (offline ? 'Non aggiornato · ultimo dato ' : 'Aggiornato ') + t;
}

async function carica() {
  try {
    let r;
    if (DEMO) r = await fetch(DEMO, { cache: 'no-store' });
    else {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { document.body.classList.add('da-login'); return; }
      r = await fetch(FEED, { cache: 'no-store', headers: { Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_KEY } });
      if (r.status === 401) { document.body.classList.add('da-login'); return; }
      if (r.status === 403) { document.getElementById('ft').textContent = 'Utente non abilitato allo sfondo'; return; }
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const f = await r.json();
    if (f.error) throw new Error(f.error);
    try { localStorage.setItem('pde_sfondo_feed_v4', JSON.stringify(f)); } catch (_) {}
    render(f, false);
  } catch (e) {
    let f = null;
    try { f = JSON.parse(localStorage.getItem('pde_sfondo_feed_v4') || 'null'); } catch (_) {}
    if (f) render(f, true);
    else document.getElementById('ft').textContent = 'Dati non disponibili, riprovo tra poco';
  }
}

document.getElementById('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('lerr'); err.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('le').value.trim(), password: document.getElementById('lp').value });
  if (error) { err.textContent = 'Credenziali non valide'; return; }
  document.getElementById('lp').value = '';
  document.body.classList.remove('da-login');
  carica();
});

addEventListener('resize', adatta);
orologio(); setInterval(orologio, 15000);
carica(); setInterval(carica, AGGIORNA_MIN * 60000);
setTimeout(() => location.reload(), 6 * 3600000);
</script>
</body>
</html>
